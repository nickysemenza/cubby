# fly.toml app configuration file generated for usda-db on 2025-09-12T13:13:09-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'usda-db'
primary_region = 'sjc'

[build]
  dockerfile = 'apps/usda-api/Dockerfile'

[env]
  DATABASE_PATH = '/data/usda.sqlite'
  # R2 configuration for optimized downloads
  R2_ACCOUNT_ID = '9f10f078d35d86c78dedece2300a6b88'
  AWS_ACCESS_KEY_ID = '650819737caf5b47afaf1b4c30b0bfdb'
  R2_BUCKET = 'usda-sqlite'
  R2_OBJECT_KEY = 'usda.sqlite.zst'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  grace_period = '15m'
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # size = 'performance-16x'
  size = 'shared-cpu-2x'
