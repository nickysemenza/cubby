# fly.toml app configuration file generated for usda-db on 2025-09-12T13:13:09-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'usda-db'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/usda.sqlite'
  USDA_DB_URL = 'https://usda-sqlite.nickysemenza.com/usda.sqlite.gz'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  grace_period = '15m'
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
