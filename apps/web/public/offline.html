<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f9fc" />
    <title>Offline · Cubby</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #fff;
        --ink: #171a21;
        --muted: #667085;
        --hairline: #d9dee7;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 24rem;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: var(--surface);
        padding: 2rem;
      }
      svg {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.02em;
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.75rem;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        appearance: none;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--surface);
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.4rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background 120ms cubic-bezier(0.2, 0, 0, 1);
      }
      button:hover {
        background: color-mix(in oklab, var(--accent) 88%, var(--ink));
      }
      button:focus-visible {
        outline: 2px solid var(--surface);
        box-shadow: 0 0 0 4px var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect
          x="2"
          y="2"
          width="60"
          height="60"
          rx="8"
          fill="#ffffff"
          stroke="#d9dee7"
          stroke-width="1.5"
        />
        <rect x="9" y="10" width="46" height="2" rx="1" fill="#d9dee7" />
        <rect x="9" y="30" width="46" height="2" rx="1" fill="#d9dee7" />
        <rect x="9" y="50" width="46" height="2" rx="1" fill="#d9dee7" />
        <rect x="12" y="15" width="10" height="13" rx="2" fill="#2563eb" />
        <circle cx="32" cy="22" r="6" fill="#16845b" />
        <rect x="42" y="17" width="10" height="11" rx="2" fill="#6d5bd0" />
        <circle cx="16" cy="42" r="5" fill="#147d92" />
        <rect x="26" y="35" width="12" height="13" rx="2" fill="#d97706" />
        <rect x="44" y="38" width="8" height="10" rx="2" fill="#b5477c" />
      </svg>
      <h1>You're offline</h1>
      <p>
        Cubby needs a connection to load this page. Check your network and try
        again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
