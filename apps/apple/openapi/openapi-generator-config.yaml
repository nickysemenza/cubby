# Generated by `pnpm generate` — do not edit.
# Every resources.*.{list,get,create,update,timeline} operation in the HTTP
# document, plus the RPC ids flagged `native:` in apps/web/src/contracts.
generate:
  - types
  - client
# These land in the CubbyAPI target; `public` lets CubbyKit and the App name them
# through the generated aliases in CubbyKit/Generated/APITypes.swift.
accessModifier: public
namingStrategy: idiomatic
additionalImports:
  - CubbyAPISupport
typeOverrides:
  schemas:
    Entity: CubbyAPISupport.EntityKey
    ImageShortcode: CubbyAPISupport.ImageCode
    InventoryShortcode: CubbyAPISupport.InventoryEntryCode
    LocationShortcode: CubbyAPISupport.LocationCode
    PlainDate: CubbyAPISupport.PlainDate
    ProductShortcode: CubbyAPISupport.ProductCode
    SearchableEntity: Swift.String
