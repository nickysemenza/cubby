appId: com.nickysemenza.cubby
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Find"
    timeout: 60000
- tapOn: "Find"
- tapOn: "Search Cubby"
- inputText: "Synthetic Atlas Lantern"
- extendedWaitUntil:
    visible:
      id: "search.result.${PRODUCT_ID}"
    timeout: 30000
- tapOn:
    id: "search.result.${PRODUCT_ID}"
- extendedWaitUntil:
    visible:
      id: "detail.product.edit"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "field.explanation.product.${PRODUCT_ID}.price"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "field.explanation.product.${PRODUCT_ID}.price"
- extendedWaitUntil:
    visible:
      id: "field.explanation.popover"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "field.explanation.state"
    timeout: 30000
- assertVisible:
    id: "field.explanation.effective-value"
- assertVisible: "\\$40\\.00"
- assertVisible: "Overrides inherited"
- scrollUntilVisible:
    element:
      id: "field.explanation.fallback-value"
    direction: DOWN
    timeout: 30000
- assertVisible: "\\$25\\.00"
- scrollUntilVisible:
    element:
      id: "field.explanation.close"
    direction: UP
    timeout: 30000
- tapOn:
    id: "field.explanation.close"
- assertNotVisible:
    id: "field.explanation.popover"
- scrollUntilVisible:
    element:
      id: "relation.evidence.purchase.${PURCHASE_ID}.movement.acquired"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.purchase.${PURCHASE_ID}.movement.adjusted"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.purchase.${PURCHASE_ID}.planned"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.purchase.${PURCHASE_ID}.linked"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.row.purchase.${PURCHASE_ID}"
    direction: UP
    timeout: 30000
- tapOn:
    id: "entity.row.title.purchase.${PURCHASE_ID}"
- extendedWaitUntil:
    visible:
      id: "detail.purchase.edit"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.product.${PRODUCT_ID}.movement.acquired"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.product.${PRODUCT_ID}.movement.adjusted"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.product.${PRODUCT_ID}.planned"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "relation.evidence.product.${PRODUCT_ID}.linked"
    direction: DOWN
    timeout: 30000
