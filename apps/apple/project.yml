# XcodeGen spec for the Cubby native app. `xcodegen generate --spec apps/apple/project.yml`
# writes Cubby.xcodeproj (gitignored). Two app targets share one template: App/Shared is common,
# App/iOS and App/macOS hold the platform chrome. All shared logic lives in the local CubbyKit
# package; the app targets are chrome.
#
# The targets are spelled out (not `platform: [iOS, macOS]`) because entitlements differ per
# platform and must be hand-written files: the macOS sandbox keys are invalid on iOS, and an iOS
# simulator app carrying them fails to spawn with no error (a hanging `simctl launch`, black screen).
name: Cubby
options:
  bundleIdPrefix: com.nickysemenza
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # The xcframework and generated sources come from outside the Xcode build graph.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # build-rust.sh produces Apple-silicon slices only (no x86_64 simulator), so a
    # `generic/platform=iOS Simulator` build must not try to link an Intel slice.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Y9A97FXT63
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

packages:
  CubbyKit:
    path: CubbyKit
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.28.0"
  Nuke:
    url: https://github.com/kean/Nuke
    from: "13.2.0"

targetTemplates:
  CubbyApp:
    type: application
    sources:
      - path: App/Shared
      - path: App/${plat}
        excludes: ["Cubby.entitlements", "Info.plist"]
      - path: App/Assets.xcassets
      # Layered Liquid Glass icon (Icon Composer format). Same name as the PNG AppIcon set in
      # the asset catalog, which stays as the fallback for anything that cannot render layers.
      - path: App/AppIcon.icon
    info:
      path: App/${plat}/Info.plist
      properties:
        CFBundleDisplayName: Cubby
        # Deep links (`cubby://entity/PRD-…`, capture, audit, today). `cubby-mobile://` is the auth
        # Origin, not a scheme. Info.plist is generated from here; do not hand-edit it.
        CFBundleURLTypes:
          - CFBundleURLName: com.nickysemenza.cubby
            CFBundleURLSchemes: [cubby]
        NSCameraUsageDescription: Cubby scans barcodes to add items to a location.
        NSPhotoLibraryUsageDescription: Cubby uses selected photos for garden journals and product images.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        # iOS 26's resize model requires all four orientations, upside-down included (Xcode
        # warning: "All interface orientations must be supported unless the app requires full
        # screen"). Do not add UIRequiresFullScreen as a way around this.
        UISupportedInterfaceOrientations:
          [
            UIInterfaceOrientationPortrait,
            UIInterfaceOrientationPortraitUpsideDown,
            UIInterfaceOrientationLandscapeLeft,
            UIInterfaceOrientationLandscapeRight,
          ]
        LSMinimumSystemVersion: "26.0"
        # XcodeGen otherwise hardcodes 1.0/1 here, orphaning MARKETING_VERSION and
        # CURRENT_PROJECT_VERSION above. The TestFlight workflow overrides both values from the
        # release tag and commit/run-attempt build coordinates; these remain local defaults.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only HTTPS via URLSession (exempt); answers App Store Connect's export-compliance
        # question at upload so every TestFlight build skips the prompt.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: CubbyKit
        product: CubbyKit
      # App targets only: CubbyKit is a non-MainActor package that also builds the `cubby` CLI,
      # so it stays SDK-free. CubbyKit errors are reported at the app layer, where they are
      # already caught (`Diagnostics.report`).
      - package: Sentry
        product: Sentry
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickysemenza.cubby
        PRODUCT_NAME: Cubby
        # Hand-written per platform; see the header comment.
        CODE_SIGN_ENTITLEMENTS: App/${plat}/Cubby.entitlements
        # App code is MainActor by default (Swift 6.2); CubbyKit deliberately is not.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
          # Surfaces slow type-checking and slow function bodies in the issue navigator so
          # CubbyKit's ~60k generated lines don't quietly regress compile times.
          OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200"
        Release:
          # Xcode's Release default, pinned so Sentry symbolication cannot silently break.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          # Keep signing overrides on the app target. Passing these as global xcodebuild
          # settings also applies the app profile to SwiftPM resource-bundle targets.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: Y9A97FXT63
          PROVISIONING_PROFILE_SPECIFIER: "$(CUBBY_PROVISIONING_PROFILE_SPECIFIER)"
    postBuildScripts:
      # Archives only (`runOnlyWhenInstalling`): a Debug build has no dSYM to upload. Org + auth
      # come from the org token in ~/.sentryclirc — Xcode run scripts do not inherit the shell
      # env — so only the project is exported here.
      - name: Upload dSYMs to Sentry
        runOnlyWhenInstalling: true
        # The upload has no output file, so declare it unconditional rather than let Xcode
        # warn about missing outputs on every archive.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${EXECUTABLE_NAME}"
        script: |
          if [[ "$(uname -m)" == arm64 ]]; then export PATH="/opt/homebrew/bin:$PATH"; fi
          if which sentry-cli >/dev/null; then
            export SENTRY_PROJECT=cubby-apple
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then echo "warning: sentry-cli - $ERROR"; fi
          else
            echo "warning: sentry-cli not installed: brew install getsentry/tools/sentry-cli"
          fi

targets:
  Cubby-iOS:
    templates: [CubbyApp]
    templateAttributes:
      plat: iOS
    platform: iOS
    # Home-screen Quick Actions. `AppDelegate`/`SceneDelegate` (App/iOS/AppDelegate.swift) map
    # `shortcutItem.type` back through `CubbyLink`, so each type here must be a valid `cubby://`
    # link. iOS-only: merged (deep-merge, not replaced) with the shared template's `info.properties`.
    info:
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.nickysemenza.cubby.photo-matching
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - processing
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: cubby://capture
            UIApplicationShortcutItemTitle: Scan
            UIApplicationShortcutItemIconSymbolName: barcode.viewfinder
          - UIApplicationShortcutItemType: cubby://audit
            UIApplicationShortcutItemTitle: Start audit
            UIApplicationShortcutItemIconSymbolName: checklist
          - UIApplicationShortcutItemType: cubby://search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
    settings:
      configs:
        # Lets `Cubby-iOS-Tests` `@testable import Cubby` to reach internal preview/content
        # sub-views (e.g. `SearchContent`, `PreviewFixtures`). iOS-only: the
        # macOS target has no test bundle, so its Debug config is untouched.
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: CubbyLiveActivity
        embed: true
  CubbyLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: App/LiveActivity
      - path: App/iOS/DeviceWorkAttributes.swift
    info:
      path: App/LiveActivity/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickysemenza.cubby.LiveActivity
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  Cubby-macOS:
    templates: [CubbyApp]
    templateAttributes:
      plat: macOS
    platform: macOS
    info:
      properties:
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Cubby opens a dedicated browser window to capture signed-in order evidence you request.
  # Tests for iOS-only screens. Hosted by Cubby-iOS so `@testable import Cubby`
  # and `.environment`/`AppModel` work exactly as the app's own `#Preview`s do.
  # macOS hosts the cross-platform navigation contracts below.
  Cubby-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
        excludes: ["Photos/Fixtures"]
      - path: App/Tests/Photos/Fixtures
        buildPhase: resources
    dependencies:
      - target: Cubby-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nickysemenza.cubby.tests
        # The PhotoKit parity suite compares imported originals with these fixture bytes.
        COMPRESS_PNG_FILES: NO
        # Matches the host app: SearchModel/SearchContent/etc. assume MainActor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # XcodeGen's auto host-app wiring guesses the app binary is named after the target
        # ("Cubby-iOS"), but `CubbyApp`'s PRODUCT_NAME is "Cubby" for both platforms — override
        # both to the real bundle/executable name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cubby.app/Cubby"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Cubby-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/Navigation
      - path: App/Tests/Browse
      - path: App/Tests/Photos/PhotoDestinationOptionTests.swift
      - path: App/Tests/Photos/EntityPickerIdentityTests.swift
      - path: App/Tests/Photos/PhotoTestStores.swift
    dependencies:
      - target: Cubby-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nickysemenza.cubby.mac-tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cubby.app/Contents/MacOS/Cubby"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cubby-iOS:
    build:
      targets:
        Cubby-iOS: all
        Cubby-iOS-Tests: [test]
    test:
      config: Debug
      environmentVariables:
        CUBBY_TEST_HOST: "1"
      targets:
        - Cubby-iOS-Tests
        # Runs CubbyKit's own package tests through this scheme (hosted CI's
        # `apple-check.sh ci` runs `xcodebuild test` on this scheme instead of
        # a separate `swift test` job); XcodeGen's local-package test syntax.
        - package: CubbyKit/CubbyKitTests
    run:
      config: Debug
  Cubby-macOS:
    build:
      targets:
        Cubby-macOS: all
        Cubby-macOS-Tests: [test]
    test:
      config: Debug
      environmentVariables:
        CUBBY_TEST_HOST: "1"
      targets:
        - Cubby-macOS-Tests
    run:
      config: Debug
  # Launching under LLDB indexes CubbyKit's ~60k generated lines and shows a 10-30s white
  # screen on device. These schemes launch without the debugger for fast UI iteration.
  Cubby-iOS-NoDebugger:
    build:
      targets:
        Cubby-iOS: all
    run:
      config: Debug
      debugEnabled: false
  Cubby-macOS-NoDebugger:
    build:
      targets:
        Cubby-macOS: all
    run:
      config: Debug
      debugEnabled: false
