services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cubby-dev-pg
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cubby_dev
    volumes:
      - cubby-dev-pg-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  cubby-dev-pg-data:
    name: cubby-dev-pg-data
