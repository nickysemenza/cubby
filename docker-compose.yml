services:
  integresql:
    image: ghcr.io/allaboutapps/integresql:latest
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: password
  db:
    # 17 until https://github.com/drizzle-team/drizzle-orm/issues/4944
    image: pgvector/pgvector:pg17
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cubby
    # This database is disposable by construction — IntegreSQL rebuilds every
    # test database from a template, and nothing here is a source of truth. So
    # it is tuned for throughput, not durability.
    #
    # `fsync`/`synchronous_commit`/`full_page_writes` off matter most for
    # `CREATE DATABASE ... TEMPLATE`, which is a physical file copy plus fsync
    # and is the per-file cost IntegreSQL pays 69 times per integration run.
    #
    # Statement logging is deliberately NOT on by default: measured at 18.7 MB
    # of log per integration test file, ~1.1 GB per full run, and it had grown
    # the container's json.log to 56 GB. To debug queries, re-enable it for one
    # session with a compose override rather than making every run pay it:
    #   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
        "-c",
        "shared_buffers=512MB",
        "-c",
        "max_connections=200",
        "-c",
        "log_destination=stderr",
        "-c",
        "log_line_prefix=%t [%p]:[%l] user=%u, db=%d ",
      ]
    # Belt and braces so a future logging change cannot silently eat the disk
    # again.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
  jaeger-all-in-one:
    # Opt-in like the app: it only exports traces when CUBBY_OTEL=1 (see
    # apps/web/instrument.server.mjs), so the container is opt-in too.
    profiles: ["tracing"]
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    restart: always
    ports:
      - "16686:16686"
      - "14268"
      - "14250"
      - "4318:4318"
      - "4317:4317"
