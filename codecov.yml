# Coverage is produced once a week (and on manual coverage runs), aggregated
# into one complete upload by CI. It is intentionally not a PR or deploy gate.
coverage:
  status:
    project:
      default:
        threshold: 2%

ignore:
  - "**/*.config.*"
  - "**/scripts/**"
  - "apps/web/src/components/ui/**"
  - "apps/web/tooling/**"
