# Test jobs publish coverage as workflow artifacts. report-coverage downloads
# every report and sends one complete upload to Codecov, so status/comment
# calculation never sees a partial commit (the old mid-CI red flapping source).
codecov:
  notify:
    after_n_builds: 1
    wait_for_ci: true

# The threshold absorbs small legitimate project-wide drift; patch coverage
# remains the strict signal for changed code.
coverage:
  status:
    project:
      default:
        threshold: 2%

comment:
  after_n_builds: 12
