packages:
  - apps/*
  - packages/*

# Preserve the existing install-script allowlist and warning-only policy.
allowBuilds:
  "@google/genai": false
  "@openrouter/sdk": false
  "@prisma/client": false
  "@prisma/engines": false
  "@sentry/cli": false
  "@swc/core": false
  better-sqlite3: set this to true or false
  better-sqlite3@12.11.1: true
  # v13 bundles native binaries; binding.gyp otherwise triggers an implicit
  # node-gyp rebuild even though no install script is needed.
  better-sqlite3@13.0.3: false
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  nx: false
  prisma: false
  protobufjs: false
  workerd: false
strictDepBuilds: false
minimumReleaseAge: 0

overrides:
  # The mobile SDK pins its driver independently of our CLI; both must use
  # the same patched runner and simulator startup fixes.
  agent-device: 0.21.27
  # better-auth pins @better-auth/core to its own exact version while the
  # @better-auth/* plugins peer on a caret range; auto-installed peers resolve
  # to the newest patch, so whenever better-auth lags core (Renovate skips
  # patches and holds releases 7 days) the tree gets two core copies and an
  # unmet exact @better-fetch/fetch peer. Keep this equal to better-auth in
  # apps/web; Renovate bumps both in the same grouped PR.
  "@better-auth/core": 1.7.9
  # Native Cloudflare configuration and Build Output are a single cutover.
  "@cloudflare/vite-plugin": 2.0.0-beta.v.1
  # GHSA-6qxp-vccf-f47h: bind MCP OAuth credentials to their issuer.
  "@modelcontextprotocol/sdk": ^1.32.1
  # Patched recursive brace parsing used by Nx and transitive minimatch.
  # Covers GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr.
  brace-expansion: ^5.0.12
  effect: ^3.22.2
  esbuild: ^0.28.2
  # GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (host confusion). Transitive via
  # ajv under @modelcontextprotocol/sdk; in-major patch bump from 3.1.3.
  fast-uri: ^4.2.2
  # GHSA-mwp4-54f8-5fhr (leading-zero octets decoded as decimal -> SSRF).
  # Transitive via express-rate-limit under @modelcontextprotocol/sdk; in-major
  # bump from 10.2.0.
  ip-address: ^10.7.4
  lodash: ^4.18.1
  # GHSA-r5fr-rjxr-66jc. Mermaid's Chevrotain parser pins vulnerable 4.17.23.
  lodash-es: ^4.18.1
  next: ^16.4.1
  postcss: ^8.5.30
  qs: ^6.16.1
  rollup: ^4.64.6
  seroval: ^1.6.9
  # GHSA-f88m-g3jw-g9cj / GHSA-rgj7-g3m4-5g8c. The pinned Cloudflare plugin
  # accepts this patched Sharp release even though its last-green lockfile
  # resolved 0.34.5.
  sharp: 0.35.5
  # GHSA-2883-xcg3-v3hh. The dependency graph resolves 4.3.1 through
  # xmlbuilder2 and cosmiconfig; force the maintained major.
  js-yaml@4.3.1: 5.4.3
  zod: 4.6.7
  # GHSA-4cwx-7wf7-3272 and related Undici 7 advisories. Miniflare pins 7.28;
  # force the maintained major.
  undici@7.28.0: 8.12.1
  # GHSA-rfgv-xxqx-mfg5 / GHSA-w293-vg96-wgc3. guarded-fetch (via the agent's
  # pi/Agents SDK tree) pins 7.29.0; keep it on the patched 7.x line.
  undici@7.29.0: 7.30.0
  vite: ^8.3.4
  webpack: ^5.111.1
  wrangler: 4.151.0

# The global store cannot rely on project-local hoisting, so packages that use
# an undeclared dependency at runtime or in their types need it declared here.
packageExtensions:
  # The build plugin requires Babel 7 while Vite uses Babel 8.
  "@sentry/bundler-plugins":
    dependencies:
      "@babel/core": ^7.29.7
  # minimizer-webpack-plugin treats Sharp as an optional peer. Supplying the
  # patched peer here keeps the build graph on the audited release without
  # adding an unused application dependency.
  minimizer-webpack-plugin@5.10.0:
    dependencies:
      sharp: 0.35.4
  # The plugin requires rollup at runtime without declaring it. An unrelated
  # dependency used to supply it through auto-installed peers; Sentry 11 no
  # longer does, which broke loading apps/web/vite.config.ts.
  vite-plugin-top-level-await:
    dependencies:
      rollup: ^4.59.0
  # Their published declarations import an untyped runtime module whose
  # @types package they list only as a devDependency. addMissingPeerTypes
  # covers peers, not regular dependencies, so declare the types here; without
  # them tsc silently types JSONSchema7 and miniflare's WebSocket as any.
  "@ai-sdk/provider":
    dependencies:
      "@types/json-schema": ^7.0.15
  miniflare:
    dependencies:
      "@types/ws": ^8.5.7
  vite-ssr-components:
    peerDependencies:
      vite: ^8.0.10
      hono: ^4.7.10
      react: ^19.1.0
    peerDependenciesMeta:
      hono:
        optional: true
      react:
        optional: true
  "@nivo/line":
    dependencies:
      lodash: ^4.18.0
  "@testing-library/jest-dom":
    peerDependencies:
      vitest: "*"
  "@hookform/resolvers":
    peerDependencies:
      zod: ^4.0.0

# Upstream peer ranges lag the versions Cubby validates in both TypeScript
# engines. Keep these exceptions narrow and remove them when Triplit and Sentry
# publish compatible ranges.
peerDependencyRules:
  allowedVersions:
    "@cloudflare/workers-types": ">=4 <6"
    # better-auth-ui resolves better-call 2.x while the @better-auth/api-key
    # copy nested under it peers on 1.x. Cubby's own api-key plugin is the
    # apps/web dependency, which gets better-call 1.x from better-auth.
    better-call: "2"
    typescript: ">=5 <8"

# Reuse completed dependency graphs across fresh worktrees.
virtualStoreType: global
# An incremental install has dropped a direct dependency's node_modules link
# (apps/web lost content-type). The optimistic fast path then answered every
# later `pnpm install` with "Already up to date" without looking at
# node_modules, so the link stayed missing. Verifying costs ~1s per no-op
# install and relinks anything absent.
optimisticRepeatInstall: false
# The global virtual store keeps TypeScript from finding @types packages next
# to a package that peers on their runtime (react -> @types/react). This links
# the matching @types as an optional peer. It is a setting, not a pnpmfile
# hook, because hosted Renovate resolves with --ignore-pnpmfile.
addMissingPeerTypes: true
# Observation events preserve pg-cloudflare startup ordering; port when upgrading.
patchedDependencies:
  "@tanstack/start-plugin-core@1.171.53": patches/@tanstack__start-plugin-core@1.171.53.patch
  agent-device@0.21.27: patches/agent-device@0.21.27.patch
  agents@0.28.1: patches/agents@0.28.1.patch
  pg-cloudflare@1.4.1: patches/pg-cloudflare@1.4.1.patch
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-start":
    skills: true
  "@tanstack/react-table":
    skills: true
