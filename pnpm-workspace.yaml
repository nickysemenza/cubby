packages:
  - apps/*
  - packages/*

overrides:
  # The 2026-08-01 workerd pulled by newer Cloudflare tooling crashes under the
  # parallel Playwright CI load. Keep the last green toolchain until upstream
  # ships a stable runtime; the app and Worker builds remain independently tested.
  "@cloudflare/vite-plugin": 1.45.1
  effect: ^3.20.0
  esbuild: ^0.28.1
  # GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (host confusion). Transitive via
  # ajv under @modelcontextprotocol/sdk; in-major patch bump from 3.1.3.
  fast-uri: ^3.1.5
  # GHSA-mwp4-54f8-5fhr (leading-zero octets decoded as decimal -> SSRF).
  # Transitive via express-rate-limit under @modelcontextprotocol/sdk; in-major
  # bump from 10.2.0.
  ip-address: ^10.3.1
  lodash: ^4.18.0
  next: ^16.2.6
  postcss: ^8.5.16
  qs: ^6.15.2
  rollup: ^4.59.0
  seroval: ^1.4.1
  # GHSA-f88m-g3jw-g9cj. The pinned Cloudflare plugin accepts this patched
  # Sharp release even though its last-green lockfile resolved 0.34.5.
  sharp@0.34.5: 0.35.2
  # GHSA-4cwx-7wf7-3272 and related Undici 7 advisories. Miniflare pins 7.28;
  # 7.29 is the upstream patched release and remains within the same major.
  undici@7.28.0: 7.29.0
  vite: ^8.0.0
  webpack: ^5.104.1
  wrangler: 4.112.0

packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: ^4.0.0

# Upstream peer ranges lag the versions Cubby validates in both TypeScript
# engines. Keep these exceptions narrow and remove them when Triplit and Sentry
# publish compatible ranges.
peerDependencyRules:
  allowedVersions:
    "@cloudflare/workers-types": ">=4 <6"
    typescript: ">=5 <8"
    # @cloudflare/tanstack-ai 0.2.1 bundles grok/gemini/openrouter/openai
    # adapters peering @tanstack/ai ^0.40; cubby only imports the anthropic
    # adapter, whose @tanstack/ai-anthropic peer requires ^0.41.
    "@tanstack/ai": "^0.41.0"
    # @better-auth/api-key (inside better-auth-ui) peers better-call 1.3.7
    # while better-auth-ui resolves 2.x; cubby uses no API-key features.
    better-call: "2"

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
