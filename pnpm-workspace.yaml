packages:
  - apps/*
  - packages/*

# Preserve the existing install-script allowlist and warning-only policy.
allowBuilds:
  '@google/genai': false
  '@openrouter/sdk': false
  '@prisma/client': false
  '@prisma/engines': false
  '@sentry/cli': false
  '@swc/core': false
  better-sqlite3@12.11.1: true
  # v13 bundles native binaries; binding.gyp otherwise triggers an implicit
  # node-gyp rebuild even though no install script is needed.
  better-sqlite3@13.0.1: false
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  nx: false
  prisma: false
  protobufjs: false
  workerd: false
strictDepBuilds: false
minimumReleaseAge: 0

overrides:
  # better-auth pins @better-auth/core to its own exact version while the
  # @better-auth/* plugins peer on a caret range; auto-installed peers resolve
  # to the newest patch, so whenever better-auth lags core (Renovate skips
  # patches and holds releases 7 days) the tree gets two core copies and an
  # unmet exact @better-fetch/fetch peer. Keep this equal to better-auth in
  # apps/web; Renovate bumps both in the same grouped PR.
  "@better-auth/core": 1.6.25
  # The 2026-08-01 workerd pulled by newer Cloudflare tooling crashes under the
  # parallel Playwright CI load. Keep the last green toolchain until upstream
  # ships a stable runtime; the app and Worker builds remain independently tested.
  "@cloudflare/vite-plugin": 1.51.1
  effect: ^3.20.0
  esbuild: ^0.28.1
  # GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (host confusion). Transitive via
  # ajv under @modelcontextprotocol/sdk; in-major patch bump from 3.1.3.
  fast-uri: ^3.1.6
  # GHSA-mwp4-54f8-5fhr (leading-zero octets decoded as decimal -> SSRF).
  # Transitive via express-rate-limit under @modelcontextprotocol/sdk; in-major
  # bump from 10.2.0.
  ip-address: ^10.3.1
  lodash: ^4.18.0
  next: ^16.2.6
  postcss: ^8.5.16
  qs: ^6.15.2
  rollup: ^4.59.0
  seroval: ^1.4.1
  # GHSA-f88m-g3jw-g9cj / GHSA-rgj7-g3m4-5g8c. The pinned Cloudflare plugin
  # accepts this patched Sharp release even though its last-green lockfile
  # resolved 0.34.5.
  sharp: 0.35.4
  # GHSA-2883-xcg3-v3hh. The dependency graph resolves 4.3.1 through
  # xmlbuilder2 and cosmiconfig; 4.3.2 is the compatible patched release.
  js-yaml@4.3.1: 4.3.2
  # GHSA-4cwx-7wf7-3272 and related Undici 7 advisories. Miniflare pins 7.28;
  # 7.29 is the upstream patched release and remains within the same major.
  undici@7.28.0: 7.29.0
  vite: ^8.0.0
  webpack: ^5.104.1
  wrangler: 4.134.0

# The global store cannot rely on project-local hoisting. The maintained type
# fixer handles published devDependencies; these packages omit that metadata
# and need their React type peer declared explicitly.
packageExtensions:
  # minimizer-webpack-plugin treats Sharp as an optional peer. Supplying the
  # patched peer here keeps the build graph on the audited release without
  # adding an unused application dependency.
  minimizer-webpack-plugin@5.10.0:
    dependencies:
      sharp: 0.35.4
  vite-ssr-components:
    peerDependencies:
