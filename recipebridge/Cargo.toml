[package]
name = "recipebridge"
version = "0.1.0"
# Edition 2024 (matches the ingredient-parser workspace). Edition 2024 makes 1.85
# the hard compiler floor, declared via rust-version. `cargo fix --edition`
# confirmed the migration is code-change-free.
edition = "2024"
rust-version = "1.85"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# Await JS Promises (the cookbook chunk-extraction proxy callback) + drive the
# per-chunk extraction loop concurrently in Rust.
wasm-bindgen-futures = "0.4"
futures = "0.3"
# Generates the boundary .d.ts from the Rust structs below (replacing the old
# hand-written typescript_custom_section). "js" routes the wasm ABI through
# serde-wasm-bindgen, matching how this crate already crosses the boundary.
tsify-next = { version = "0.5", features = ["js"] }

# https://doc.rust-lang.org/cargo/reference/config.html
# override:
# [patch."https://github.com/nickysemenza/ingredient-parser"]
# recipe-scraper = { path = "dev/ingredient-parser/recipe-scraper" }
# ingredient = { path = "dev/ingredient-parser/ingredient-parser" }
#
# Track main (no rev pin). Previously rev-pinned because CI's WASM cache key
# hashed this Cargo.toml, so a moving branch left a stale cached pkg outliving
# an upstream parser change. The cache key now folds in the live upstream HEAD
# SHA (resolved via `git ls-remote` in .github/workflows/ci.yaml), so the key
# changes the moment main moves — a branch dep stays fresh with no manual bump.
# recipebridge/Cargo.lock is gitignored so CI re-resolves to latest main; locally
# the global ~/.cargo/config.toml patch (above) overrides to a working copy.
ingredient = { git = "https://github.com/nickysemenza/ingredient-parser", branch = "main" }
recipe-scraper = { git = "https://github.com/nickysemenza/ingredient-parser", branch = "main" }
# EPUB cookbook extraction — the pure subset only (no reqwest/fs). `chunk_epub`
# + `assemble_recipes` run client-side; the LLM call is proxied through Cubby.
recipe-epub = { git = "https://github.com/nickysemenza/ingredient-parser", branch = "main", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.10 (not 0.11) to share recipe-epub's copy — a version split compiles sha2
# twice into the wasm binary. Used only for chunk-id hashing in epub.rs.
sha2 = "0.10"
serde-wasm-bindgen = "0.6"
wasm-tracing = "2.0.0"
tracing = "0.1.41"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
# Native-target tests (cargo test): the costing + food-mapping modules are pure
# serde/ingredient code, so the parity suite runs without a wasm runtime.
rstest = "0.26"

# Mirror upstream ingredient-parser's gate. A panic at the wasm boundary is a hard
# browser crash, so forbid the macros that produce one in production code. Tests
# legitimately unwrap/expect — allowed via `#![cfg_attr(test, allow(...))]` in
# lib.rs (recipebridge has no separate tests/ dir, only inline `mod tests`).
# `uninlined_format_args` warns on `format!("{}", x)` (no current hits; future
# guard). CI runs `cargo clippy --all-targets -- -D warnings`, so these bite.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
uninlined_format_args = "warn"

# Release profile tuned for the wasm consumer (mirrors ingredient-parser's): LTO +
# a single codegen unit let the linker drop cross-crate dead code, `panic = "abort"`
# removes unwind tables, and `opt-level = "z"` favors download size over raw speed.
# wasm-pack runs wasm-opt on top of this. `cargo test` is unaffected — tests build
# under the `test` profile (derived from `dev`), which keeps unwinding.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# Dev-iteration tuning (mirrors ingredient-parser's). Optimizing dependencies even
# in debug builds keeps `cargo test`/`cargo clippy` fast despite the heavy
# `ingredient`/`serde` deps; a light opt-level on the test profile trims runtime
# without the slow full-release compile. Neither affects the wasm consumer (that's
# `profile.release` above).
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
