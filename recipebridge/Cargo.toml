[package]
name = "recipebridge"
version = "0.1.0"
# Edition 2024 matches the ingredient-parser workspace. No `rust-version`
# floor: rust-toolchain.toml tracks stable, and declaring an MSRV would make
# the edition-2024 resolver hold dependencies back to that older compiler.
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# Generates the boundary .d.ts from the Rust structs below (replacing the old
# hand-written typescript_custom_section). "js" routes the wasm ABI through
# serde-wasm-bindgen, matching how this crate already crosses the boundary.
tsify-next = { version = "0.5", features = ["js"] }

# Pin the shared upstream commit so every CI job builds identical Rust sources.
# Renovate follows main weekly and updates every ref (here and in
# recipebridge-cookbook) together.
#
# To build against a sibling ingredient-parser working copy, drop a gitignored
# cubby/.cargo/config.toml with a
# `[patch."https://github.com/nickysemenza/ingredient-parser"]` table mapping
# each crate to `path = "../ingredient-parser/<crate>"`. Treat it as a
# temporary dev-session tool and remove it afterwards: while it is present cargo
# strips `source =` from Cargo.lock on every build, which dirties the tree and
# fails the clean-tree pre-push gate, and local builds silently diverge from
# the pinned rev CI uses.
ingredient = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "742f8d77e9f4f89aef0a830d6283eedf46fc1959" }
recipe-scraper = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "742f8d77e9f4f89aef0a830d6283eedf46fc1959" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The same HTML parser recipe-scraper already compiles in; `page.rs` walks a
# captured browser DOM with it. Behind `html` (see [features]).
scraper = { version = "0.27.0", optional = true }
url = { version = "2", optional = true }
serde-wasm-bindgen = "0.6"
wasm-tracing = "2.0.0"
tracing = "0.1.41"
console_error_panic_hook = "0.1.7"
# Only the model catalog, usage parsing, and pricing (`ai_usage.rs`). Never the
# `wasm` feature: every `#[wasm_bindgen]` fn it adds would be exported from
# this module too, putting the EPUB pipeline back in the Worker.
cookbook = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "742f8d77e9f4f89aef0a830d6283eedf46fc1959", default-features = false, optional = true }


[features]
# Worker-only capabilities. HTML parsing (`compact_browser_page`,
# `parse_scraped_recipe`) is ~0.8 MB of the wasm binary; `gateway_call_usage`
# needs the cookbook model catalog. The browser build passes
# --no-default-features; native builds (cubby-ffi, tests) keep both.
default = ["html", "ai-usage"]
html = ["dep:scraper", "dep:url"]
ai-usage = ["dep:cookbook"]

[dev-dependencies]
# Native-target tests (cargo test): the costing + food-mapping modules are pure
# serde/ingredient code, so the parity suite runs without a wasm runtime.
rstest = "0.27"

# Mirror upstream ingredient-parser's gate. A panic at the wasm boundary is a hard
# browser crash, so forbid the macros that produce one in production code. Tests
# legitimately unwrap/expect — allowed via `#![cfg_attr(test, allow(...))]` in
# lib.rs (recipebridge has no separate tests/ dir, only inline `mod tests`).
# `uninlined_format_args` warns on `format!("{}", x)` (no current hits; future
# guard). CI runs `cargo clippy --all-targets -- -D warnings`, so these bite.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
uninlined_format_args = "warn"
