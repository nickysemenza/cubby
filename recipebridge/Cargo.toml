[package]
name = "recipebridge"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gif = { version = "0.14.2", default-features = false, features = [
  "std",
], optional = true }
jpeg-encoder = { version = "0.7.1", default-features = false, features = [
  "std",
], optional = true }
# Row streaming for analysis PNGs; the same decoder `image` already links.
png = { version = "0.18.1", optional = true }
image = { version = "0.25.9", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
], optional = true }
ingredient.workspace = true
recipe-types.workspace = true
recipe-scraper.workspace = true
serde.workspace = true
serde_json = "1.0"
# The same HTML parser recipe-scraper already compiles in; `email.rs` walks
# email HTML with it. Behind `html` (see [features]).
scraper = { version = "0.27.0", optional = true }
url = { version = "2", optional = true }
tracing = "0.1.44"
# Only the model catalog, usage parsing, and pricing (`ai_usage.rs`). Never the
# upstream `wasm` feature: every `#[wasm_bindgen]` fn it adds would be exported
# from this module too, putting the EPUB pipeline back in the Worker.
cookbook = { workspace = true, optional = true }

# The JavaScript boundary, all behind `wasm`.
wasm-bindgen = { workspace = true, optional = true }
js-sys = { version = "0.3", optional = true }
# Generates the boundary .d.ts from the Rust structs (replacing the old
# hand-written typescript_custom_section). "js" routes the wasm ABI through
# serde-wasm-bindgen, matching how this crate already crosses the boundary.
tsify-next = { version = "0.5", features = ["js"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-tracing = { version = "2.1.0", optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
# Worker-only capabilities. HTML parsing (`compact_email_html`,
# `parse_scraped_recipe`) stays out of the browser; `gateway_call_usage`
# needs the cookbook model catalog. The Worker wasm build is
# `--features wasm`; the browser build is `--no-default-features --features
# wasm`; cubby-ffi takes `default-features = false` and never `wasm`. Native
# Rust tests retain the defaults, including the model-image codecs.
default = ["html", "ai-usage", "model-images"]
model-images = ["dep:image", "dep:jpeg-encoder", "dep:gif", "dep:png"]
html = ["dep:scraper", "dep:url"]
ai-usage = ["dep:cookbook"]
# The wasm-bindgen exports, Tsify `.d.ts` derives, and wasm init. Upstream
# `wasm` only derives Tsify on boundary types (`Confidence`, `IngredientUsage`,
# `RecipeTimes`) so they cross as-is; it adds no exports.
wasm = [
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:tsify-next",
  "dep:serde-wasm-bindgen",
  "dep:wasm-tracing",
  "dep:console_error_panic_hook",
  "ingredient/wasm",
  "recipe-types/wasm",
]

[dev-dependencies]
# Native-target tests (cargo test): the costing + food-mapping modules are pure
# serde/ingredient code, so the parity suite runs without a wasm runtime.
rstest = "0.27"

# The shared no-panic gate (see the workspace Cargo.toml). Tests legitimately
# unwrap/expect — allowed via `#![cfg_attr(test, allow(...))]` in lib.rs and
# crate-level `allow` attributes in each `tests/` file.
[lints]
workspace = true
