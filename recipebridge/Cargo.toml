[package]
name = "recipebridge"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.9"
js-sys = "0.3"
# Generates the boundary .d.ts from the Rust structs below (replacing the old
# hand-written typescript_custom_section). "js" routes the wasm ABI through
# serde-wasm-bindgen, matching how this crate already crosses the boundary.
tsify-next = { version = "0.5", features = ["js"] }

# https://doc.rust-lang.org/cargo/reference/config.html
# override:
# [patch."https://github.com/nickysemenza/ingredient-parser"]
# recipe-scraper = { path = "dev/ingredient-parser/recipe-scraper" }
# ingredient = { path = "dev/ingredient-parser/ingredient-parser" }
#
# Pin to a rev (not branch = "main"): CI's WASM build cache key hashes this
# Cargo.toml, so a moving branch would let a stale cached pkg outlive an
# upstream parser change. Bump these in lockstep when pulling in parser fixes.
ingredient = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "858a85e1d072def8f429a48e44e5a284b7988b58" }
recipe-scraper = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "858a85e1d072def8f429a48e44e5a284b7988b58" }
# EPUB cookbook extraction — the pure subset only (no reqwest/fs). `chunk_epub`
# + `assemble_recipes` run client-side; the LLM call is proxied through Cubby.
recipe-epub = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "858a85e1d072def8f429a48e44e5a284b7988b58", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 0.10 (not 0.11) to share recipe-epub's copy — a version split compiles sha2
# twice into the wasm binary. Used only for chunk-id hashing in epub.rs.
sha2 = "0.10"
serde-wasm-bindgen = "0.6"
wasm-tracing = "2.0.0"
tracing = "0.1.41"
console_error_panic_hook = "0.1.7"

[dev-dependencies]
# Native-target tests (cargo test): the costing + food-mapping modules are pure
# serde/ingredient code, so the parity suite runs without a wasm runtime.
rstest = "0.26"
