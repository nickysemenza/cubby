[package]
name = "cubby-ffi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "cubby_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# No default features and never `wasm`: `html` and `ai-usage` are Worker-only
# (`ai-usage` would compile the cookbook crate into every Apple target), and
# without `wasm` recipebridge links no wasm-bindgen, js-sys or tsify.
recipebridge = { path = "../recipebridge", default-features = false }
uniffi = "0.32"

# `cli` pulls in `uniffi_bindgen` + `clap`, needed only by the `uniffi-bindgen`
# binary below. Gating it behind a feature (off by default) keeps the three
# release cross-builds (aarch64-apple-ios, -ios-sim, -darwin) from compiling
# the entire bindgen toolchain for every target — measured, that cost one
# target 16+ minutes it didn't need. Only the host build that generates
# bindings turns this feature on.
[features]
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

# The shared no-panic gate (see the workspace Cargo.toml). UniFFI's
# catch_unwind turns a Rust panic into a thrown Swift error, but only as a last
# resort; denying panic!/unwrap!/expect! keeps it from being the first line of
# defense.
[lints]
workspace = true
