# One workspace for the Rust crates so they share a single Cargo.lock and
# target directory. Member `[profile.*]` tables are ignored inside a
# workspace; every profile lives here.
[workspace]
resolver = "3"
members = ["recipebridge", "cookbook-wasm", "cubby-ffi"]

# Edition 2024 matches the ingredient-parser workspace. No `rust-version`
# floor: rust-toolchain.toml tracks stable, and declaring an MSRV would make
# the edition-2024 resolver hold dependencies back to that older compiler.
[workspace.package]
edition = "2024"
publish = false

# Own upstream pins here so every member and CI job builds identical Rust
# sources. Renovate follows main weekly and updates these workspace dependencies.
# Upstream features are additive per member: recipebridge's `wasm` and
# cookbook-wasm turn on the upstream `wasm` features; nothing here does, so a
# native build never links the JavaScript boundary crates.
#
# To build against a sibling ingredient-parser working copy, drop a gitignored
# cubby/.cargo/config.toml with a
# `[patch."https://github.com/nickysemenza/ingredient-parser"]` table mapping
# each crate to `path = "../ingredient-parser/<crate>"`. Treat it as a
# temporary dev-session tool and remove it afterwards: while it is present cargo
# strips `source =` from Cargo.lock on every build, which dirties the tree,
# and local builds silently diverge from the pinned rev CI uses.
[workspace.dependencies]
ingredient = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "3a4940372ce4cfdb9f3b8ff200f13883a4f8ab69" }
recipe-types = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "3a4940372ce4cfdb9f3b8ff200f13883a4f8ab69" }
recipe-scraper = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "3a4940372ce4cfdb9f3b8ff200f13883a4f8ab69" }
# No default features: upstream's default `native` pulls reqwest, tokio and the
# filesystem store, none of which any Cubby build uses. A member cannot turn
# workspace defaults back off, so they stay off here.
cookbook = { git = "https://github.com/nickysemenza/ingredient-parser", rev = "3a4940372ce4cfdb9f3b8ff200f13883a4f8ab69", default-features = false }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = "0.2"

# Mirror upstream ingredient-parser's gate. A panic at the wasm boundary is a
# hard browser crash (wasm builds abort on panic), and at the FFI boundary
# UniFFI's catch_unwind is only a last resort, so forbid the macros that produce
# one in production code. recipebridge's tests opt out with a crate-level
# `#![cfg_attr(test, allow(...))]`; cubby-ffi's do not. `uninlined_format_args`
# warns on `format!("{}", x)`. CI runs clippy with `-D warnings`, so these bite.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
uninlined_format_args = "warn"

# Line numbers are kept for backtraces; full DWARF only inflated the shared
# target dir.
[profile.dev]
debug = "line-tables-only"

# Dev-iteration tuning: optimizing dependencies even in debug builds keeps
# `cargo test`/`cargo clippy` fast despite the heavy `ingredient`/`serde`/
# `uniffi` deps; a light opt-level on the test profile trims runtime without
# the slow full-release compile.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# The Rust gate runs sub-second tests; dependency optimization only adds compile
# time. Keep clippy and tests on the same profile, separate from dev and shipped builds.
[profile.ci]
inherits = "dev"
debug = 0
opt-level = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

# Plain release is cubby-ffi's inner-loop profile (`build-rust.sh` default).
# Do NOT set `panic = "abort"` here or in `dist`: UniFFI's generated
# scaffolding wraps every export in `catch_unwind`, which needs unwinding to
# turn a Rust panic into a thrown Swift error instead of a hard abort.
# Incremental is off for release by cargo default; on, an edit to a path crate
# is a partial recompile per target instead of a full one.
#
# The wasm build overrides this through CARGO_PROFILE_RELEASE_* in the root
# `wasm` script and the CI wasm step (wasm-pack only takes --release, and
# member profiles are ignored): opt-level z, lto, one codegen unit,
# panic = abort, no incremental. Keep those lists in sync.
[profile.release]
strip = "debuginfo"
incremental = true

# Shipped-binary tuning (`build-rust.sh --profile dist`): LTO + one codegen
# unit let the linker drop cross-crate dead code, `opt-level = "s"` favors
# binary size over compile speed. `incremental` would be inherited and cargo
# does not turn it off under LTO on its own.
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
incremental = false
