name: Apple release

# The reusable archive+export+upload path, factored out of
# apple-testflight.yaml so it can stay read-only: a called workflow's jobs
# are capped by the caller's permissions, and ci.yaml's release-dry-run job
# calls this from a pull_request event, which GitHub never grants
# contents: write. Only apple-testflight.yaml's manual-dispatch wrapper adds
# the tag job (contents: write) on top of this workflow's output.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to release (MAJOR.MINOR.PATCH)"
        required: true
        type: string
      publish:
        description: "Upload to App Store Connect (false only validates)"
        required: false
        default: false
        type: boolean
    outputs:
      version:
        description: "Resolved MARKETING_VERSION"
        value: ${{ jobs.coordinates.outputs.version }}
      build:
        description: "Resolved CURRENT_PROJECT_VERSION"
        value: ${{ jobs.coordinates.outputs.build }}
      tag:
        description: "Resolved release tag (vMAJOR.MINOR.PATCH)"
        value: ${{ jobs.coordinates.outputs.tag }}
      mode:
        description: "validate or upload"
        value: ${{ jobs.coordinates.outputs.mode }}

# No `concurrency` here on purpose: this workflow is only ever called, and a
# called workflow that declares the same group as its caller (which
# apple-testflight.yaml does, since `github.workflow` is the caller's name)
# deadlocks and fails within seconds. Callers own concurrency.

permissions:
  contents: read

jobs:
  coordinates:
    name: Resolve release coordinates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      mode: ${{ steps.resolve.outputs.mode }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate inputs and resolve coordinates
        id: resolve
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must match MAJOR.MINOR.PATCH; got '$VERSION'."
            exit 1
          }
          mode="validate"
          [[ "$PUBLISH" == "true" ]] && mode="upload"
          commit_count="$(git rev-list --count HEAD)"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "mode=$mode"
            echo "build=${commit_count}.${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Check current main
        id: current-main
        uses: ./.github/actions/check-current-main

      - name: Reject publishing from a non-current-main commit
        if: inputs.publish == true && steps.current-main.outputs.current != 'true'
        shell: bash
        run: |
          echo "::error::Publishing requires the workflow to run at the current main commit."
          exit 1

      # Fail in seconds on a duplicate version instead of burning a full
      # archive/export cycle before `tag` discovers the tag already exists.
      - name: Reject a version that is already tagged
        if: inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/${{ steps.resolve.outputs.tag }}")"
          if [[ -n "$existing" ]]; then
            echo "::error::${{ steps.resolve.outputs.tag }} already exists; bump the version."
            exit 1
          fi

  # One matrix leg per platform so the Rust FFI build (the dominant cold-cache
  # cost) only compiles the target that platform needs, and both archives run
  # concurrently instead of the historical single serial job.
  archive:
    name: Archive ${{ matrix.platform }}
    needs: coordinates
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve platform coordinates
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            ios)
              echo "ffi-target=device" >> "$GITHUB_OUTPUT"
              echo "archive-dir=Cubby-iOS.xcarchive" >> "$GITHUB_OUTPUT"
              ;;
            macos)
              echo "ffi-target=mac" >> "$GITHUB_OUTPUT"
              echo "archive-dir=Cubby-macOS.xcarchive" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: ${{ steps.platform.outputs.ffi-target }}
          profile: dist

      - uses: ./.github/actions/setup-apple-tools
        id: apple-tools
        with:
          sentry-cli: "true"

      - uses: ./.github/actions/prepare-apple-release-project

      # The Sentry dSYM upload archive phase reads this file directly; it is
      # never passed to xcodebuild.
      - name: Write temporary Sentry credentials
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$SENTRY_AUTH_TOKEN" ]] || {
            echo "::error::SENTRY_AUTH_TOKEN is required."
            exit 1
          }
          printf '[auth]\ntoken=%s\n' "$SENTRY_AUTH_TOKEN" > "$HOME/.sentryclirc"
          chmod 600 "$HOME/.sentryclirc"

      - uses: ./.github/actions/import-apple-signing
        with:
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          verify-mac-installer: ${{ matrix.platform == 'macos' && 'true' || 'false' }}

      - name: Download provisioning profile
        id: profile
        uses: ./.github/actions/download-apple-profile
        with:
          profile-type: ${{ matrix.platform == 'ios' && 'IOS_APP_STORE' || 'MAC_APP_STORE' }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Archive ${{ matrix.platform }}
        shell: bash
        env:
          MARKETING_VERSION: ${{ needs.coordinates.outputs.version }}
          IOS_BUILD_NUMBER: ${{ needs.coordinates.outputs.build }}
          MACOS_BUILD_NUMBER: ${{ needs.coordinates.outputs.build }}
          IOS_PROFILES_JSON: ${{ matrix.platform == 'ios' && steps.profile.outputs.profiles || '' }}
          MACOS_PROFILES_JSON: ${{ matrix.platform == 'macos' && steps.profile.outputs.profiles || '' }}
          TESTFLIGHT_OUTPUT_DIR: ${{ runner.temp }}/CubbyTestFlight
        run: apps/apple/scripts/testflight.sh archive '${{ matrix.platform }}'

      # setup-apple-tools only restores; save explicitly here so a cache
      # miss populated by this run survives even if the archive step above
      # failed (`if: always()`), matching the pattern PR 1 uses in the
      # hosted Apple checks job. `continue-on-error` because another
      # concurrent job racing the same key is a harmless 409, never a
      # reason to fail this one.
      - name: Save OpenAPI generator cache
        if: always() && steps.apple-tools.outputs.openapi-generator-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CUBBY_OPENAPI_GENERATOR_BIN_DIR }}
          key: ${{ steps.apple-tools.outputs.openapi-generator-cache-key }}

      - name: Save SPM clone cache
        if: always() && steps.apple-tools.outputs.spm-clones-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}

      # actions/upload-artifact zips its input and does not preserve the
      # executable bit or symlinks, which would leave Cubby.app's main binary
      # non-executable and its embedded framework symlinks flattened after
      # download; tar the archive first so both survive the round trip.
      - name: Package the archive for hand-off
        shell: bash
        run: |
          set -euo pipefail
          tar -C "${{ runner.temp }}/CubbyTestFlight" \
            -cf "${{ runner.temp }}/CubbyTestFlight/${{ steps.platform.outputs.archive-dir }}.tar" \
            "${{ steps.platform.outputs.archive-dir }}"

      - name: Preserve the archive
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Cubby-${{ matrix.platform }}-archive-${{ needs.coordinates.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CubbyTestFlight/${{ steps.platform.outputs.archive-dir }}.tar
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary Sentry credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.sentryclirc"

  # Runs in both modes: `validate` exercises the identical re-signed export
  # path with `destination: export`, `upload` adds the ASC API key flags and
  # uploads. Depending on both archive legs means neither platform's export
  # (let alone upload) can start unless both archived successfully.
  upload:
    name: Export and upload
    needs: [coordinates, archive]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `runner` isn't available in a job-level `env:` block, so this is set
      # via GITHUB_ENV instead, from the first step onward.
      - name: Resolve output directory
        shell: bash
        run: echo "TESTFLIGHT_OUTPUT_DIR=${{ runner.temp }}/CubbyTestFlight" >> "$GITHUB_ENV"

      - name: Download iOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Cubby-ios-archive-${{ needs.coordinates.outputs.version }}-${{ github.run_attempt }}
          path: ${{ env.TESTFLIGHT_OUTPUT_DIR }}

      - name: Download macOS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Cubby-macos-archive-${{ needs.coordinates.outputs.version }}-${{ github.run_attempt }}
          path: ${{ env.TESTFLIGHT_OUTPUT_DIR }}

      # Reverses the archive job's tar packaging (see the comment there): it
      # preserves the executable bit and symlinks that upload-artifact's zip
      # would otherwise strip, so unpack back to the exact paths
      # testflight.sh expects before exporting.
      - name: Unpack archives
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$TESTFLIGHT_OUTPUT_DIR" -xf "$TESTFLIGHT_OUTPUT_DIR/Cubby-iOS.xcarchive.tar"
          tar -C "$TESTFLIGHT_OUTPUT_DIR" -xf "$TESTFLIGHT_OUTPUT_DIR/Cubby-macOS.xcarchive.tar"

      - name: Write temporary App Store Connect credentials
        if: needs.coordinates.outputs.mode == 'upload'
        shell: bash
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "$API_KEY_P8" && -n "$API_KEY_ID" ]] || {
            echo "::error::App Store Connect API credentials are required to publish."
            exit 1
          }
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "ASC_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      # xcodebuild -exportArchive re-signs, so the identities and profiles
      # must be imported again here even though the archive job already
      # verified them.
      - uses: ./.github/actions/import-apple-signing
        with:
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          verify-mac-installer: "true"

      - name: Download iOS provisioning profile
        id: ios-profile
        uses: ./.github/actions/download-apple-profile
        with:
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Download macOS provisioning profile
        id: macos-profile
        uses: ./.github/actions/download-apple-profile
        with:
          profile-type: MAC_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Export iOS
        shell: bash
        env:
          MODE: ${{ needs.coordinates.outputs.mode }}
          MARKETING_VERSION: ${{ needs.coordinates.outputs.version }}
          IOS_PROFILES_JSON: ${{ steps.ios-profile.outputs.profiles }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: apps/apple/scripts/testflight.sh export ios

      - name: Export macOS
        shell: bash
        env:
          MODE: ${{ needs.coordinates.outputs.mode }}
          MARKETING_VERSION: ${{ needs.coordinates.outputs.version }}
          MACOS_PROFILES_JSON: ${{ steps.macos-profile.outputs.profiles }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: apps/apple/scripts/testflight.sh export macos

      - name: Preserve exports and symbols
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Cubby-${{ needs.coordinates.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/exports
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/ExportOptions-*.plist
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/*.xcarchive/Info.plist
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/*.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary service credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASC_API_KEY_PATH:-}" ]]; then rm -f "$ASC_API_KEY_PATH"; fi
