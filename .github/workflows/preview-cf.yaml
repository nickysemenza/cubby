name: Preview Deploy

# Preview deployment is deliberately separate from CI. A Cloudflare deployment
# job can take several minutes to acknowledge cancellation; keeping it here
# prevents that platform delay from holding a replacement CI run in pending.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # workflow_run workflows become active only after this file reaches the
  # default branch. These inputs provide a post-merge smoke-test path against a
  # retained successful CI artifact.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful pull_request CI run ID containing cf-build"
        required: true
        type: string
      pr_number:
        description: "Pull request number to associate with the preview"
        required: true
        type: string
      head_sha:
        description: "Pull request head SHA to deploy and record"
        required: true
        type: string

concurrency:
  group: preview-pr-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  preview-cf:
    name: Preview Deploy (Cloudflare)
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number != null) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.run_id != '' &&
       inputs.pr_number != '' &&
       inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}

      - name: Download CF build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
          run-id: ${{ github.event.workflow_run.id || inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install wrangler
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies.wrangler.replace(/^[^0-9]*/, '')")
          npm install -g "wrangler@${version}"

      - name: Upload preview version
        id: preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
        run: |
          set -o pipefail
          pr_url="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
          wrangler versions upload --config dist/server/wrangler.json \
            --var "COOKIE_DOMAIN:.nicky.workers.dev" \
            --tag "pr-${PR_NUMBER}" \
            --message "${pr_url} @ ${PR_HEAD_SHA}" 2>&1 | tee upload.log
          url=$(grep -oE 'https://[a-z0-9-]+-cubby\.nicky\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] || echo "::warning::No preview URL — enable Preview URLs (workers.dev) for the cubby worker."

      # workflow_run's GITHUB_SHA points at the default branch. Creating the
      # deployment explicitly records it against the PR head so GitHub can show
      # the preview on the pull request rather than on an unrelated main commit.
      - name: Record preview deployment on the PR head
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.PR_HEAD_SHA,
              auto_merge: false,
              required_contexts: [],
              environment: "preview",
              description: `Cloudflare preview for PR #${process.env.PR_NUMBER}`,
              transient_environment: true,
              production_environment: false,
            });

            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: "success",
              environment: "preview",
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });
