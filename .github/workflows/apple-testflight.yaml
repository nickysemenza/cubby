name: Apple TestFlight

# Manual dispatch wrapper around apple-release.yaml's reusable archive/
# export/upload path. The split exists so the reusable part can stay
# read-only: a called workflow's jobs are capped by the caller's
# permissions, and ci.yaml's release-dry-run job calls apple-release.yaml
# from a pull_request event, which GitHub never grants contents: write. Only
# this manual-dispatch workflow adds the `tag` job (contents: write) on top
# of apple-release.yaml's output. `publish: true` uploads both apps to App
# Store Connect and tags the released commit; `publish: false` (the
# default) exercises the identical signed archive/export path without
# uploading or tagging anything. There is no tag-push trigger: the `tag` job
# below creates the release tag itself once the upload succeeds, so a
# manually pushed tag can never start a second release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (MAJOR.MINOR.PATCH)"
        required: true
        default: "1.0.0"
        type: string
      publish:
        description: "Upload to App Store Connect and tag the release (false only validates)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Archive, export, and upload
    uses: ./.github/workflows/apple-release.yaml
    with:
      version: ${{ inputs.version }}
      publish: ${{ inputs.publish }}
    secrets: inherit

  tag:
    name: Tag the release
    needs: release
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create and push the release tag
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD: ${{ needs.release.outputs.build }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Cubby $VERSION (build $BUILD)"
          git push origin "$TAG"
