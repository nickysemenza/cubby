name: Apple TestFlight

# Publishes current main to TestFlight; ordinary merges never publish. The
# nightly run publishes when native inputs changed since the last complete
# upload or that upload is 30 days old; a manual run always publishes; a push
# that changes the compatibility version publishes immediately. The `plan`
# job decides in seconds on Linux before any macOS runner or credential is
# used (scripts/apple/apple-release.ts). Retry with a fresh dispatch, never a rerun.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [packages/shared/src/apple-client-version.ts]

# One publisher at a time; a newer request waits in the single pending slot.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  # Newer runs of this workflow.
  actions: read

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.action == 'publish' || (steps.plan.outputs.action == 'compare' && (steps.paths.outputs.full == 'true' || steps.paths.outputs.apple == 'true')) }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      # Current main when the run starts, with the history and checkpoint
      # tags back to the last uploaded commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Decide
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: node scripts/apple/apple-release.ts plan
      # Changes since the uploaded commit that can reach the shipped app:
      # native and generator sources (`apple`), or root, CI, and tooling
      # files outside every app (`full`). Documentation never selects either.
      - name: Classify changes since the last upload
        id: paths
        if: steps.plan.outputs.action == 'compare'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ steps.plan.outputs.base }}
          ref: ${{ steps.plan.outputs.sha }}
          predicate-quantifier: some-with-excludes
          filters: |
            full:
              - "**"
              - &notMarkdown "!**/*.@([mM][dD]|[mM][dD][xX]|[mM][aA][rR][kK][dD][oO][wW][nN])"
              - "!apps/**"
              - "!packages/**"
              - "!cubby-ffi/**"
              - "!recipebridge/**"
              - "!Cargo.{toml,lock}"
              - "!docker-compose*"
            apple:
              - "apps/apple/**"
              - "cubby-ffi/**"
              - "recipebridge/**"
              - "Cargo.{toml,lock}"
              - "packages/{schemas,shared}/**"
              - "apps/web/src/**"
              - "apps/web/generator/**"
              - "apps/web/tooling/checks/apple-preview-fixtures.ts"
              - "apps/web/wrangler.jsonc"
              - "apps/web/tooling/wrangler-public-config.ts"
              - *notMarkdown
      - name: Report
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          REASON: ${{ steps.plan.outputs.reason }}
          FULL: ${{ steps.paths.outputs.full }}
          APPLE: ${{ steps.paths.outputs.apple }}
        run: |
          if [[ "$ACTION" == compare ]]; then
            echo "::notice::Native changes since the last upload: full=$FULL apple=$APPLE"
          else
            echo "::notice::$ACTION: $REASON"
          fi

  # The generated Swift and project settings (never committed), written on
  # Linux so the macOS legs need no dependency install.
  apple-generated:
    name: Apple generated inputs
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: ./.github/actions/setup-node-with-deps
      - run: pnpm generate:if-stale
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-generated
          if-no-files-found: error
          retention-days: 3
          # Their common root, apps/apple, is where the release legs restore them.
          path: |
            apps/apple/CubbyKit/Sources/CubbyKit/Generated
            apps/apple/CubbyKit/Sources/CubbyAPISupport/Generated
            apps/apple/CubbyKit/Sources/CubbyAPI/openapi.json
            apps/apple/CubbyKit/Sources/CubbyAPI/openapi-generator-config.yaml
            apps/apple/Generated

  # One leg per platform archives, verifies, and uploads its own build, so
  # the Rust FFI build compiles only the target that platform needs. A failed
  # leg does not stop the other, but only both succeeding records an upload.
  release:
    name: Release ${{ matrix.platform }}
    needs: [plan, apple-generated]
    runs-on: xcode-27
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # `runner` isn't available in a job-level `env:` block.
      - name: Resolve output directory
        run: echo "TESTFLIGHT_OUTPUT_DIR=$RUNNER_TEMP/CubbyTestFlight" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-generated
          path: apps/apple

      - uses: ./.github/actions/setup-apple
        id: apple-tools
        with:
          node: "false"
          ffi-targets: ${{ matrix.platform == 'ios' && 'device' || 'mac' }}
          ffi-profile: dist
          sentry-cli: "true"

      - name: Generate the Xcode project
        run: apps/apple/scripts/prepare-project.sh

      # The pre-upload guard in testflight.sh is a Node builtins-only script.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The Sentry dSYM upload archive phase reads ~/.sentryclirc directly;
      # the App Store Connect key is read by xcodebuild -exportArchive.
      - name: Write temporary service credentials
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "$SENTRY_AUTH_TOKEN" && -n "$API_KEY_P8" && -n "$API_KEY_ID" ]] || {
            echo "::error::SENTRY_AUTH_TOKEN and App Store Connect API credentials are required."
            exit 1
          }
          printf '[auth]\ntoken=%s\n' "$SENTRY_AUTH_TOKEN" > "$HOME/.sentryclirc"
          chmod 600 "$HOME/.sentryclirc"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "ASC_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - uses: ./.github/actions/import-apple-signing
        with:
          p12-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          verify-mac-installer: ${{ matrix.platform == 'macos' && 'true' || 'false' }}

      - name: Download provisioning profile
        id: profile
        uses: apple-actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: com.nickysemenza.cubby
          profile-type: ${{ matrix.platform == 'ios' && 'IOS_APP_STORE' || 'MAC_APP_STORE' }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Download Live Activity provisioning profile
        id: live-activity-profile
        if: matrix.platform == 'ios'
        uses: apple-actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: com.nickysemenza.cubby.LiveActivity
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      # The archive replays unchanged compiler work, packages included, from
      # the newest main release's content-addressed cache; a local Release
      # build measured 363s cold and 26s from a restored cache.
      - name: Compute Xcode version hash
        id: xcode-version
        run: echo "hash=$(xcodebuild -version 2>&1 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore release compilation cache
        id: release-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TESTFLIGHT_OUTPUT_DIR }}/DerivedData/CompilationCache.noindex
          key: xcode-release-v1-${{ matrix.platform }}-${{ steps.xcode-version.outputs.hash }}-${{ needs.plan.outputs.sha }}
          restore-keys: xcode-release-v1-${{ matrix.platform }}-${{ steps.xcode-version.outputs.hash }}-

      - name: Archive, verify, and upload ${{ matrix.platform }}
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.plan.outputs.build }}
          PROFILES_JSON: ${{ steps.profile.outputs.profiles }}
          IOS_LIVE_ACTIVITY_PROFILES_JSON: ${{ steps.live-activity-profile.outputs.profiles }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: apps/apple/scripts/testflight.sh '${{ matrix.platform }}'

      - name: Save release compilation cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ env.TESTFLIGHT_OUTPUT_DIR }}/DerivedData/CompilationCache.noindex
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
          cache-hit: ${{ steps.release-cache.outputs.cache-hit }}
          matched-key: ${{ steps.release-cache.outputs.cache-matched-key }}

      # Dependency clones are advisory and can be reused after an archive
      # failure. This is not a compiled-output cache. A concurrent save of
      # the same immutable key is a harmless 409.
      - name: Save SPM clone cache
        if: always() && steps.apple-tools.outputs.spm-clones-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}

      - name: Preserve exports and symbols
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cubby-${{ matrix.platform }}-${{ needs.plan.outputs.build }}
          path: |
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/exports
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/ExportOptions-*.plist
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/*.xcarchive/Info.plist
            ${{ env.TESTFLIGHT_OUTPUT_DIR }}/*.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary service credentials
        if: always()
        run: |
          rm -f "$HOME/.sentryclirc"
          if [[ -n "${ASC_API_KEY_PATH:-}" ]]; then rm -f "$ASC_API_KEY_PATH"; fi

  # Upload acceptance by App Store Connect for BOTH platforms, not TestFlight
  # availability: one immutable annotated tag per upload, its message the
  # checkpoint JSON. scripts/apple/apple-release.ts reads the highest build as the
  # last complete upload, and the tag list is the upload history.
  checkpoint:
    name: Record the upload
    needs: [plan, release]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the uploaded commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          # A failed checkpoint job can be rerun without the guarded upload jobs.
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo "::error::Checkpoint reruns are refused; dispatch a fresh release."
            exit 1
          }
          tag="testflight/$VERSION-$BUILD"
          message="$(jq -n --arg sha "$SHA" --arg version "$VERSION" --argjson build "$BUILD" \
            --arg uploadedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sha: $sha, version: $version, build: $build, uploadedAt: $uploadedAt}')"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" \
            -f message="$message" -f object="$SHA" -f type=commit --jq .sha)"
          # Creating an existing ref fails, so a recorded upload is never rewritten.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          echo "::notice::Recorded $tag: $message"
