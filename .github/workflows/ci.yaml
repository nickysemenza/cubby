name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
      - name: Install dependencies and playwright binaries
        run: npm ci
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install wasm pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: npm run wasm
        env:
          # todo: why is cargo.toml not good enough?
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Setup environment variables
        run: |
          cp .env.example .env
          echo "NEXTAUTH_SECRET=supersecret" >> .env
      - name: Push schema to database
        run: npm run db:push
      - run: npm test -- --coverage
        name: "run unit and integration tests"
      - run: npm run format:check
        name: "check prettier formatting"
      - run: npm run check
        name: "lint and type check"
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/recipehub
