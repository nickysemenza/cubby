name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Full verification or full instrumented coverage (neither deploys)"
        type: choice
        options: [verify, coverage]
        default: verify
      check_processes:
        description: "Internal validation process-cap benchmark"
        type: choice
        options: ["2", "4"]
        default: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.scope.outputs.coverage }}
      verify: ${{ steps.scope.outputs.verify }}
      apple: ${{ steps.apple.outputs.apple }}
      release: ${{ steps.apple.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/check-outward-text.ts
            packages/shared/src/generated/shortcode-registry.gen.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      # The commit-msg hook gates commit messages; the PR title and body are
      # the other outward text AGENTS.md keeps free of live entity codes.
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin
      - id: scope
        env:
          MODE: ${{ inputs.mode || 'verify' }}
        run: |
          if [[ "$MODE" == "coverage" ]]; then
            echo 'coverage=true' >> "$GITHUB_OUTPUT"
            echo 'verify=false' >> "$GITHUB_OUTPUT"
          else
            echo 'coverage=false' >> "$GITHUB_OUTPUT"
            echo 'verify=true' >> "$GITHUB_OUTPUT"
          fi

      # The Apple job is the slowest lane by far (macOS runners, xcodebuild),
      # so it alone is path-filtered: everything else always runs. On a push
      # or workflow_dispatch (no PR to diff against) it always runs too.
      # `release` reuses the same PR file listing to decide whether to run
      # release-dry-run below: narrower than `apple` (only files that change
      # what a TestFlight release actually builds/signs) and, unlike `apple`,
      # false on push/workflow_dispatch — main pushes never need a release
      # dry run, and a real release is always an explicit dispatch of
      # apple-testflight.yaml itself.
      - id: apple
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Prefix match for directories (a changed file anywhere under
          # them), exact match for individual files that affect the Apple
          # build outside apps/apple/ itself.
          apple_pattern='^(apps/apple/|cubby-ffi/|recipebridge/|\.github/|rust-toolchain\.toml$|scripts/ensure-apple-ffi\.ts$|scripts/rust-fingerprint\.ts$|scripts/apple-check\.sh$|apps/web/src/lib/generated/http-openapi\.gen\.json$)'
          release_pattern='^(\.github/workflows/apple-testflight\.yaml$|\.github/workflows/apple-release\.yaml$|\.github/actions/(prepare-apple-release-project|import-apple-signing|download-apple-profile)/|apps/apple/scripts/testflight\.sh$|apps/apple/project\.yml$|apps/apple/App/.*(Info\.plist|\.entitlements)$|apps/apple/scripts/build-rust\.sh$)'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
            matched="$(printf '%s\n' "$files" | grep -E "$apple_pattern" || true)"
            if [[ -n "$matched" ]]; then apple=true; else apple=false; fi
            release_matched="$(printf '%s\n' "$files" | grep -E "$release_pattern" || true)"
            if [[ -n "$release_matched" ]]; then release=true; else release=false; fi
          else
            matched=""
            release_matched=""
            apple=true
            release=false
          fi

          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          {
            echo "### Apple job scope"
            echo "apple=$apple ($EVENT_NAME)"
            if [[ -n "$matched" ]]; then
              echo
              echo "Matching changed files:"
              printf '%s\n' "$matched" | sed 's/^/- /'
            fi
            echo
            echo "### Release dry-run scope"
            echo "release=$release ($EVENT_NAME)"
            if [[ -n "$release_matched" ]]; then
              echo
              echo "Matching changed files:"
              printf '%s\n' "$release_matched" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Validation
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: ${{ github.event_name == 'workflow_dispatch' && inputs.check_processes || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      # Validation rebuilds the package to verify generated WASM is current;
      # restoring its output alone does not provide the wasm-pack executable.
      - name: Install wasm-pack for validation
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: wasm-pack
      - name: Run repository validation
        shell: bash
        run: |
          pnpm check:all &
          pids=("$!")
          names=("complete repository validation")

          pnpm dedupe:check &
          pids+=("$!")
          names+=("dependency deduplication")

          result_code=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error::${names[$index]} failed"
              result_code=1
            fi
          done
          exit "$result_code"

  test-aux:
    name: Auxiliary tests and builds
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - name: Run auxiliary package tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
        run: |
          args=(-r --no-sort --workspace-concurrency=2 --no-bail --filter '!@cubby/web' --if-present run test --maxWorkers=1 --reporter=default --reporter=github-actions)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm "${args[@]}"
      - if: needs.scope.outputs.verify == 'true'
        run: pnpm --filter @cubby/usda-api run build
      - if: needs.scope.outputs.verify == 'true'
        run: pnpm --filter @cubby/upc-lookup run build
      - if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-aux
          path: |
            apps/mcp-apps/coverage/coverage-final.json
            apps/upc-lookup/coverage/coverage-final.json
            apps/usda-api/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-rust:
    name: Rust - recipebridge
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          components: ${{ needs.scope.outputs.coverage == 'true' && 'llvm-tools-preview' || '' }}
          cache-workspaces: "recipebridge -> target"
      - name: Install cargo-llvm-cov
        if: needs.scope.outputs.coverage == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      - if: needs.scope.outputs.coverage != 'true'
        run: cargo test --manifest-path recipebridge/Cargo.toml
      - if: needs.scope.outputs.coverage == 'true'
        run: cargo llvm-cov --manifest-path recipebridge/Cargo.toml --lcov --output-path recipebridge/lcov.info
      - if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-rust
          path: recipebridge/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-web:
    name: Tests - web (${{ matrix.tier }})
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: node
            args: --project unit --project mcp-contract --project worker-safety
          - tier: ui
            args: --project ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
          web-env: "true"
      - name: Build web Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: pnpm --filter @cubby/web run build:cf
      - name: Save recipebridge WASM
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recipebridge-wasm
          path: packages/wasm
          if-no-files-found: error
          retention-days: 1
      - name: Save Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cf-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Run ${{ matrix.tier }} tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          VITEST_PROJECT_ARGS: ${{ matrix.args }}
        run: |
          read -r -a selected <<< "$VITEST_PROJECT_ARGS"
          args=("${selected[@]}" --testTimeout=10000 --reporter=default --reporter=github-actions --reporter=./tooling/test-run-contract-reporter.ts)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Save web ${{ matrix.tier }} coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-${{ matrix.tier }}
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-postgres:
    name: PostgreSQL integration tests
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web... @cubby/purchase-agent..."
          web-env: "true"
      - name: Build coupled workerd Workers
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          pnpm --filter @cubby/purchase-agent run build
          pnpm --filter @cubby/web run build:cf
      - name: Run PostgreSQL integration tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          CUBBY_TEST_INTEGRATION: "1"
        run: |
          args=(--project integration --reporter=default --reporter=github-actions --reporter=./tooling/test-run-contract-reporter.ts)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Save web PostgreSQL coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-postgres
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    name: E2E tests (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two Playwright workers on one runner flaked (2026-09-21,
          # inventory-session.spec, a 15s toBeVisible timeout under
          # CUBBY_E2E_WORKERS=2), so chromium instead shards across two
          # runners at one worker each; webkit stays a single unsharded lane.
          # The historical "3 shards did not beat 2" note in docs/ci.md
          # predates today's 370s suite.
          - lane: "chromium 1/2"
            slug: chromium-1
            browser: chromium
            test-script: test:e2e:ci:chromium
            shard: "1/2"
          - lane: "chromium 2/2"
            slug: chromium-2
            browser: chromium
            test-script: test:e2e:ci:chromium
            shard: "2/2"
          - lane: webkit
            slug: webkit
            browser: webkit
            test-script: test:e2e:ci:webkit
            shard: "1/1"
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_VERSION: "1.63.0"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_E2E_DATABASE: postgres
    # Deliberately duplicated from test-postgres above: GitHub Actions YAML
    # has no anchors and no reusable "services" construct that fits a
    # per-job block like this.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
          web-env: "true"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Bound Ubuntu package mirror retries
        if: matrix.browser == 'webkit'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-cubby-ci >/dev/null
          sudo chown -R "$USER":"$(id -gn)" /var/cache/apt/archives
      - name: Cache Playwright system packages
        if: matrix.browser == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: playwright-system-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-webkit-v1
      - name: Install Playwright browser dependencies
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        run: pnpm --filter @cubby/web run test:e2e:install-deps -- ${{ matrix.browser }}
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- ${{ matrix.browser }}
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Wait for the tested Cloudflare bundle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            for (;;) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              if (artifacts.some(({ name }) => name === "cf-build")) return;

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              const build = jobs.find(
                ({ name }) => name === "Tests - web (node)",
              );
              if (
                build?.status === "completed" &&
                build.conclusion !== "success"
              ) {
                core.setFailed(`Cloudflare build ended ${build.conclusion}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed("cf-build was not published within twenty minutes");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: recipebridge-wasm
          path: packages/wasm
      - name: Run Playwright tests
        run: pnpm --filter @cubby/web run ${{ matrix.test-script }} --shard=${{ matrix.shard }}
      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.slug }}
          path: apps/web/playwright-report/
          retention-days: 1

  # Host `swift test` for CubbyKit's package tests; not folded into test-apple
  # below. Measured 2026-09-21: running these on the iOS Simulator inside the
  # build job cost about 6 minutes to boot plus ~10 minutes of CPU starvation
  # on a hosted macOS runner's 3 cores (a 5s script took 2.6 min, the compile
  # doubled) — the merged job took 13 min even with warm caches. Two jobs beat
  # one.
  test-apple-package:
    name: Apple package tests
    needs: scope
    if: needs.scope.outputs.verify == 'true' && needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: mac
      # SPM fetch+resolve was 53s of this job's ~5 minutes; CubbyKit's
      # Package.resolved pins exact versions, so an exact-key cache of the
      # checkouts and git-object cache is safe to reuse unchanged.
      - name: Restore cached SPM checkouts
        id: spm-checkouts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/apple/CubbyKit/.build/checkouts
            apps/apple/CubbyKit/.build/repositories
          key: spm-checkouts-v1-${{ runner.os }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}
      - name: Run CubbyKit Swift tests
        run: swift test --package-path apps/apple/CubbyKit --force-resolved-versions
      # Saved here rather than by actions/cache's post step so a red test run
      # still keeps the checkouts for the next attempt. A concurrent job may
      # have saved the same key first; that 409 is harmless and must never
      # fail the check.
      - name: Save SPM checkouts cache
        if: always() && steps.spm-checkouts.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/apple/CubbyKit/.build/checkouts
            apps/apple/CubbyKit/.build/repositories
          key: spm-checkouts-v1-${{ runner.os }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}

  test-apple:
    name: Apple checks
    needs: scope
    if: needs.scope.outputs.verify == 'true' && needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        id: apple-tools
      - name: Run iOS app checks
        run: sh scripts/apple-check.sh ci
      # Saved here rather than by actions/cache's post step so a red build
      # still keeps the generator build and SPM clones for the next attempt.
      # A concurrent job may have saved the same key first; that 409 is
      # harmless and must never fail the check.
      - name: Save OpenAPI generator cache
        if: always() && steps.apple-tools.outputs.openapi-generator-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CUBBY_OPENAPI_GENERATOR_BIN_DIR }}
          key: ${{ steps.apple-tools.outputs.openapi-generator-cache-key }}
      - name: Save SPM clone cache
        if: always() && steps.apple-tools.outputs.spm-clones-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}

  # Populates apple-testflight.yaml's release FFI caches (setup-apple-ffi's
  # targets=device/mac, profile=dist) on every main push, so a release hits
  # a warm cache instead of the cold ~7-minute Rust build those keys
  # previously only ever saw during a release itself. Deliberately does not
  # `need` scope: it should warm regardless of the PR path filter, and there
  # is no PR here to filter anyway (push-only). Not a required check.
  warm-apple-ffi:
    name: Warm Apple FFI cache (${{ matrix.targets }})
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        targets: [device, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: ${{ matrix.targets }}
          profile: dist

  # Exercises apple-release.yaml's identical signed archive/export path
  # (publish: false, so nothing uploads or gets tagged) on a PR that touches
  # release-affecting files, to catch a v1.0.1-v1.0.3-style config error
  # (bad provisioning profile match, missing signing identity, missing
  # Info.plist key) on the PR that introduces it instead of burning a real
  # version tag at release time. Costs about 12 minutes of macOS runner time,
  # only on matching PRs. Not a required check: a red run here surfaces the
  # problem but does not block merging. Calls apple-release.yaml directly
  # (not the apple-testflight.yaml dispatch wrapper): a pull_request-triggered
  # job is never granted contents: write, and apple-release.yaml has no `tag`
  # job to need it.
  release-dry-run:
    name: Release dry run
    needs: scope
    if: needs.scope.outputs.verify == 'true' && needs.scope.outputs.release == 'true'
    uses: ./.github/workflows/apple-release.yaml
    with:
      version: "0.0.0"
      publish: false
    secrets: inherit

  report-coverage:
    name: Report scheduled coverage
    needs: [scope, validation, test-rust, test-web, test-postgres, test-aux]
    if: needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Collect coverage report paths
        id: reports
        shell: bash
        run: |
          files="$(find coverage-reports -type f \
            \( -name lcov.info -o -name coverage-final.json \) \
            -print | sort | paste -sd, -)"
          [[ -n "$files" ]] || { echo "::error::No coverage reports were downloaded"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          flags: complete
          name: scheduled-coverage
