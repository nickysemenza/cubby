  #   environment:
  #     name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  #     url: ${{ steps.deploy.outputs.url }}
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: ./.github/actions/setup-node-with-deps
  #       with:
  #         download-wasm: "true"
  #     - name: Deploy to Vercel
  #       id: deploy
  #       run: |
  #         if [ "${{ github.ref }}" = "refs/heads/main" ]; then
  #           npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
  #         else
  #           npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
  #         fi
  #       env:
  #         VERCEL_ORG_ID: team_rAffu7VKl4KcVrPBRqaMYB7f
  #         VERCEL_PROJECT_ID: prj_JPllV9ESJ1mzTBJZEmAtNrooLS00

  deploy-cf:
    name: Deploy to Cloudflare Workers
    needs: [lint-format, check-tests, build-cf]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.lint-format.result == 'success' &&
      needs.check-tests.outputs.all-passed == 'true' &&
      needs.build-cf.result == 'success' &&
      github.ref == 'refs/heads/main'
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@v6
      - name: Download CF build artifact
        uses: actions/download-artifact@v7
        with:
          name: cf-build
          path: apps/web/dist
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web
