name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
  checks: write
  # https://github.com/dorny/test-reporter/issues/149
jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build recipebridge WASM
        run: pnpm wasm
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: apps/web/wasm

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - run: pnpm run format:check
        name: "check prettier formatting"
      - run: pnpm run check
        name: "lint and type check"
      - run: cd apps/web && npx knip --no-exit-code
        name: "check for unused code with knip"

  test:
    name: Tests
    needs: [build-wasm]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        test-type: [unit, e2e]
    outputs:
      test-passed: ${{ (matrix.test-type == 'unit' && steps.unit-test.outcome == 'success') || (matrix.test-type == 'e2e' && steps.e2e-test.outcome == 'success') }}
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y29uY2lzZS1zaGVwaGVyZC00MS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Setup environment variables
        run: |
          cp apps/web/.env.example apps/web/.env
          echo "NEXTAUTH_SECRET=supersecret" >> apps/web/.env
          echo "USDA_API_URL=https://usda-db.fly.dev/" >> apps/web/.env
      - name: Push schema to database
        run: pnpm --filter @recipehub/web db:push

      # Unit/Integration Tests
      - name: Run unit and integration tests
        id: unit-test
        if: matrix.test-type == 'unit'
        run: |
          mkdir -p apps/web/test-results
          pnpm --filter @recipehub/web test -- \
            --coverage \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=test-results/vitest-junit.xml
      - name: Publish Vitest Results
        if: matrix.test-type == 'unit' && always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit/Integration Tests
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload coverage reports to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/recipehub

      # E2E Tests
      - name: Install Playwright Browsers
        if: matrix.test-type == 'e2e'
        run: cd apps/web && npx playwright install --with-deps
      - name: Run Playwright tests
        id: e2e-test
        if: matrix.test-type == 'e2e'
        run: cd apps/web && npx playwright test
      - name: Publish Playwright Results
        if: matrix.test-type == 'e2e' && always()
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: apps/web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: matrix.test-type == 'e2e' && !cancelled()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  check-tests:
    name: Check All Tests Passed
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      all-passed: ${{ steps.check.outputs.all-passed }}
    steps:
      - name: Check test results
        id: check
        run: |
          # Check if all test matrix jobs succeeded
          unit_result="${{ needs.test.result }}"
          if [[ "$unit_result" == "success" ]]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to Vercel
    needs: [build-wasm, lint-format, check-tests]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.lint-format.result == 'success' &&
      needs.check-tests.outputs.all-passed == 'true'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: team_rAffu7VKl4KcVrPBRqaMYB7f
          VERCEL_PROJECT_ID: prj_JPllV9ESJ1mzTBJZEmAtNrooLS00
