name: CI

on:
  pull_request:
    branches: [main]
    # A journey label starts a journey-only run (docs/ci.md#journeys).
    types: [opened, synchronize, reopened, closed, labeled]
  push:
    branches: [main]
  schedule:
    # Nightly selects every lane and reuses passes valid for the observed
    # environment. Fresh diagnostics are an explicit manual option.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Routed changes or every lane (both use valid caches)
        type: choice
        options: [routed, full]
        default: routed
      fresh:
        description: Bypass remote passes; reuse only results freshly produced on this runner
        type: boolean
        default: false
      purchase-import:
        description: Run the informational purchase-import browser after required diagnostics succeed
        type: boolean
        default: false
      live-email:
        description: Run paid live Email evaluations after required diagnostics succeed
        type: boolean
        default: false
      journey:
        description: >-
          Empty runs ordinary cached diagnostics. Otherwise runs only this journey on the
          dispatched ref: simulator-search, simulator-inputs, tester-army-web,
          tester-army-visual, tester-army-explore, tester-army-ios,
          tester-army-both, tester-army-import or tester-army-all.
        type: string
        default: ""

concurrency:
  # A merged PR's github.ref becomes main; retain its pre-merge group so
  # closure cancels the PR run without touching main's push run. A journey
  # label's run shares the PR's group but cancels nothing: it waits for a
  # running CI run, and a push or closure cancels it. A journey dispatch gets
  # its own group; any other label's run is alone and exits. The journey
  # labels are repeated in plan's `if` and its journey step.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}-${{ github.event_name }}${{ github.event.action == 'labeled' && !contains(fromJSON('["tester-army", "tester-army:ios", "tester-army:import", "simulator-e2e"]'), github.event.label.name) && format('-{0}', github.run_id) || inputs.journey && format('-{0}', inputs.journey) || '' }}
  # PR updates supersede old results. Main must finish publishing reusable
  # caches. The default single pending slot retains only the newest waiting run.
  cancel-in-progress: ${{ github.event_name != 'push' && github.event.action != 'labeled' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

env:
  # Establish the same warning policy before cache probes and compilation.
  CARGO_BUILD_WARNINGS: deny
  # Fresh diagnostics bypass only the remote cache. Each runner's initially
  # empty local cache retains fresh prerequisites for subsequent Nx calls.
  NX_SKIP_REMOTE_CACHE: ${{ inputs.fresh && 'true' || 'false' }}
  # Read by setup-node-with-deps, which connects Nx to the shared remote cache
  # only when both are present (a fork PR receives neither) and it responds.
  NX_CACHE_URL: ${{ secrets.NX_CACHE_URL }}
  NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}

# `plan` starts only the lanes whose Nx inputs changed since the last green
# main run; a started lane still replays unchanged tasks from the Nx cache.
# `CI passed` is the one required check (docs/adr/0014-path-routed-ci-lanes.md).
# A journey-only run starts only the informational journey jobs.
jobs:
  plan:
    name: Plan
    # The closed event only enters concurrency to cancel the previous run;
    # another label's event starts nothing.
    if: >-
      github.event.action != 'closed' && (github.event.action != 'labeled' ||
      contains(fromJSON('["tester-army", "tester-army:ios", "tester-army:import", "simulator-e2e"]'), github.event.label.name))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.select.outputs.lanes || '[]' }}
      matrix: ${{ steps.select.outputs.matrix || '[]' }}
      optional: ${{ steps.select.outputs.optional || '[]' }}
      skips: ${{ steps.select.outputs.skips }}
      tree: ${{ steps.tree.outputs.tree }}
      ref: ${{ steps.journeys.outputs.ref }}
      web: ${{ steps.journeys.outputs.web }}
      ios: ${{ steps.journeys.outputs.ios }}
      simulator: ${{ steps.journeys.outputs.simulator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            .github/ci-lanes.yml
            scripts/ci-policy.ts
            scripts/check-outward-text.ts
            packages/shared/src/shortcode-alphabet.ts
            packages/schemas/src/entity-definitions
          sparse-checkout-cone-mode: false
      # Journeys are informational and opt-in: a PR's journey labels, or a
      # dispatch naming one. A labeled event or a journey dispatch is a
      # journey-only run that checks out the PR head (or dispatched ref);
      # otherwise the PR's current labels ride along and wait for CI to pass.
      # A label run needs the head's latest `CI passed` to have succeeded and
      # skips a lane that already ran on the head. `opened` leaves labels to
      # the `labeled` events GitHub sends after it. Fork PRs never run journeys.
      - name: Select journeys
        id: journeys
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          JOURNEY: ${{ inputs.journey }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          labels='[]'
          case "$JOURNEY" in
            "" | simulator-search | simulator-inputs | tester-army-web | tester-army-visual | tester-army-explore \
              | tester-army-ios | tester-army-both | tester-army-import | tester-army-all) ;;
            *) echo "::error::Unknown journey '$JOURNEY'"; exit 1 ;;
          esac
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$ACTION" != opened ]]; then
            # Current labels, not the event's: one removed while this run
            # queued starts nothing. A later push supersedes this run.
            pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" || echo '{}')"
            if jq -e --arg head "$HEAD" --arg repo "$GITHUB_REPOSITORY" \
              '.state == "open" and .head.sha == $head and .head.repo.full_name == $repo' <<< "$pull" > /dev/null; then
              labels="$(jq -c '[.labels[].name]' <<< "$pull")"
            else
              echo "::notice::PR $PR moved past $HEAD, closed, or comes from a fork; no journey runs"
            fi
          fi
          if [[ "$ACTION" == labeled && "$labels" != '[]' ]]; then
            checks="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.status == "completed") | {name, conclusion, completed_at}' | jq -sc .)"
            ci="$(jq -r '[.[] | select(.name == "CI passed")] | max_by(.completed_at).conclusion // "none"' <<< "$checks")"
            if [[ "$ci" != success ]]; then
              echo "::notice::CI on $HEAD concluded $ci; no journey runs"
              labels='[]'
            else
              # A lane that passed or failed on this head ran already.
              ran="$(jq -c '[.[] | select(.conclusion == "success" or .conclusion == "failure") | .name]' <<< "$checks")"
              labels="$(jq -c --argjson ran "$ran" 'map(select(
                {"tester-army": "Tester Army web (informational)", "tester-army:import": "Tester Army import (informational)",
                 "tester-army:ios": "Tester Army ios 1/2 (informational)", "simulator-e2e": "iPhone simulator E2E (informational)"}[.]
                as $check | $check == null or ($ran | index($check)) == null))' <<< "$labels")"
            fi
          fi
          LABELS="$labels" node scripts/ci-policy.ts journeys
      # A PR run tests its merge commit, so a squash merge onto an unmoved main
      # pushes the same tree. `CI passed` publishes it only after every job.
      - name: Record the tested tree
        id: tree
        if: steps.journeys.outputs.mode == 'ci'
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # A main push of a tree that already passed starts no lane. Fork runs
      # don't count, and an API failure falls back to ordinary routing.
      - name: Find a green run of this tree
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-green-v2-$TREE&per_page=100" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' \
            || echo 0)"
          if [[ "$count" =~ ^[1-9] ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tree $TREE already passed CI; no lane starts"
          fi
      # Every lane passed on that tree, so a lane whose inputs match it would
      # replay the same pass. Nightly and manual runs have no baseline.
      - name: Find the last green main run
        id: base
        if: github.event_name != 'schedule' && inputs.scope != 'full' && !inputs.fresh && steps.journeys.outputs.mode == 'ci' && steps.tested.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A previous cache policy must never bootstrap the new gate.
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=10" \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' || true)"
          sha=''
          while IFS=$'\t' read -r id candidate; do
            [[ -n "$id" ]] || continue
            verified="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and (.name | startswith("ci-green-v2-")))] | length' || echo 0)"
            if [[ "$verified" =~ ^[1-9] ]]; then sha="$candidate"; break; fi
          done <<< "$runs"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::Lanes routed by policy-v2 baseline ${sha:-none; every lane runs}"
      - name: Match changes to lanes
        id: filter
        if: steps.base.outputs.sha != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # An empty token makes a pull request diff against `base` with git.
          token: ""
          base: ${{ steps.base.outputs.sha }}
          filters: .github/ci-lanes.yml
          predicate-quantifier: some-with-excludes
      - name: Identify relevant purchase-import changes
        id: purchase
        if: steps.journeys.outputs.mode == 'ci' && github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            relevant:
              - 'apps/web/src/server/domains/purchase-import/**'
              - 'apps/web/src/features/purchase/**'
              - 'apps/web/tests/e2e/purchase-import*'
              - 'apps/web/tests/e2e/fixtures/purchases*'
              - 'apps/web/tooling/purchase-agent-*.ts'
              - 'apps/web/tests/e2e/harness-services/purchase-*.ts'
              - 'apps/web/src/server/mcp/purchase-agent-protocol.ts'
              - '.claude/skills/purchase-import/**'
              - 'packages/schemas/src/purchase*'
      # A journey-only run selects no lane.
      - name: Select lanes
        id: select
        if: steps.journeys.outputs.mode == 'ci'
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          BASE: ${{ steps.base.outputs.sha }}
          TESTED: ${{ steps.tested.outputs.found }}
          SCOPE: ${{ inputs.scope }}
          FRESH: ${{ inputs.fresh }}
          LIVE_EMAIL: ${{ inputs.live-email }}
          PURCHASE_RELEVANT: ${{ steps.purchase.outputs.relevant }}
          PURCHASE_OPT_IN: ${{ inputs.purchase-import }}
        run: node scripts/ci-policy.ts lanes

  # The validation and docs lanes share one runner. A docs-only change
  # installs only the root tools and runs only the docs steps.
  validation:
    name: Validation and docs
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'validation') || contains(fromJSON(needs.plan.outputs.lanes), 'docs')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
      VALIDATE: ${{ contains(fromJSON(needs.plan.outputs.lanes), 'validation') }}
      DOCS: ${{ contains(fromJSON(needs.plan.outputs.lanes), 'docs') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: ${{ env.VALIDATE == 'true' && 'restore' || 'false' }}
          workspace-filter: ${{ env.VALIDATE != 'true' && 'cubby' || '' }}
      # Independent failures stay red but do not hide the remaining diagnostics.
      - name: Generated contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:generate --outputStyle=stream
      - name: Design tokens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:design-tokens --outputStyle=stream
      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:types --outputStyle=stream
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:lint --outputStyle=stream
      - name: Unused code and dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:knip --outputStyle=stream
      - name: Worker bindings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:bindings --outputStyle=stream
      - name: Tooling regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:script-tests --outputStyle=stream
      - name: CI routing drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run cubby-checks:ci-lanes --outputStyle=stream
      - name: Worker unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.VALIDATE == 'true' }}
        run: pnpm exec nx run @cubby/web:workers-tests --outputStyle=stream
      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.DOCS == 'true' }}
        run: pnpm exec nx run cubby-checks:format --outputStyle=stream
      - name: Check relative Markdown links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && env.DOCS == 'true' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './**/*.mdx'

  # The web and auxiliary lanes plan selected. Every entry is one standard
  # runner; only database lanes start the PostgreSQL services.
  lanes:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 20 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services: &test-databases # An empty image starts no service container.
      postgres:
        image: ${{ matrix.db && 'mirror.gcr.io/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: >-
            --set=jit=off --set=fsync=off
            --set=synchronous_commit=off --set=full_page_writes=off
        # Loopback only: 55432 is inside Linux's ephemeral port range, and on
        # all interfaces an outgoing connection's source port can hold it.
        ports:
          - 5432:5432
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s
          --health-retries 10 --health-start-period 3s
      # The pinned distroless image has no /bin/sh for Docker shell health
      # checks; its server retries PostgreSQL startup before serving requests.
      integresql:
        image: ${{ matrix.db && 'ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a' || '' }}
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
        ports:
          - 5000:5000
    # Each job owns fresh services and one host marker namespace.
    env: &web-lane-env
      CUBBY_TEMPLATE_SERVICE_ID: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
      NODE_OPTIONS: "--max-old-space-size=4096"
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: ${{ matrix.step || 'Run lane' }}
        if: ${{ !matrix.browser }}
        run: ${{ matrix.run }}
      - if: ${{ matrix.browser }}
        uses: ./.github/actions/playwright
        with:
          command: ${{ matrix.run }}
          artifact: ${{ matrix.browser }}
      # Companion checks retain independent results even after a browser or
      # earlier companion fails. Setup failure and cancellation still stop them.
      - name: ${{ matrix.checks[0].name || 'Companion check 1' }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.checks[0] }}
        run: ${{ matrix.checks[0].run }}
      - name: ${{ matrix.checks[1].name || 'Companion check 2' }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.checks[1] }}
        run: ${{ matrix.checks[1].run }}

  # Informative only, outside `CI passed` and allowed to fail: the purchase
  # agent driven through the browser against a scripted model and gateway,
  # and on dispatch the live Email decisions.
  optional:
    name: ${{ matrix.name }}
    needs: [plan, ci-passed]
    if: needs.ci-passed.result == 'success' && needs.plan.outputs.optional != '[]'
    concurrency:
      group: cubby-informational-ci
      cancel-in-progress: false
      queue: max
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.optional) }}
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - if: ${{ matrix.browser }}
        uses: ./.github/actions/playwright
        with:
          command: ${{ matrix.run }}
          artifact: ${{ matrix.browser }}
          save-browser: "false"
      - if: ${{ !matrix.browser }}
        run: ${{ matrix.run }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  rust:
    name: Rust - recipebridge and cubby-ffi
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'rust')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          workspace-filter: cubby
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ". -> target"
          # Root workspace profiles are not part of rust-cache's member manifest hash.
          # Retire immutable empty entries saved when Nx replayed both Rust targets.
          prefix-key: rust-gate-v3
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: false
      # One crate at a time: both share the workspace target directory.
      - run: pnpm exec nx run-many -t rust --parallel=1 --outputStyle=stream

  apple-lint:
    name: Swift formatting and state rules
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'apple-lint')
    # The runner image's own Swift (its swift-format) keeps macOS slots for
    # native builds.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          workspace-filter: cubby
      - run: pnpm exec nx run apple:lint --outputStyle=stream

  # Linux checks whether each Apple lane's pass is already cached before any
  # macOS runner queues. A probe miss fails before native work and cannot
  # publish a passing Nx cache entry.
  apple-environment:
    name: Observe hosted Apple toolchain
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.lanes), 'apple') && !inputs.fresh
    runs-on: xcode-27
    timeout-minutes: 5
    concurrency:
      group: cubby-apple-discovery
      cancel-in-progress: false
      queue: max
    outputs:
      environment: ${{ steps.observe.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/ci-environment.ts
            rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - name: Observe selected Xcode 27 without preparing a build
        id: observe
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer
          echo "environment=$(node scripts/ci-environment.ts apple)" >> "$GITHUB_OUTPUT"

  apple-probe:
    name: Apple cache probe
    needs: [plan, apple-environment]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.apple-environment.result == 'success' && !inputs.fresh }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      host: ${{ steps.host.outcome }}
      simulator: ${{ steps.simulator.outcome }}
    env:
      CUBBY_NX_CACHE_PROBE: "1"
      CUBBY_APPLE_ENVIRONMENT: ${{ needs.apple-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
      - id: host
        continue-on-error: true
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      - id: simulator
        continue-on-error: true
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream

  # Each Apple lane queues macOS only when Linux did not verify its cached
  # pass; a failed probe falls through to macOS. Queued jobs probe again
  # before preparing native dependencies.
  apple-host:
    name: Apple host tests
    needs: [plan, apple-probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.lanes), 'apple') && needs.apple-probe.outputs.host != 'success' }}
    runs-on: xcode-27
    concurrency:
      group: cubby-apple-host
      cancel-in-progress: false
      queue: max
    timeout-minutes: 40
    env:
      # The restore and save steps must name the same paths.
      HOST_BUILD_CACHE_PATHS: |
        apps/apple/CubbyKit/.build/*
        !apps/apple/CubbyKit/.build/xcode
        apps/apple/CubbyKit/.build/xcode/CompilationCache.noindex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Package clones come from the simulator job's shared clone cache.
      - id: apple
        uses: ./.github/actions/setup-apple
        with:
          probe: apple:host-tests
          ffi-targets: mac
          xcodegen: "false"
      # Build products are disposable; unchanged compiler inputs replay through
      # Xcode's compilation cache without forging checkout timestamps. Keep
      # SwiftPM's warning-generator products.
      - name: Compute host Xcode toolchain hash
        if: steps.apple.outputs.probe-hit != 'true'
        id: host-xcode-version
        run: echo "hash=$(xcodebuild -version 2>&1 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore cached host compilation
        if: steps.apple.outputs.probe-hit != 'true'
        id: host-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}-${{ hashFiles('apps/apple/scripts/check-openapi-warnings.sh') }}
          restore-keys: |
            xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-
      - name: Run CubbyKit host tests
        if: steps.apple.outputs.probe-hit != 'true'
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      # Publish only successful builds: exact-key cache entries are immutable.
      - name: Save host compilation cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: ${{ steps.host-build.outputs.cache-primary-key }}
          cache-hit: ${{ steps.host-build.outputs.cache-hit }}
          matched-key: ${{ steps.host-build.outputs.cache-matched-key }}

  apple-simulator:
    name: Apple simulator build
    needs: [plan, apple-probe]
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON(needs.plan.outputs.lanes), 'apple') && needs.apple-probe.outputs.simulator != 'success' }}
    runs-on: xcode-27
    concurrency:
      group: cubby-apple-simulator
      cancel-in-progress: false
      queue: max
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcode's content-addressed compiler cache replays unchanged inputs
      # with ordinary checkout mtimes and filesystem identities.
      - uses: ./.github/actions/setup-apple
        id: apple
        with:
          probe: apple:simulator-build
          ffi-targets: sim
          build-cache: "true"
      - name: Run iOS app checks
        if: steps.apple.outputs.probe-hit != 'true'
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream
      # A canceled compile must not permanently populate an exact cache key.
      - name: Save DerivedData cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.apple.outputs.cache-paths }}
          key: ${{ steps.apple.outputs.cache-key }}
          cache-hit: ${{ steps.apple.outputs.cache-hit }}
          matched-key: ${{ steps.apple.outputs.save-matched-key }}
      - name: Save SPM clone cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple.outputs.spm-clones-cache-key }}
          cache-hit: ${{ steps.apple.outputs.spm-clones-cache-hit }}
          matched-key: ${{ steps.apple.outputs.spm-clones-cache-matched-key }}

  # Informational journeys (docs/tester-army.md), outside `CI passed`. Plan
  # selects them from PR labels or a journey dispatch; they test the PR head.
  # The GitHub reporter comments on the PR from the pull_request event.
  tester-army-web:
    name: Tester Army ${{ matrix.lane }} (informational)
    needs: [plan, ci-passed]
    # A journey-only run skips the gate; a CI run's journeys wait for it.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ci-passed.result != 'failure' && needs.plan.outputs.web != '[]' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.web) }}
    timeout-minutes: ${{ matrix.timeout }}
    services: *test-databases
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      E2E_OAUTH_CREDENTIALS: ${{ secrets.E2E_OAUTH_CREDENTIALS }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      TESTER_ARMY_AGENT_MODEL: ${{ vars.TESTER_ARMY_AGENT_MODEL }}
      TESTER_ARMY_AGENT_EFFORT: ${{ vars.TESTER_ARMY_AGENT_EFFORT }}
      TESTER_ARMY_WEB_MODE: ${{ matrix.mode }}
      TESTER_ARMY_LANE: ${{ matrix.lane }}
      TESTER_ARMY_JOURNEYS: ${{ matrix.journeys }}
      E2E_TELEMETRY_DISABLED: "1"
      TESTER_ARMY_CI_EVIDENCE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      # PR runs replay verified actions; a dispatch runs live.
      TESTER_ARMY_REPLAY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: Restore verified action recordings
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.e2e/cache
          key: tester-army-replay-v1-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tester-army-replay-v1-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @cubby/web run test:e2e:install-browser chromium --with-deps
      - run: pnpm test:e2e:agent:web -- --harness ${{ matrix.harness }}
      - name: Save verified action recordings
        if: always() && !cancelled() && github.event_name == 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.e2e/cache
          key: tester-army-replay-v1-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save synthetic run bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-${{ matrix.lane }}-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/tester-army/web/*/run-manifest.json
            artifacts/tester-army/web/*/run-results.json
            artifacts/tester-army/web/*/agent-summary.json
            artifacts/tester-army/web/*/gateway-usage.json
            artifacts/tester-army/web/*/SHA256SUMS
      - name: Save screenshots, failure traces and video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-${{ matrix.lane }}-evidence-${{ needs.plan.outputs.ref }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            apps/web/.e2e/runs/web/**/report.json
            apps/web/.e2e/runs/web/**/junit.xml
            apps/web/.e2e/runs/web/**/results/*/attempt-*/screenshots/*.png
            apps/web/.e2e/runs/web/**/results/*/attempt-*/snapshots/**/*.png
            apps/web/.e2e/runs/web/**/results/*/trace.md
            apps/web/.e2e/runs/web/**/results/*/attempt-*/screen-at-failure.txt
            apps/web/.e2e/runs/web/**/results/*/attempt-*/video/*.webm
            apps/web/.e2e/runs/web/**/results/*/attempt-*/video/*.mp4

  # Native journeys reuse the simulator app the simulator build or an earlier
  # run cached (the gate they wait on covers that build). setup-apple probes the app before the large
  # SPM clone and DerivedData restores, and the journey command builds a miss.
  tester-army-ios:
    name: Tester Army ios ${{ matrix.shard }}/2 (informational)
    needs: [plan, ci-passed]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ci-passed.result != 'failure' && needs.plan.outputs.ios == 'true' }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 40
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      E2E_OAUTH_CREDENTIALS: ${{ secrets.E2E_OAUTH_CREDENTIALS }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      E2E_TELEMETRY_DISABLED: "1"
      TESTER_ARMY_CI_EVIDENCE: "1"
      GITHUB_TOKEN: ${{ github.token }}
      TESTER_ARMY_REPLAY: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      CUBBY_SIM_DB_EXTERNAL: "1"
      TESTER_ARMY_SHARD: ${{ matrix.shard }}/2
      TESTER_ARMY_LANE: ios-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup-apple
        id: apple
        with:
          ffi-targets: sim
          wasm: restore
          build-cache: "true"
          probe: apple:simulator-build
      - name: Restore verified action recordings
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.e2e/cache
          key: tester-army-replay-v1-ios-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tester-army-replay-v1-ios-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/setup-apple-test-runner-cache
        id: test-runner
        with:
          toolchain-hash: ${{ steps.apple.outputs.toolchain-hash }}
      - uses: ./.github/actions/start-native-postgres
      - run: pnpm test:e2e:agent:ios
      - name: Save Apple test runner cache
        uses: ./.github/actions/save-apple-test-runner-cache
        with:
          path: ${{ steps.test-runner.outputs.cache-paths }}
          key: ${{ steps.test-runner.outputs.cache-key }}
          cache-hit: ${{ steps.test-runner.outputs.cache-hit }}
          matched-key: ${{ steps.test-runner.outputs.matched-key }}
      - name: Save DerivedData cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.apple.outputs.cache-paths }}
          key: ${{ steps.apple.outputs.cache-key }}
          cache-hit: ${{ steps.apple.outputs.cache-hit }}
          matched-key: ${{ steps.apple.outputs.save-matched-key }}
      - name: Save verified action recordings
        if: always() && !cancelled() && github.event_name == 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/web/.e2e/cache
          key: tester-army-replay-v1-ios-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save synthetic iOS run bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-ios-${{ matrix.shard }}-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/sim-tester-army-e2e/*/run-manifest.json
            artifacts/sim-tester-army-e2e/*/run-results.json
            artifacts/sim-tester-army-e2e/*/agent-summary.json
            artifacts/sim-tester-army-e2e/*/native-driver-diagnostics.json
            artifacts/sim-tester-army-e2e/*/SHA256SUMS
      - name: Save screenshots, failure traces and video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-ios-${{ matrix.shard }}-evidence-${{ needs.plan.outputs.ref }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            apps/web/.e2e/runs/sim-tester-army-e2e/**/report.json
            apps/web/.e2e/runs/sim-tester-army-e2e/**/junit.xml
            apps/web/.e2e/runs/sim-tester-army-e2e/**/results/*/attempt-*/screenshots/*.png
            apps/web/.e2e/runs/sim-tester-army-e2e/**/results/*/trace.md
            apps/web/.e2e/runs/sim-tester-army-e2e/**/results/*/attempt-*/screen-at-failure.txt
            apps/web/.e2e/runs/sim-tester-army-e2e/**/results/*/attempt-*/video/*.webm
            apps/web/.e2e/runs/sim-tester-army-e2e/**/results/*/attempt-*/video/*.mp4

  simulator-e2e:
    name: iPhone simulator E2E (informational)
    needs: [plan, ci-passed]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.ci-passed.result != 'failure' && needs.plan.outputs.simulator != '' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: ./.github/actions/setup-apple
        id: apple
        with:
          ffi-targets: sim
          wasm: restore
          build-cache: "true"
          probe: apple:simulator-build
      - uses: ./.github/actions/setup-apple-test-runner-cache
        id: test-runner
        with:
          toolchain-hash: ${{ steps.apple.outputs.toolchain-hash }}
      - uses: ./.github/actions/start-native-postgres
      - name: Run native read and write against a disposable database
        env:
          CUBBY_SIM_DB_EXTERNAL: "1"
          CI: "1"
          SIMULATOR_JOURNEY: ${{ needs.plan.outputs.simulator }}
        run: |
          if [[ "$SIMULATOR_JOURNEY" == "inputs" ]]; then
            pnpm test:e2e:sim -- --input-journey
          else
            pnpm test:e2e:sim -- --extended-journey
          fi
      - name: Save Apple test runner cache
        uses: ./.github/actions/save-apple-test-runner-cache
        with:
          path: ${{ steps.test-runner.outputs.cache-paths }}
          key: ${{ steps.test-runner.outputs.cache-key }}
          cache-hit: ${{ steps.test-runner.outputs.cache-hit }}
          matched-key: ${{ steps.test-runner.outputs.matched-key }}
      - name: Save DerivedData cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.apple.outputs.cache-paths }}
          key: ${{ steps.apple.outputs.cache-key }}
          cache-hit: ${{ steps.apple.outputs.cache-hit }}
          matched-key: ${{ steps.apple.outputs.save-matched-key }}
      # Upload only files whose checksums the run sealed.
      - name: Collect verified simulator E2E evidence
        if: always()
        shell: python
        run: |
          import hashlib
          import pathlib
          import shutil

          for checksums in pathlib.Path("artifacts").glob("sim*-e2e/*/SHA256SUMS"):
              source = checksums.parent
              target = pathlib.Path("artifacts/sealed-simulator-e2e") / source.name
              target.mkdir(parents=True, exist_ok=True)
              for line in checksums.read_text().splitlines():
                  digest, name = line.split("  ", 1)
                  file = source / name
                  if not file.resolve().is_relative_to(source.resolve()):
                      raise ValueError("Sealed evidence escapes its run directory")
                  if hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                      raise ValueError(f"Sealed evidence checksum mismatch: {name}")
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, destination)
              shutil.copyfile(checksums, target / checksums.name)
      - name: Save simulator E2E run bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-e2e-run
          if-no-files-found: error
          retention-days: 7
          path: artifacts/sealed-simulator-e2e

  # The one required check. A job may be skipped only when plan skipped its
  # lane or the probe verified its cached Apple pass; any other skip, failure
  # (except the probe's), or cancellation fails it. A label event or journey
  # dispatch is no merge evidence: it records no tree, and because a skipped
  # job still reports success, its skipped job is named apart from the gate.
  ci-passed:
    name: ${{ github.event_name == 'workflow_dispatch' && !inputs.journey && 'Manual CI diagnostics' || (github.event.action == 'labeled' || inputs.journey) && 'Journey run (not the merge gate)' || 'CI passed' }}
    needs:
      [
        plan,
        validation,
        lanes,
        rust,
        apple-lint,
        apple-environment,
        apple-probe,
        apple-host,
        apple-simulator,
      ]
    if: always() && github.event.action != 'closed' && github.event.action != 'labeled' && !inputs.journey
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/check-outward-text.ts
            scripts/ci-summary.ts
            packages/shared/src/shortcode-alphabet.ts
            packages/schemas/src/entity-definitions
          sparse-checkout-cone-mode: false
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # A failed probe only sends both Apple lanes to macOS.
          allowed-failures: apple-probe
          allowed-skips: >-
            ${{ needs.plan.outputs.skips }},
            ${{ needs.apple-probe.outputs.host == 'success' && 'apple-host' || '' }},
            ${{ needs.apple-probe.outputs.simulator == 'success' && 'apple-simulator' || '' }}
      # Records that this tree passed, so a main push of the same tree (a
      # squash merge onto an unmoved main) starts no lane.
      - name: Record the passing tree
        if: github.event_name != 'workflow_dispatch'
        run: echo "$TREE" > tested-tree
        env:
          TREE: ${{ needs.plan.outputs.tree }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          name: ci-green-v2-${{ needs.plan.outputs.tree }}
          path: tested-tree
          retention-days: 14
          overwrite: true
      - name: Report runner demand and timing
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-summary.ts
