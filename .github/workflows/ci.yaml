name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple == 'true' }}
    steps:
      # Only pull requests have outward text to check or a diff to filter
      # on; a push or workflow_dispatch skips every step here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: |
            .nvmrc
            scripts/check-outward-text.ts
            packages/shared/src/generated/shortcode-registry.gen.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      # The commit-msg hook gates commit messages; the PR title and body are
      # the other outward text AGENTS.md keeps free of live entity codes.
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin
      # The Apple lane is path-filtered because it's by far the slowest
      # (macOS runners, xcodebuild) — everything else always runs. On a push
      # or workflow_dispatch (no PR to diff against) the Apple lane always
      # runs too. `.github/` is narrowed to the files those jobs actually
      # use, rather than the whole directory, so unrelated workflow/action
      # edits don't force a macOS run. paths-filter reads the PR's file list
      # from the API, so the sparse checkout above is enough.
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            apple:
              - 'apps/apple/**'
              - 'cubby-ffi/**'
              - 'recipebridge/**'
              - 'rust-toolchain.toml'
              - 'scripts/ensure-apple-ffi.ts'
              - 'scripts/rust-fingerprint.ts'
              - 'scripts/apple-check.sh'
              - 'scripts/stamp-source-mtimes.ts'
              - 'apps/web/src/lib/generated/http-openapi.gen.json'
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup-apple-ffi/**'
              - '.github/actions/setup-apple-tools/**'

  validation:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      # The Nx `wasm` target's runtime input (ensure-wasm.ts --fingerprint)
      # runs `wasm-pack --version`, which a restored package does not provide.
      - name: Install wasm-pack for validation
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: wasm-pack
      - run: pnpm check:all
      - run: pnpm dedupe:check

  test-aux:
    name: Auxiliary tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - name: Run auxiliary package tests
        run: pnpm -r --no-sort --workspace-concurrency=2 --no-bail --filter '!@cubby/web' --if-present run test --maxWorkers=1
      - run: pnpm --filter @cubby/usda-api run build
      - run: pnpm --filter @cubby/upc-lookup run build

  test-rust:
    name: Rust - recipebridge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          cache-workspaces: "recipebridge -> target"
      - run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path recipebridge/Cargo.toml

  test-web:
    name: Tests - web (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: node
            args: --project unit --project mcp-contract --project worker-safety
          - tier: ui
            args: --project ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - name: Build web Cloudflare bundle
        if: matrix.tier == 'node'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: pnpm --filter @cubby/web run build:cf
      - name: Save recipebridge WASM
        if: matrix.tier == 'node'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recipebridge-wasm
          path: packages/wasm
          if-no-files-found: error
          retention-days: 1
      - name: Save Cloudflare bundle
        if: matrix.tier == 'node'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cf-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Run ${{ matrix.tier }} tests
        run: pnpm --dir apps/web exec vitest run ${{ matrix.args }}

  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web... @cubby/purchase-agent..."
      - name: Build coupled workerd Workers
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          pnpm --filter @cubby/purchase-agent run build
          pnpm --filter @cubby/web run build:cf
      - name: Run PostgreSQL integration tests
        env:
          CUBBY_TEST_INTEGRATION: "1"
        run: pnpm --dir apps/web exec vitest run --project integration

  test-e2e:
    name: E2E tests (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two Playwright workers on one runner flaked (2026-09-21,
          # inventory-session.spec, a 15s toBeVisible timeout under
          # CUBBY_E2E_WORKERS=2), so chromium shards across runners at one
          # worker each; webkit stays a single unsharded smoke lane. Three
          # shards need shard-independent specs (#1228) and the aggregate
          # required check below, so the shard count never touches the
          # ruleset; ledger in docs/ci.md.
          - lane: "chromium 1/3"
            slug: chromium-1
            browser: chromium
            test-script: test:e2e:ci:chromium
            shard: "1/3"
          - lane: "chromium 2/3"
            slug: chromium-2
            browser: chromium
            test-script: test:e2e:ci:chromium
            shard: "2/3"
          - lane: "chromium 3/3"
            slug: chromium-3
            browser: chromium
            test-script: test:e2e:ci:chromium
            shard: "3/3"
          - lane: webkit
            slug: webkit
            browser: webkit
            test-script: test:e2e:ci:webkit
            shard: "1/1"
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
    # Deliberately duplicated from test-postgres above: GitHub Actions YAML
    # has no anchors and no reusable "services" construct that fits a
    # per-job block like this.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
      - name: Resolve installed Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      # 2026-09: coupled to the ubuntu-latest image's apt layout; expect to
      # revisit when the image changes.
      - name: Bound Ubuntu package mirror retries
        if: matrix.browser == 'webkit'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-cubby-ci >/dev/null
          sudo chown -R "$USER":"$(id -gn)" /var/cache/apt/archives
      - name: Cache Playwright system packages
        if: matrix.browser == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: playwright-system-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-webkit-v1
      - name: Install Playwright browser dependencies
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        run: pnpm --filter @cubby/web run test:e2e:install-deps -- ${{ matrix.browser }}
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- ${{ matrix.browser }}
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Wait for the tested Cloudflare bundle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            for (;;) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              if (artifacts.some(({ name }) => name === "cf-build")) return;

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              // Matches the job's display name literally: renaming test-web
              // silently turns a build failure into a 20-minute timeout here.
              const build = jobs.find(
                ({ name }) => name === "Tests - web (node)",
              );
              if (
                build?.status === "completed" &&
                build.conclusion !== "success"
              ) {
                core.setFailed(`Cloudflare build ended ${build.conclusion}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed("cf-build was not published within twenty minutes");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: recipebridge-wasm
          path: packages/wasm
      - name: Run Playwright tests
        run: pnpm --filter @cubby/web run ${{ matrix.test-script }} --shard=${{ matrix.shard }}
      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.slug }}
          path: apps/web/playwright-report/
          retention-days: 1

  # One stable name for "every chromium shard passed", so the shard count can
  # change without renaming a required check: the main ruleset requires this
  # job, not the per-shard lanes (switched 2026-09-23). `needs.test-e2e.result`
  # folds the webkit lane in too, so read the chromium lanes' own conclusions.
  test-e2e-chromium:
    name: E2E tests (chromium)
    needs: test-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every chromium shard to pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            // Matches the matrix display name "E2E tests (chromium k/n)".
            const shards = jobs.filter(({ name }) =>
              /^E2E tests \(chromium \d+\/\d+\)$/.test(name),
            );
            for (const { name, conclusion } of shards) {
              core.info(`${name}: ${conclusion}`);
            }
            if (shards.length === 0) {
              core.setFailed("No chromium shard ran");
            } else if (shards.some(({ conclusion }) => conclusion !== "success")) {
              core.setFailed("A chromium shard did not succeed");
            }

  # Host `swift test` for CubbyKit's package tests; not folded into test-apple
  # below. Measured 2026-09-21: running these on the iOS Simulator inside the
  # build job cost about 6 minutes to boot plus ~10 minutes of CPU starvation
  # on a hosted macOS runner's 3 cores (a 5s script took 2.6 min, the compile
  # doubled) — the merged job took 13 min even with warm caches. Two jobs beat
  # one.
  test-apple-package:
    name: Apple package tests
    needs: scope
    if: needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: mac
      # The whole SwiftPM build directory is cached, not just the checkouts:
      # 367 tests run in ~3s, the other 2.5-4 minutes was a cold build.
      # stamp-source-mtimes.ts gives each tracked source an mtime derived
      # from its blob hash, so unchanged files match the restored build and
      # only changed ones recompile (measured locally: 76s cold, 41s restored
      # with fresh-checkout mtimes, 3s restored and stamped, 8s with one
      # CubbyKit file changed). The key ends in a hash of CubbyKit so main
      # saves once per Swift change; PRs restore main's newest by prefix.
      - name: Compute Swift toolchain hash
        id: swift-version
        run: echo "hash=$(swift --version 2>&1 | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Restore cached SwiftPM build
        id: spm-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/CubbyKit/.build
          key: spm-build-v1-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**') }}
          restore-keys: |
            spm-build-v1-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            spm-build-v1-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-
      - name: Stamp source mtimes from content
        run: node scripts/stamp-source-mtimes.ts apps/apple/CubbyKit
      # --disable-index-store: nothing reads the index on CI, and it would
      # otherwise be rebuilt and cached with every module.
      - name: Run CubbyKit Swift tests
        run: swift test --package-path apps/apple/CubbyKit --force-resolved-versions --disable-index-store
      # Saved here rather than by actions/cache's post step so a red test run
      # still keeps the build for the next attempt. Only main saves once a
      # prefix exists: a PR's cache is private to its ref and a ~1 GB copy
      # per PR evicts everyone else's caches (the repo sat at 13.4 GB of
      # 10 GB on 2026-09-22). A concurrent job may have saved the same key
      # first; that 409 is harmless and must never fail the check.
      - name: Save SwiftPM build cache
        if: >-
          always() && steps.spm-build.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || steps.spm-build.outputs.cache-matched-key == '')
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/CubbyKit/.build
          key: ${{ steps.spm-build.outputs.cache-primary-key }}

  test-apple:
    name: Apple checks
    needs: scope
    if: needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        id: apple-tools
      # DerivedData is cached like CubbyKit's .build above: apple-check.sh's
      # ci mode stamps tracked sources with blob-hash mtimes after xcodegen,
      # and XCBuild is told to ignore the device/inode changes every cache
      # restore introduces, so only changed sources recompile.
      - name: Compute Xcode version hash
        id: xcode-version
        run: |
          echo "hash=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
      - name: Restore cached DerivedData
        id: derived-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Must list exactly the save step's paths: the cache version hashes them.
          path: |
            apps/apple/DerivedData
            !apps/apple/DerivedData/Logs
          key: xcode-dd-v1-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/App/**', 'apps/apple/CubbyKit/**') }}
          restore-keys: |
            xcode-dd-v1-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/CubbyKit/Package.resolved') }}-
            xcode-dd-v1-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-
      - name: Run iOS app checks
        run: sh scripts/apple-check.sh ci
      # Same policy as the SwiftPM build cache: PRs save only when no prefix
      # exists, otherwise only main saves.
      - name: Save DerivedData cache
        if: >-
          always() && steps.derived-data.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' || steps.derived-data.outputs.cache-matched-key == '')
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/apple/DerivedData
            !apps/apple/DerivedData/Logs
          key: ${{ steps.derived-data.outputs.cache-primary-key }}
      # Saved here rather than by actions/cache's post step so a red build
      # still keeps the generator build and SPM clones for the next attempt.
      # A concurrent job may have saved the same key first; that 409 is
      # harmless and must never fail the check.
      # Never save an empty generator directory: a run that fails before the
      # generator is built would otherwise poison the exact key for good.
      - name: Check OpenAPI generator binary
        id: generator-built
        if: always() && steps.apple-tools.outputs.openapi-generator-cache-hit != 'true'
        run: test -x "$CUBBY_OPENAPI_GENERATOR_BIN" && echo "present=true" >> "$GITHUB_OUTPUT" || true
      - name: Save OpenAPI generator cache
        if: always() && steps.generator-built.outputs.present == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CUBBY_OPENAPI_GENERATOR_BIN_DIR }}
          key: ${{ steps.apple-tools.outputs.openapi-generator-cache-key }}
      # ~1.1 GB per entry, and a PR's copy is private to its ref: seven of
      # them were 8.3 GB of the repo's 10 GB cache on 2026-09-22.
      - name: Save SPM clone cache
        if: >-
          always() && steps.apple-tools.outputs.spm-clones-cache-hit != 'true' &&
          (github.event_name == 'push' || steps.apple-tools.outputs.spm-clones-cache-matched-key == '')
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}

  # Populates apple-testflight.yaml's release FFI caches (setup-apple-ffi's
  # targets=device/mac, profile=dist) on every main push, so a release hits
  # a warm cache instead of the cold ~7-minute Rust build those keys
  # previously only ever saw during a release itself. Deliberately does not
  # `need` scope: it should warm regardless of the PR path filter, and there
  # is no PR here to filter anyway (push-only). Not a required check.
  warm-apple-ffi:
    name: Warm Apple FFI cache (${{ matrix.targets }})
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        targets: [device, mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: ${{ matrix.targets }}
          profile: dist

