name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: "17 10 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run verification/deployment or the weekly coverage suite"
        type: choice
        options: [verify, coverage]
        default: verify
      force_full:
        description: "Ignore reusable PR results and run the full suite"
        type: boolean
        default: false
      bypass_e2e:
        description: "Deploy main despite a known-flaky E2E failure"
        type: boolean
        default: false
      check_processes:
        description: "Internal validation process-cap benchmark"
        type: choice
        options: ["2", "4"]
        default: "2"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.ref == 'refs/heads/main' && github.run_id ||
      format('{0}-{1}', github.ref,
        github.event.action == 'labeled' && github.event.label.name || 'verify')
    }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    if: |
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.scope.outputs.coverage }}
      verify: ${{ steps.scope.outputs.verify }}
      reuse: ${{ steps.scope.outputs.reuse }}
      source-run-id: ${{ steps.scope.outputs.source-run-id }}
      base-sha: ${{ steps.scope.outputs.base-sha }}
      inert: ${{ steps.scope.outputs.inert }}
      full: ${{ steps.scope.outputs.full }}
      web: ${{ steps.scope.outputs.web }}
      rust: ${{ steps.scope.outputs.rust }}
      aux: ${{ steps.scope.outputs.aux }}
      usda: ${{ steps.scope.outputs.usda }}
      upc: ${{ steps.scope.outputs.upc }}
      workers: ${{ steps.scope.outputs.workers }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      postgres: ${{ steps.scope.outputs.postgres }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Classify changes and find a reusable PR run
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DISPATCH_MODE: ${{ inputs.mode || 'verify' }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { classifyPaths } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-scope.ts`)
            );

            const coverage =
              context.eventName === "schedule" ||
              (context.eventName === "workflow_dispatch" &&
                process.env.DISPATCH_MODE === "coverage");

            let paths = [];
            let baseSha = "";
            if (context.eventName === "pull_request") {
              baseSha = context.payload.pull_request.base.sha;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              paths = files.map(({ filename }) => filename);
            } else if (!coverage) {
              baseSha =
                context.eventName === "push"
                  ? context.payload.before
                  : `${context.sha}^`;
              const result = await exec.getExecOutput(
                "git",
                ["diff", "--name-only", baseSha, context.sha],
                { silent: true },
              );
              paths = result.stdout.split("\n").filter(Boolean);
            }

            const classified = coverage
              ? classifyPaths([".github/workflows/ci.yaml"])
              : classifyPaths(paths);
            const full =
              coverage ||
              context.ref === "refs/heads/main" ||
              process.env.FORCE_FULL === "true" ||
              classified.highRisk;

            let reuse = false;
            let sourceRunId = "";
            const mayReuse =
              !coverage &&
              process.env.FORCE_FULL !== "true" &&
              context.ref === "refs/heads/main" &&
              ["push", "workflow_dispatch"].includes(context.eventName);

            if (mayReuse) {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { ...context.repo, commit_sha: context.sha, per_page: 100 },
              );
              const candidates = associated.filter(
                (pr) =>
                  pr.merged_at &&
                  pr.base.ref === "main" &&
                  pr.merge_commit_sha === context.sha &&
                  pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`,
              );

              if (candidates.length === 1) {
                const pr = candidates[0];
                const [mainCommit, headCommit] = await Promise.all([
                  github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: context.sha,
                  }),
                  github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: pr.head.sha,
                  }),
                ]);

                if (mainCommit.data.tree.sha === headCommit.data.tree.sha) {
                  const verificationArtifact =
                    `pr-verification-v2-${pr.number}-${pr.head.sha}`;
                  const runs = await github.paginate(
                    github.rest.actions.listWorkflowRuns,
                    {
                      ...context.repo,
                      workflow_id: "ci.yaml",
                      event: "pull_request",
                      status: "completed",
                      per_page: 100,
                    },
                  );
                  const greenRuns = runs
                    .filter(
                      (run) =>
                        run.head_sha === pr.head.sha &&
                        run.conclusion === "success",
                    )
                    .sort((a, b) => b.run_number - a.run_number);

                  for (const run of greenRuns) {
                    const artifacts = await github.paginate(
                      github.rest.actions.listWorkflowRunArtifacts,
                      { ...context.repo, run_id: run.id, per_page: 100 },
                    );
                    const artifactNames = new Set(
                      artifacts
                        .filter(({ expired }) => !expired)
                        .map(({ name }) => name),
                    );
                    if (!artifactNames.has(verificationArtifact)) continue;
                    if (classified.web && !artifactNames.has("cf-build")) continue;
                    reuse = true;
                    sourceRunId = String(run.id);
                    break;
                  }
                }
              }
            }

            const verify = !coverage && !reuse;
            const outputs = {
              coverage,
              verify,
              reuse,
              "source-run-id": sourceRunId,
              "base-sha": baseSha,
              inert: classified.inert,
              full,
              web: classified.web,
              rust: classified.rust,
              aux: classified.aux,
              usda: classified.usda,
              upc: classified.upc,
              workers: JSON.stringify(classified.workers),
              dependencies: classified.dependencies,
              postgres: classified.postgres,
              e2e: classified.e2e,
            };
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, value);
            }

            await core.summary
              .addHeading("CI scope")
              .addTable([
                [
                  { data: "Mode", header: true },
                  { data: "Full", header: true },
                  { data: "Reuse", header: true },
                  { data: "Web", header: true },
                  { data: "PostgreSQL", header: true },
                  { data: "E2E", header: true },
                ],
                [
                  coverage ? "coverage" : verify ? "verify" : "deploy-only",
                  String(full),
                  reuse ? `run ${sourceRunId}` : "no",
                  String(classified.web),
                  String(classified.postgres),
                  String(classified.e2e),
                ],
              ])
              .write();

      - name: Record reusable PR verification
        if: |
          github.event_name == 'pull_request' &&
          steps.scope.outputs.inert != 'true' &&
          steps.scope.outputs.coverage != 'true' &&
          steps.scope.outputs.verify == 'true'
        run: |
          printf 'policy=v1\npr=%s\nhead_sha=%s\nfull=%s\n' \
            '${{ github.event.pull_request.number }}' \
            '${{ github.event.pull_request.head.sha }}' \
            '${{ steps.scope.outputs.full }}' \
            > pr-verification.txt
      - name: Save PR verification provenance
        if: |
          github.event_name == 'pull_request' &&
          steps.scope.outputs.inert != 'true' &&
          steps.scope.outputs.coverage != 'true' &&
          steps.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-verification-v2-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: pr-verification.txt
          retention-days: 14

  validation:
    name: Validation
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.inert != 'true' &&
      (needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CHECK_MAX_PROCESSES: ${{ github.event_name == 'workflow_dispatch' && inputs.check_processes || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      - name: Run repository validation
        shell: bash
        env:
          CHECK_DEPENDENCIES: ${{ needs.scope.outputs.dependencies }}
        run: |
          pnpm check:all &
          pids=("$!")
          names=("complete repository validation")

          if [[ "$CHECK_DEPENDENCIES" == "true" ]]; then
            pnpm dedupe:check &
            pids+=("$!")
            names+=("dependency deduplication")
          fi

          result_code=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error::${names[$index]} failed"
              result_code=1
            fi
          done
          exit "$result_code"

  test-aux:
    name: Auxiliary tests and builds
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.verify == 'true' &&
      needs.scope.outputs.aux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - run: >-
          pnpm -r --no-sort --workspace-concurrency=2 --no-bail
          --filter '!@cubby/web' --if-present run test
          --maxWorkers=1 --reporter=default --reporter=github-actions
      - if: needs.scope.outputs.usda == 'true'
        run: pnpm --filter @cubby/usda-api run build
      - if: needs.scope.outputs.upc == 'true'
        run: pnpm --filter @cubby/upc-lookup run build

  test-rust:
    name: Rust - recipebridge
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      (needs.scope.outputs.verify == 'true' ||
      needs.scope.outputs.coverage == 'true') &&
      (needs.scope.outputs.rust == 'true' || needs.scope.outputs.coverage == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          components: ${{ needs.scope.outputs.coverage == 'true' && 'llvm-tools-preview' || '' }}
          cache-workspaces: "recipebridge -> target"
      - name: Install cargo-llvm-cov
        if: needs.scope.outputs.coverage == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      - if: needs.scope.outputs.coverage != 'true'
        run: cargo test --manifest-path recipebridge/Cargo.toml
      - if: needs.scope.outputs.coverage == 'true'
        run: cargo llvm-cov --manifest-path recipebridge/Cargo.toml --lcov --output-path recipebridge/lcov.info
      - if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-rust
          path: recipebridge/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-web:
    name: Tests - web (${{ matrix.tier }})
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      (needs.scope.outputs.verify == 'true' ||
      needs.scope.outputs.coverage == 'true') &&
      needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: node
            args: --project unit --project unit-pure --project mcp-contract
          - tier: ui
            args: --project ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ needs.scope.outputs.full == 'true' && 1 || 0 }}
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - uses: ./.github/actions/setup-web-env
      - name: Build web Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          CUBBY_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && format('PR#{0}', github.event.pull_request.number) || '' }}
        run: pnpm --filter @cubby/web run build:cf
      - name: Save recipebridge WASM
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recipebridge-wasm
          path: packages/wasm
          if-no-files-found: error
          retention-days: 1
      - name: Save Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cf-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Trigger opt-in preview deploy
        if: |
          matrix.tier == 'node' &&
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'preview') &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run preview-cf.yaml --ref main \
            -f pr_number="${{ github.event.pull_request.number }}" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f run_id="${{ github.run_id }}" ||
          echo "::warning::Could not dispatch the preview deploy; CI is unaffected."
      - name: Run ${{ matrix.tier }} tests
        shell: bash
        env:
          BASE_SHA: ${{ needs.scope.outputs.base-sha }}
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          FULL: ${{ needs.scope.outputs.full }}
          VITEST_PROJECT_ARGS: ${{ matrix.args }}
        run: |
          read -r -a selected <<< "$VITEST_PROJECT_ARGS"
          # Private-repository standard runners have half the CPUs of public
          # runners. Keep the same assertions while allowing CPU-bound tests
          # the equivalent wall-clock budget.
          args=("${selected[@]}" --testTimeout=10000 --reporter=default --reporter=github-actions)
          if [[ "$FULL" != "true" ]]; then args+=(--changed "$BASE_SHA"); fi
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Verify Calendar Durable Object and CalDAV
        if: matrix.tier == 'node'
        run: pnpm --filter @cubby/web test:calendar
      - name: Save web ${{ matrix.tier }} coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-${{ matrix.tier }}
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-postgres:
    name: PostgreSQL integration tests
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      (needs.scope.outputs.verify == 'true' ||
      needs.scope.outputs.coverage == 'true') &&
      needs.scope.outputs.web == 'true' &&
      (
        needs.scope.outputs.full == 'true' ||
        needs.scope.outputs.postgres == 'true' ||
        needs.scope.outputs.coverage == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ needs.scope.outputs.full == 'true' && 1 || 0 }}
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - uses: ./.github/actions/setup-web-env
      - name: Run PostgreSQL integration tests
        shell: bash
        env:
          BASE_SHA: ${{ needs.scope.outputs.base-sha }}
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          FULL: ${{ needs.scope.outputs.full }}
          CUBBY_TEST_INTEGRATION: "1"
        run: |
          args=(--project integration --reporter=default --reporter=github-actions)
          if [[ "$FULL" == "true" ]]; then
            export CUBBY_EXPECT_POSTGRES_TESTS=264
          else
            args+=(--changed "$BASE_SHA")
          fi
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Verify Calendar writes in workerd and PostgreSQL
        run: pnpm --filter @cubby/web test:calendar:postgres
      - name: Save web PostgreSQL coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-postgres
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-aux-coverage:
    name: Auxiliary package coverage
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - run: >-
          pnpm -r --no-sort --workspace-concurrency=2 --no-bail
          --filter '!@cubby/web' --if-present run test
          --maxWorkers=1 --reporter=default --reporter=github-actions --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-aux
          path: |
            apps/mcp-apps/coverage/coverage-final.json
            apps/upc-lookup/coverage/coverage-final.json
            apps/usda-api/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    name: E2E tests (${{ matrix.lane }})
    needs: scope
    if: |
      !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.verify == 'true' &&
      needs.scope.outputs.web == 'true' &&
      (needs.scope.outputs.full == 'true' || needs.scope.outputs.e2e == 'true') &&
      !(github.event_name == 'workflow_dispatch' && inputs.bypass_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: chromium
            browser: chromium
            test-script: test:e2e:ci:chromium
            expected-tests: 15
          - lane: webkit
            browser: webkit
            test-script: test:e2e:ci:webkit
            expected-tests: 7
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_VERSION: "1.62.1"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_E2E_DATABASE: postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Bound Ubuntu package mirror retries
        if: matrix.browser == 'webkit'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-cubby-ci >/dev/null
          sudo chown -R "$USER":"$(id -gn)" /var/cache/apt/archives
      - name: Cache Playwright system packages
        if: matrix.browser == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: playwright-system-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-webkit-v1
      - name: Install Playwright browser dependencies
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        run: pnpm --filter @cubby/web run test:e2e:install-deps -- ${{ matrix.browser }}
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- ${{ matrix.browser }}
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - uses: ./.github/actions/setup-web-env
      - name: Wait for the tested Cloudflare bundle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            for (;;) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              if (artifacts.some(({ name }) => name === "cf-build")) return;

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              const build = jobs.find(
                ({ name }) => name === "Tests - web (node)",
              );
              if (
                build?.status === "completed" &&
                build.conclusion !== "success"
              ) {
                core.setFailed(`Cloudflare build ended ${build.conclusion}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed("cf-build was not published within twenty minutes");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: recipebridge-wasm
          path: packages/wasm
      - name: Run Playwright tests
        run: pnpm --filter @cubby/web run ${{ matrix.test-script }}
      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.lane }}
          path: apps/web/playwright-report/
          retention-days: 1

  report-coverage:
    name: Report scheduled coverage
    needs: [scope, validation, test-rust, test-web, test-postgres, test-aux-coverage]
    if: needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Collect coverage report paths
        id: reports
        shell: bash
        run: |
          files="$(find coverage-reports -type f \
            \( -name lcov.info -o -name coverage-final.json \) \
            -print | sort | paste -sd, -)"
          [[ -n "$files" ]] || { echo "::error::No coverage reports were downloaded"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          flags: complete
          name: scheduled-coverage

  deploy-cf:
    name: Deploy tested Cloudflare artifact
    needs: [scope, validation, test-aux, test-rust, test-web, test-postgres, test-e2e]
    if: |
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name != 'schedule' &&
      inputs.mode != 'coverage' && needs.scope.outputs.web == 'true' &&
      (
        needs.scope.outputs.reuse == 'true' ||
        (
          needs.scope.outputs.full == 'true' &&
          needs.scope.outputs.verify == 'true' &&
          needs.scope.result == 'success' &&
          needs.validation.result == 'success' &&
          (needs.scope.outputs.aux != 'true' || needs.test-aux.result == 'success') &&
          (needs.scope.outputs.rust != 'true' || needs.test-rust.result == 'success') &&
          needs.test-web.result == 'success' &&
          needs.test-postgres.result == 'success' &&
          (
            needs.test-e2e.result == 'success' ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.bypass_e2e && needs.test-e2e.result == 'skipped'
            )
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-check whether this is still current main
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
          cache-pnpm-store: "false"
      - name: Download the verified Cloudflare bundle
        if: steps.current_main.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
          run-id: ${{ needs.scope.outputs.source-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Deploy web worker without rebuilding
        if: steps.current_main.outputs.current == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    needs: [scope, validation, test-aux]
    if: |
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' && github.event_name != 'schedule' &&
      inputs.mode != 'coverage' && needs.scope.outputs.workers != '[]' &&
      (
        needs.scope.outputs.reuse == 'true' ||
        (
          needs.scope.result == 'success' &&
          needs.validation.result == 'success' &&
          (needs.scope.outputs.aux != 'true' || needs.test-aux.result == 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.scope.outputs.workers) }}
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-check whether this is still current main
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
      - name: Deploy ${{ matrix.pkg }}
        if: steps.current_main.outputs.current == 'true'
        run: pnpm --filter @cubby/${{ matrix.pkg }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
