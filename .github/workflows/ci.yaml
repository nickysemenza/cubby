name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
  checks: write
  # https://github.com/dorny/test-reporter/issues/149
jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build recipebridge WASM
        run: npm run wasm
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: recipebridge/pkg

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - run: npm run format:check
        name: "check prettier formatting"
      - run: npm run check
        name: "lint and type check"

  test:
    name: Tests
    needs: [build-wasm]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [unit, e2e]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y29uY2lzZS1zaGVwaGVyZC00MS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - name: Setup environment variables
        run: |
          cp .env.example .env
          echo "NEXTAUTH_SECRET=supersecret" >> .env
      - name: Push schema to database
        run: npm run db:push
      
      # Unit/Integration Tests
      - name: Run unit and integration tests
        if: matrix.test-type == 'unit'
        run: |
          mkdir -p test-results
          npm test -- \
            --coverage \
            --reporter=default \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile.junit=test-results/vitest-junit.xml
      - name: Publish Vitest Results
        if: matrix.test-type == 'unit' && always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit/Integration Tests
          path: test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Upload coverage reports to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/recipehub

      # E2E Tests
      - name: Install Playwright Browsers
        if: matrix.test-type == 'e2e'
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        if: matrix.test-type == 'e2e'
        run: npx playwright test
      - name: Publish Playwright Results
        if: matrix.test-type == 'e2e' && always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v4
        if: matrix.test-type == 'e2e' && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
