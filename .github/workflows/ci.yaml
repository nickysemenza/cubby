name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  checks: write
  # dorny/paths-filter calls listFiles on the PR via the GitHub API
  pull-requests: read
  # https://github.com/dorny/test-reporter/issues/149
jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      aux-packages: ${{ steps.filter.outputs.aux-packages }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            aux-packages:
              - 'apps/usda-api/**'
              - 'apps/upc-lookup/**'
              - 'packages/schemas/**'
              - 'packages/usda-contract/**'
              - 'packages/usda-schemas/**'

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: wasm-cache
        name: Restore cached WASM pkg
        with:
          path: packages/wasm
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('recipebridge/Cargo.toml') }}-${{ hashFiles('recipebridge/Cargo.lock') }}-${{ hashFiles('recipebridge/src/**') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            wasm-pkg-${{ runner.os }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - name: Build recipebridge WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm wasm
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: packages/wasm

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: [build-wasm]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - run: pnpm run format:check
        name: "check formatting with Biome"
      - run: pnpm run check
        name: "lint and type check"
      - run: cd apps/web && npx knip --no-exit-code
        name: "check for unused code with knip"

  test-unit-web:
    name: Unit Tests - web
    needs: [build-wasm]
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      test-passed: ${{ steps.test.outcome == 'success' }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"

      - name: Setup web environment
        uses: ./.github/actions/setup-web-env

      - name: Enable pg_trgm extension
        run: psql -h localhost -U postgres -d cubby -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Push database schema
        run: pnpm --filter @cubby/web db:push

      - name: Create test results directory
        run: mkdir -p apps/web/test-results

      - name: Run tests for web
        id: test
        continue-on-error: true
        run: |
          cd apps/web
          pnpm test --run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests - web
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          working-directory: apps/web
          flags: web
          name: web-coverage

  test-unit-aux:
    name: Unit Tests - ${{ matrix.package.name }}
    if: needs.detect-changes.outputs.aux-packages == 'true'
    needs: [build-wasm, detect-changes]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        package:
          - name: schemas
            path: packages/schemas
          - name: usda-api
            path: apps/usda-api
          - name: usda-contract
            path: packages/usda-contract
          - name: usda-schemas
            path: packages/usda-schemas
          - name: upc-lookup
            path: apps/upc-lookup
    outputs:
      test-passed: ${{ steps.test.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "false"

      - name: Create test results directory
        run: mkdir -p ${{ matrix.package.path }}/test-results

      - name: Run tests for ${{ matrix.package.name }}
        id: test
        continue-on-error: true
        run: |
          cd ${{ matrix.package.path }}
          pnpm test --run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests - ${{ matrix.package.name }}
          path: ${{ matrix.package.path }}/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          working-directory: ${{ matrix.package.path }}
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-coverage

  test-e2e:
    name: E2E Tests
    if: github.event.pull_request.user.login != 'renovate[bot]'
    needs: [build-wasm]
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      test-passed: ${{ steps.e2e-test.outcome == 'success' }}
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Setup web environment
        uses: ./.github/actions/setup-web-env
      - name: Enable pg_trgm extension
        run: psql -h localhost -U postgres -d cubby -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: Push schema to database
        run: pnpm --filter @cubby/web db:push

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(cd apps/web && npx playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && npx playwright install chromium
      - name: Build web app for E2E
        run: pnpm --filter @cubby/web run build:cf
      - name: Run Playwright tests
        id: e2e-test
        run: cd apps/web && npx playwright test
      - name: Publish Playwright Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: apps/web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  check-tests:
    name: Check All Tests Passed
    needs: [test-unit-web, test-unit-aux, test-e2e]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      all-passed: ${{ steps.check.outputs.all-passed }}
    steps:
      - name: Check test results
        id: check
        run: |
          unit_web_result="${{ needs.test-unit-web.result }}"
          unit_aux_result="${{ needs.test-unit-aux.result }}"
          e2e_result="${{ needs.test-e2e.result }}"

          echo "Unit tests (web) result: $unit_web_result"
          echo "Unit tests (aux) result: $unit_aux_result"
          echo "E2E tests result: $e2e_result"

          # Skipped jobs are OK (aux skipped when those packages unchanged, e2e skipped on Renovate PRs)
          if [[ "$unit_web_result" == "success" && \
                ("$unit_aux_result" == "success" || "$unit_aux_result" == "skipped") && \
                ("$e2e_result" == "success" || "$e2e_result" == "skipped") ]]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
          fi

  # build:
  #   name: Build Application
  #   needs: [build-wasm, lint-format]
  #   runs-on: ubuntu-latest
  #   env:
  #     NODE_OPTIONS: "--max-old-space-size=4096"
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: ./.github/actions/setup-node-with-deps
  #       with:
  #         download-wasm: "true"
  #     - name: Build web app
  #       run: pnpm --filter @cubby/web build
  #       env:
  #         NODE_ENV: production

  build-cf:
    name: Build for Cloudflare Workers
    needs: [build-wasm, lint-format]
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Build for Cloudflare Workers
        run: pnpm --filter @cubby/web run build:cf
      - name: Upload CF build artifact
        uses: actions/upload-artifact@v6
        with:
          name: cf-build
          path: apps/web/dist
          retention-days: 1

