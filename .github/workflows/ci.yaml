name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Full verification or full instrumented coverage (neither deploys)"
        type: choice
        options: [verify, coverage]
        default: verify
      check_processes:
        description: "Internal validation process-cap benchmark"
        type: choice
        options: ["2", "4"]
        default: "2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.scope.outputs.coverage }}
      verify: ${{ steps.scope.outputs.verify }}
      apple: ${{ steps.apple.outputs.apple }}
    steps:
      - id: scope
        env:
          MODE: ${{ inputs.mode || 'verify' }}
        run: |
          if [[ "$MODE" == "coverage" ]]; then
            echo 'coverage=true' >> "$GITHUB_OUTPUT"
            echo 'verify=false' >> "$GITHUB_OUTPUT"
          else
            echo 'coverage=false' >> "$GITHUB_OUTPUT"
            echo 'verify=true' >> "$GITHUB_OUTPUT"
          fi

      # The Apple job is the slowest lane by far (macOS runners, xcodebuild),
      # so it alone is path-filtered: everything else always runs. On a push
      # or workflow_dispatch (no PR to diff against) it always runs too.
      - id: apple
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Prefix match for directories (a changed file anywhere under
          # them), exact match for individual files that affect the Apple
          # build outside apps/apple/ itself.
          pattern='^(apps/apple/|cubby-ffi/|recipebridge/|\.github/|rust-toolchain\.toml$|scripts/ensure-apple-ffi\.ts$|scripts/rust-fingerprint\.ts$|scripts/apple-check\.sh$|apps/web/src/lib/generated/http-openapi\.gen\.json$)'

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')"
            matched="$(printf '%s\n' "$files" | grep -E "$pattern" || true)"
            if [[ -n "$matched" ]]; then apple=true; else apple=false; fi
          else
            matched=""
            apple=true
          fi

          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          {
            echo "### Apple job scope"
            echo "apple=$apple ($EVENT_NAME)"
            if [[ -n "$matched" ]]; then
              echo
              echo "Matching changed files:"
              printf '%s\n' "$matched" | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: Validation
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: ${{ github.event_name == 'workflow_dispatch' && inputs.check_processes || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      # Validation rebuilds the package to verify generated WASM is current;
      # restoring its output alone does not provide the wasm-pack executable.
      - name: Install wasm-pack for validation
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: wasm-pack
      - name: Run repository validation
        shell: bash
        run: |
          pnpm check:all &
          pids=("$!")
          names=("complete repository validation")

          pnpm dedupe:check &
          pids+=("$!")
          names+=("dependency deduplication")

          result_code=0
          for index in "${!pids[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error::${names[$index]} failed"
              result_code=1
            fi
          done
          exit "$result_code"

  test-aux:
    name: Auxiliary tests and builds
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - name: Run auxiliary package tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
        run: |
          args=(-r --no-sort --workspace-concurrency=2 --no-bail --filter '!@cubby/web' --if-present run test --maxWorkers=1 --reporter=default --reporter=github-actions)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm "${args[@]}"
      - if: needs.scope.outputs.verify == 'true'
        run: pnpm --filter @cubby/usda-api run build
      - if: needs.scope.outputs.verify == 'true'
        run: pnpm --filter @cubby/upc-lookup run build
      - if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-aux
          path: |
            apps/mcp-apps/coverage/coverage-final.json
            apps/upc-lookup/coverage/coverage-final.json
            apps/usda-api/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-rust:
    name: Rust - recipebridge
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          components: ${{ needs.scope.outputs.coverage == 'true' && 'llvm-tools-preview' || '' }}
          cache-workspaces: "recipebridge -> target"
      - name: Install cargo-llvm-cov
        if: needs.scope.outputs.coverage == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      - if: needs.scope.outputs.coverage != 'true'
        run: cargo test --manifest-path recipebridge/Cargo.toml
      - if: needs.scope.outputs.coverage == 'true'
        run: cargo llvm-cov --manifest-path recipebridge/Cargo.toml --lcov --output-path recipebridge/lcov.info
      - if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-rust
          path: recipebridge/lcov.info
          if-no-files-found: error
          retention-days: 1

  test-web:
    name: Tests - web (${{ matrix.tier }})
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: node
            args: --project unit --project mcp-contract --project worker-safety
          - tier: ui
            args: --project ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
          web-env: "true"
      - name: Build web Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: pnpm --filter @cubby/web run build:cf
      - name: Save recipebridge WASM
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recipebridge-wasm
          path: packages/wasm
          if-no-files-found: error
          retention-days: 1
      - name: Save Cloudflare bundle
        if: matrix.tier == 'node' && needs.scope.outputs.verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cf-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Run ${{ matrix.tier }} tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          VITEST_PROJECT_ARGS: ${{ matrix.args }}
        run: |
          read -r -a selected <<< "$VITEST_PROJECT_ARGS"
          args=("${selected[@]}" --testTimeout=10000 --reporter=default --reporter=github-actions --reporter=./tooling/test-run-contract-reporter.ts)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Save web ${{ matrix.tier }} coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-${{ matrix.tier }}
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-postgres:
    name: PostgreSQL integration tests
    needs: scope
    if: needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web... @cubby/purchase-agent..."
          web-env: "true"
      - name: Build coupled workerd Workers
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          pnpm --filter @cubby/purchase-agent run build
          pnpm --filter @cubby/web run build:cf
      - name: Run PostgreSQL integration tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          CUBBY_TEST_INTEGRATION: "1"
        run: |
          args=(--project integration --reporter=default --reporter=github-actions --reporter=./tooling/test-run-contract-reporter.ts)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Save web PostgreSQL coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-postgres
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-e2e:
    name: E2E tests (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Public ubuntu-latest runners have 4 vCPU; chromium runs 2
          # Playwright workers, webkit stays at 1 (apps/web/tooling/e2e-workers.ts).
          - lane: chromium
            browser: chromium
            test-script: test:e2e:ci:chromium
            workers: 2
          - lane: webkit
            browser: webkit
            test-script: test:e2e:ci:webkit
            workers: 1
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_VERSION: "1.63.0"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_E2E_DATABASE: postgres
      CUBBY_E2E_WORKERS: ${{ matrix.workers }}
    # Deliberately duplicated from test-postgres above: GitHub Actions YAML
    # has no anchors and no reusable "services" construct that fits a
    # per-job block like this.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports: ["5432:5432"]
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports: ["5000:5000"]
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
          web-env: "true"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Bound Ubuntu package mirror retries
        if: matrix.browser == 'webkit'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i \
              's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "10";' \
            'Acquire::https::Timeout "10";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99-cubby-ci >/dev/null
          sudo chown -R "$USER":"$(id -gn)" /var/cache/apt/archives
      - name: Cache Playwright system packages
        if: matrix.browser == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: playwright-system-deps-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}-webkit-v1
      - name: Install Playwright browser dependencies
        if: matrix.browser == 'webkit'
        timeout-minutes: 5
        run: pnpm --filter @cubby/web run test:e2e:install-deps -- ${{ matrix.browser }}
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- ${{ matrix.browser }}
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
      - name: Wait for the tested Cloudflare bundle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            for (;;) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              if (artifacts.some(({ name }) => name === "cf-build")) return;

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              const build = jobs.find(
                ({ name }) => name === "Tests - web (node)",
              );
              if (
                build?.status === "completed" &&
                build.conclusion !== "success"
              ) {
                core.setFailed(`Cloudflare build ended ${build.conclusion}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed("cf-build was not published within twenty minutes");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: recipebridge-wasm
          path: packages/wasm
      - name: Run Playwright tests
        run: pnpm --filter @cubby/web run ${{ matrix.test-script }}
      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.lane }}
          path: apps/web/playwright-report/
          retention-days: 1

  test-apple:
    name: Apple checks
    needs: scope
    if: needs.scope.outputs.verify == 'true' && needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A hosted runner's first simulator boot took about six silent minutes
      # between the build and the first test; start it now so it overlaps the
      # FFI restore and the compile. apple-check.sh waits on bootstatus.
      - name: Boot the iOS Simulator in the background
        run: |
          udid="$(sh scripts/apple-sim-udid.sh)"
          xcrun simctl boot "$udid"
          echo "CUBBY_SIM_UDID=$udid" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        id: apple-tools
      - name: Run iOS app checks
        run: sh scripts/apple-check.sh ci
      # Saved here rather than by actions/cache's post step so a red test run
      # still keeps the generator build and SPM clones for the next attempt.
      # A concurrent job may have saved the same key first; that 409 is
      # harmless and must never fail the check.
      - name: Save OpenAPI generator cache
        if: always() && steps.apple-tools.outputs.openapi-generator-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.CUBBY_OPENAPI_GENERATOR_BIN_DIR }}
          key: ${{ steps.apple-tools.outputs.openapi-generator-cache-key }}
      - name: Save SPM clone cache
        if: always() && steps.apple-tools.outputs.spm-clones-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}
      - name: Save failed test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-xcresult
          path: apps/apple/DerivedData/Logs/Test/*.xcresult
          retention-days: 3

  report-coverage:
    name: Report scheduled coverage
    needs: [scope, validation, test-rust, test-web, test-postgres, test-aux]
    if: needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Collect coverage report paths
        id: reports
        shell: bash
        run: |
          files="$(find coverage-reports -type f \
            \( -name lcov.info -o -name coverage-final.json \) \
            -print | sort | paste -sd, -)"
          [[ -n "$files" ]] || { echo "::error::No coverage reports were downloaded"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          flags: complete
          name: scheduled-coverage
