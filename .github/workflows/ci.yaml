name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly starts every lane, catching what path filters and declared
    # toolchains miss; unchanged tasks still replay from the Nx cache.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: Bypass remote passes; reuse only results freshly produced on this runner
        type: boolean
        default: false
      fresh-tests:
        description: Execute Vitest, Playwright and Tester Army fresh; retain cached build prerequisites
        type: boolean
        default: false
      purchase-import:
        description: Run the informational purchase-import browser after required diagnostics succeed
        type: boolean
        default: false
      live-email:
        description: Run paid live Email evaluations after required diagnostics succeed
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  # PR updates supersede old results. Main must finish publishing reusable
  # caches. The default single pending slot retains only the newest waiting run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Establish the same warning policy before cache probes and compilation.
  CARGO_BUILD_WARNINGS: deny
  # Fresh diagnostics bypass only the remote cache. Each runner's initially
  # empty local cache retains fresh prerequisites for subsequent Nx calls.
  NX_SKIP_REMOTE_CACHE: ${{ inputs.fresh && 'true' || 'false' }}
  # Read by setup-node-with-deps, which connects Nx to the shared remote cache
  # only when the token is present (a fork PR receives none) and it responds.
  # The origin is public, not a secret: Actions withholds step outputs that
  # contain a secret, which would drop the hosted report links.
  NX_CACHE_URL: https://cubby-nx-cache.nicky.workers.dev
  NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}

# Every Linux lane starts on every run and replays unchanged tasks from the Nx
# cache. Only the Rust runner and the Apple lanes are path-filtered.
# `CI passed` is the one required check (docs/adr/0020-cache-routed-ci.md).
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      # Nightly and manual runs start every filtered lane.
      rust: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      apple: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.apple == 'true' }}
      purchase: ${{ inputs.purchase-import || steps.filter.outputs.purchase == 'true' }}
    steps:
      # A push diffs against its `before` commit with git; a pull request
      # lists its files through the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # The Apple filter names native sources and the files the Apple
          # tasks read directly, not the generator's web inputs: a PR that
          # changes only the generated Swift client (contracts, schemas) skips
          # the Apple lanes, and the nightly run catches what that misses.
          filters: |
            rust: &rust
              - 'recipebridge/**'
              - 'cookbook-wasm/**'
              - 'cubby-ffi/**'
              - 'Cargo.{toml,lock}'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '{.rustfmt,rustfmt,.clippy,clippy}.toml'
              - 'packages/shared/golden-vectors/**'
              - '.github/workflows/ci.yaml'
              # Nx configuration and ignore files change every task's key.
              - '{nx.json,.gitignore,.nxignore}'
            apple:
              - *rust
              - 'apps/apple/**'
              - '.xcode-version'
              - '.github/actions/setup-apple/**'
              - 'scripts/{ensure,rust-fingerprint,apple-ffi}.ts'
              - 'scripts/lib/**'
              # File inputs of appleCommon in apps/apple/project.json.
              - 'apps/web/tooling/{simulator-inventory-schema,mac-fixture-identity}.ts'
              - 'apps/web/generator/artifacts.ts'
              - 'packages/shared/src/apple-{client-version,app-identity}.ts'
            purchase:
              - 'apps/web/src/server/domains/purchase-import/**'
              - 'apps/web/src/features/purchase/**'
              - 'apps/web/tests/e2e/purchase-import*'
              - 'apps/web/tests/e2e/fixtures/purchases*'
              - 'apps/web/tooling/purchase-agent-*.ts'
              - 'apps/web/tests/e2e/harness-services/purchase-*.ts'
              - 'apps/web/src/server/mcp/purchase-agent-protocol.ts'
              - '.agents/skills/purchase-import/**'
              - 'packages/schemas/src/purchase*'

  validation:
    name: Validation and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      # Independent failures stay red but do not hide the remaining diagnostics.
      - name: Generated contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:generate --outputStyle=stream
      - name: Design tokens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:design-tokens --outputStyle=stream
      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:types --outputStyle=stream
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:lint --outputStyle=stream
      - name: Unused code and dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:knip --outputStyle=stream
      - name: Worker bindings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:bindings --outputStyle=stream
      - name: Swift formatting and state rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run apple:lint --outputStyle=stream
      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:format --outputStyle=stream
      - name: Check relative Markdown links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './**/*.mdx'

  # Each GitHub test shard owns fresh database services.
  lanes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Browser shards run alone: a companion check behind a shard
          # serializes the slowest lane's wall time.
          - name: E2E tests (desktop 1/4)
            browser: desktop-1
            run: CUBBY_E2E_SHARD=1/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 2/4)
            browser: desktop-2
            run: CUBBY_E2E_SHARD=2/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 3/4)
            browser: desktop-3
            run: CUBBY_E2E_SHARD=3/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 4/4)
            browser: desktop-4
            run: CUBBY_E2E_SHARD=4/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          # Every Vitest project is split by file; all blobs feed the report.
          - name: Vitest (1/4)
            vitest: "1"
            run: CUBBY_VITEST_SHARD=1/4 pnpm exec nx run @cubby/web:vitest-ci --outputStyle=stream
          - name: Vitest (2/4)
            vitest: "2"
            run: CUBBY_VITEST_SHARD=2/4 pnpm exec nx run @cubby/web:vitest-ci --outputStyle=stream
            db-check: true
          - name: Vitest (3/4)
            vitest: "3"
            run: CUBBY_VITEST_SHARD=3/4 pnpm exec nx run @cubby/web:vitest-ci --outputStyle=stream
          - name: Vitest (4/4)
            vitest: "4"
            run: CUBBY_VITEST_SHARD=4/4 pnpm exec nx run @cubby/web:vitest-ci --outputStyle=stream
    services: &test-databases
      postgres:
        image: docker.io/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: >-
            --set=jit=off --set=fsync=off
            --set=synchronous_commit=off --set=full_page_writes=off
        # Loopback only: 55432 is inside Linux's ephemeral port range, and on
        # all interfaces an outgoing connection's source port can hold it.
        ports:
          - 5432:5432
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s
          --health-retries 10 --health-start-period 3s
      # The pinned distroless image has no /bin/sh for Docker shell health
      # checks; its server retries PostgreSQL startup before serving requests.
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
        ports:
          - 5000:5000
    # Each job owns fresh services and one host marker namespace.
    env: &web-lane-env
      CUBBY_TEMPLATE_SERVICE_ID: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
      NODE_OPTIONS: "--max-old-space-size=4096"
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: Setup Chromium for required component-browser tests
        if: ${{ matrix.vitest }}
        uses: ./.github/actions/setup-playwright
      - name: Restore or build web app
        run: pnpm exec nx run @cubby/web:build-cf --outputStyle=stream
      - name: Run Vitest shard
        if: ${{ matrix.vitest }}
        env:
          NX_SKIP_REMOTE_CACHE: ${{ (inputs.fresh || inputs.fresh-tests) && 'true' || 'false' }}
        run: ${{ matrix.run }}
      - name: Upload Vitest blob and attachments
        if: ${{ !cancelled() && matrix.vitest }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ github.sha }}-${{ matrix.vitest }}
          path: |
            apps/web/.vitest/blob/**
            apps/web/.vitest/attachments/**
            apps/web/**/__screenshots__/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Run Playwright shard
        if: ${{ matrix.browser }}
        env:
          NX_SKIP_REMOTE_CACHE: ${{ (inputs.fresh || inputs.fresh-tests) && 'true' || 'false' }}
        uses: ./.github/actions/playwright
        with:
          command: ${{ matrix.run }}
          artifact: ${{ matrix.browser }}
      # Keeps its own result even after the shard's tests fail.
      - name: Database schema check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.db-check }}
        run: pnpm exec nx run @cubby/web:db-check --outputStyle=stream

  rust:
    name: Rust - recipebridge, cookbook-wasm and cubby-ffi
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          workspace-filter: cubby
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ". -> target"
          # Root workspace profiles are not part of rust-cache's member manifest hash.
          # Retire immutable empty entries saved when Nx replayed the Rust targets.
          prefix-key: rust-gate-v3
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: false
      # One crate at a time: they share the workspace target directory.
      - run: pnpm exec nx run-many -t rust --parallel=1 --outputStyle=stream

  # Native jobs use independent hosted VMs and compiler/artifact caches.
  # Workflow concurrency cancels superseded PRs; repository-wide lane queues
  # would serialize unrelated PRs even when macOS capacity is available.
  apple-host:
    name: Apple host tests
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.apple == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      # The restore and save steps must name the same paths.
      HOST_BUILD_CACHE_PATHS: |
        apps/apple/CubbyKit/.build/xcode/CompilationCache.noindex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Package clones come from the simulator job's shared clone cache.
      - id: apple
        uses: ./.github/actions/setup-apple
        with:
          ffi-targets: mac
          xcodegen: "false"
      # Build products are disposable; unchanged compiler inputs replay through
      # Xcode's compilation cache without forging checkout timestamps.
      - name: Restore cached host compilation
        id: host-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: xcode-host-v2-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}
          restore-keys: |
            xcode-host-v2-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            xcode-host-v2-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-
      - name: Run CubbyKit host tests
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      # Publish only successful builds: exact-key cache entries are immutable.
      - name: Save host compilation cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: ${{ steps.host-build.outputs.cache-primary-key }}
          cache-hit: ${{ steps.host-build.outputs.cache-hit }}
          matched-key: ${{ steps.host-build.outputs.cache-matched-key }}

  apple-simulator:
    name: Apple simulator build
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.apple == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcode's content-addressed compiler cache replays unchanged inputs
      # with ordinary checkout mtimes and filesystem identities.
      - uses: ./.github/actions/setup-apple
        id: apple
        with:
          ffi-targets: sim
          build-cache: "true"
      - name: Run iOS app checks
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream
      # A canceled compile must not permanently populate an exact cache key.
      - name: Save DerivedData cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.apple.outputs.cache-paths }}
          key: ${{ steps.apple.outputs.cache-key }}
          cache-hit: ${{ steps.apple.outputs.cache-hit }}
          matched-key: ${{ steps.apple.outputs.save-matched-key }}
      - name: Save SPM clone cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple.outputs.spm-clones-cache-key }}
          cache-hit: ${{ steps.apple.outputs.spm-clones-cache-hit }}
          matched-key: ${{ steps.apple.outputs.spm-clones-cache-matched-key }}

  # The required check rejects failures, cancellation, and unplanned skips.
  # Manual diagnostics never satisfy the PR merge check.
  ci-passed:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI diagnostics' || 'CI passed' }}
    needs: [plan, validation, lanes, rust, apple-host, apple-simulator]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            ${{ needs.plan.outputs.rust != 'true' && 'rust,' || '' }}
            ${{ needs.plan.outputs.apple != 'true' && 'apple-host,apple-simulator,' || '' }}

  # Informative: merges Vitest, Playwright and Tester Army shard evidence into
  # hosted HTML reports and a combined job summary. Outside `CI passed`, so
  # merging never delays or fails the gate.
  report:
    name: Test report
    needs: [validation, lanes, tester-army]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
      - name: Download Vitest blobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-${{ github.sha }}-*
          path: apps/web
          merge-multiple: true
      - name: Download Playwright blobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-blob-${{ github.sha }}-desktop-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - name: Download Tester Army shards
        if: needs.tester-army.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tester-army-${{ github.sha }}-*of3-attempt*
          path: apps/web/all-tester-army
      - name: Assemble Tester Army report
        if: needs.tester-army.result != 'skipped'
        continue-on-error: true
        working-directory: apps/web
        run: node tooling/ci-report/tester-army.ts all-tester-army 3
      # The merge loads the Vitest config only to match project names: the
      # generated-output/WASM bootstrap is unnecessary, and the integration
      # projects must be enabled for their blobs to resolve.
      # Each merge exits nonzero when the merged results contain failures,
      # after writing its reports; later steps still publish them.
      - name: Merge Vitest reports
        if: ${{ hashFiles('apps/web/.vitest/blob/*') != '' }}
        continue-on-error: true
        working-directory: apps/web
        env:
          CUBBY_VITEST_ENSURED: "1"
          CUBBY_TEST_INTEGRATION: "1"
        run: pnpm exec vitest --merge-reports --reporter=html --reporter=./tooling/ci-report/vitest-records-reporter.ts
      - name: Merge Playwright reports
        if: ${{ !cancelled() && hashFiles('apps/web/all-blob-reports/*') != '' }}
        continue-on-error: true
        working-directory: apps/web
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/results.json
        run: pnpm exec playwright merge-reports --reporter html,json ./all-blob-reports
      # The Nx cache Worker serves published reports publicly
      # (apps/nx-cache); the artifacts remain the fallback.
      - name: Publish merged Vitest report
        id: vitest-hosted
        if: ${{ !cancelled() && hashFiles('apps/web/.vitest/index.html') != '' }}
        continue-on-error: true
        working-directory: apps/web
        run: node tooling/ci-report/publish.ts vitest .vitest blob records.json
      - name: Publish merged Playwright report
        id: playwright-hosted
        if: ${{ !cancelled() && hashFiles('apps/web/playwright-report/index.html') != '' }}
        continue-on-error: true
        working-directory: apps/web
        run: node tooling/ci-report/publish.ts playwright playwright-report
      - name: Publish Tester Army report
        id: tester-army-hosted
        if: ${{ !cancelled() && hashFiles('apps/web/artifacts/tester-army-report/index.html') != '' }}
        continue-on-error: true
        working-directory: apps/web
        run: node tooling/ci-report/publish.ts tester-army artifacts/tester-army-report
      - name: Upload combined Tester Army report
        id: tester-army-report
        if: ${{ !cancelled() && hashFiles('apps/web/artifacts/tester-army-report/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-report-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/web/artifacts/tester-army-report/
          retention-days: 14
      - name: Upload merged Vitest report
        id: vitest-report
        if: ${{ !cancelled() && hashFiles('apps/web/.vitest/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-${{ github.sha }}
          path: |
            apps/web/.vitest/
            !apps/web/.vitest/blob/
          include-hidden-files: true
          retention-days: 14
      - name: Upload merged Playwright report
        id: playwright-report
        if: ${{ !cancelled() && hashFiles('apps/web/playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.sha }}
          path: apps/web/playwright-report/
          retention-days: 14
      - name: Write job summary
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CUBBY_TESTER_ARMY_EXPECTED: ${{ needs.tester-army.result != 'skipped' && 'true' || 'false' }}
          CUBBY_TESTER_ARMY_REPORT_URL: ${{ steps.tester-army-hosted.outputs.url || steps.tester-army-report.outputs.artifact-url }}
          CUBBY_VITEST_REPORT_URL: ${{ steps.vitest-hosted.outputs.url || steps.vitest-report.outputs.artifact-url }}
          CUBBY_PLAYWRIGHT_REPORT_URL: ${{ steps.playwright-hosted.outputs.url || steps.playwright-report.outputs.artifact-url }}
        run: node tooling/ci-report/summary.ts .vitest/records.json playwright-report/results.json artifacts/tester-army-report/records.json

  # Informative only, outside `CI passed` and allowed to fail: the purchase
  # agent driven through the browser against a scripted model and gateway,
  # and on dispatch the live Email decisions. Both wait for the gate.
  purchase-import:
    name: E2E tests (purchase import agent, optional)
    needs: [plan, ci-passed]
    if: needs.ci-passed.result == 'success' && needs.plan.outputs.purchase == 'true'
    concurrency:
      group: cubby-informational-ci
      cancel-in-progress: false
      queue: max
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: Restore or build web app
        run: pnpm exec nx run @cubby/web:build-cf --outputStyle=stream
      - name: Run Playwright purchase import tests
        uses: ./.github/actions/playwright
        with:
          command: pnpm exec nx run @cubby/web:e2e-purchase-import --outputStyle=stream
          artifact: purchase-import
          save-browser: "false"

  live-email:
    name: Live Email decisions (Jev and Clef, optional)
    needs: ci-passed
    if: needs.ci-passed.result == 'success' && inputs.live-email
    concurrency:
      group: cubby-informational-ci
      cancel-in-progress: false
      queue: max
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: MAIL_PROMPT_BASELINE_ONLY=1 pnpm --dir apps/web eval:mail-prompts
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  tester-army:
    name: Tester Army web journeys (optional ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check model credential availability
        id: credential
        env:
          TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN || secrets.AI_GATEWAY_API_KEY }}
        shell: bash
        run: |
          if [[ -n "$TESTER_ARMY_CF_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Tester Army is incomplete: no model credential is configured. No pass was established." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.credential.outputs.available == 'true'
        with:
          wasm: restore
      - uses: ./.github/actions/setup-playwright
        if: steps.credential.outputs.available == 'true'
      - name: Run outcome-focused web journeys
        if: steps.credential.outputs.available == 'true'
        env:
          TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN || secrets.AI_GATEWAY_API_KEY }}
          CUBBY_TESTER_ARMY_SHARD: ${{ matrix.shard }}/3
          TESTER_ARMY_FRESH: ${{ (inputs.fresh || inputs.fresh-tests) && '1' || '0' }}
        run: |
          if [[ "$TESTER_ARMY_FRESH" == "1" ]]; then
            pnpm exec nx run @cubby/web:tester-army --skip-nx-cache --outputStyle=stream
          else
            pnpm exec nx run @cubby/web:tester-army --outputStyle=stream
          fi
      - name: Publish journey summary
        if: always() && steps.credential.outputs.available == 'true'
        shell: bash
        run: |
          if [[ -f apps/web/artifacts/tester-army/summary.md ]]; then
            cat apps/web/artifacts/tester-army/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tester Army did not reach its runner. Check dependency, build and runtime setup logs; no pass was established." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload synthetic journey evidence
        if: always() && steps.credential.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tester-army-${{ github.sha }}-${{ matrix.shard }}of3-attempt${{ github.run_attempt }}
          path: apps/web/artifacts/tester-army/**
          if-no-files-found: warn
          retention-days: 7
