name: CI

on:
  push:
    branches: [main]
    paths-ignore: &inert_paths
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".vscode/**"
      - "cubby.code-workspace"
      - "LICENSE"
  pull_request:
    paths-ignore: *inert_paths
  schedule:
    - cron: "17 10 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run verification/deployment or the weekly coverage suite"
        type: choice
        options: [verify, coverage]
        default: verify
      force_full:
        description: "Ignore reusable PR results and run the full suite"
        type: boolean
        default: false
      bypass_e2e:
        description: "Deploy main despite a known-flaky E2E failure"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope work and resolve provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.scope.outputs.coverage }}
      verify: ${{ steps.scope.outputs.verify }}
      reuse: ${{ steps.scope.outputs.reuse }}
      source-run-id: ${{ steps.scope.outputs.source-run-id }}
      web: ${{ steps.scope.outputs.web }}
      rust: ${{ steps.scope.outputs.rust }}
      aux: ${{ steps.scope.outputs.aux }}
      usda: ${{ steps.scope.outputs.usda }}
      upc: ${{ steps.scope.outputs.upc }}
      workers: ${{ steps.scope.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Classify changes and find a reusable PR run
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DISPATCH_MODE: ${{ inputs.mode || 'verify' }}
          FORCE_FULL: ${{ inputs.force_full || false }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { classifyPaths } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-scope.ts`)
            );

            const coverage =
              context.eventName === "schedule" ||
              (context.eventName === "workflow_dispatch" &&
                process.env.DISPATCH_MODE === "coverage");

            let paths = [];
            if (!coverage && context.eventName === "pull_request") {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              paths = files.map(({ filename }) => filename);
            } else if (!coverage) {
              const before =
                context.eventName === "push"
                  ? context.payload.before
                  : `${context.sha}^`;
              const result = await exec.getExecOutput(
                "git",
                ["diff", "--name-only", before, context.sha],
                { silent: true },
              );
              paths = result.stdout.split("\n").filter(Boolean);
            }

            const classified = coverage
              ? {
                  inert: false,
                  web: true,
                  rust: true,
                  aux: true,
                  usda: false,
                  upc: false,
                  workers: [],
                  unknown: false,
                }
              : classifyPaths(paths);

            let reuse = false;
            let sourceRunId = "";
            const mayReuse =
              !coverage &&
              process.env.FORCE_FULL !== "true" &&
              context.ref === "refs/heads/main" &&
              ["push", "workflow_dispatch"].includes(context.eventName);

            if (mayReuse) {
              const associated = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { ...context.repo, commit_sha: context.sha, per_page: 100 },
              );
              const candidates = associated.filter(
                (pr) => pr.merged_at && pr.base.ref === "main",
              );

              if (candidates.length === 1) {
                const pr = candidates[0];
                const [mainCommit, headCommit] = await Promise.all([
                  github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: context.sha,
                  }),
                  github.rest.git.getCommit({
                    ...context.repo,
                    commit_sha: pr.head.sha,
                  }),
                ]);

                if (mainCommit.data.tree.sha === headCommit.data.tree.sha) {
                  const runs = await github.paginate(
                    github.rest.actions.listWorkflowRuns,
                    {
                      ...context.repo,
                      workflow_id: "ci.yaml",
                      event: "pull_request",
                      status: "completed",
                      per_page: 100,
                    },
                  );
                  const greenRuns = runs
                    .filter(
                      (run) =>
                        run.head_sha === pr.head.sha &&
                        run.conclusion === "success",
                    )
                    .sort((a, b) => b.run_number - a.run_number);

                  for (const run of greenRuns) {
                    if (classified.web) {
                      const artifacts = await github.paginate(
                        github.rest.actions.listWorkflowRunArtifacts,
                        { ...context.repo, run_id: run.id, per_page: 100 },
                      );
                      const build = artifacts.find(
                        (artifact) =>
                          artifact.name === "cf-build" && !artifact.expired,
                      );
                      if (!build) continue;
                    }
                    reuse = true;
                    sourceRunId = String(run.id);
                    break;
                  }
                }
              }
            }

            const verify = !coverage && !reuse;
            const outputs = {
              coverage,
              verify,
              reuse,
              "source-run-id": sourceRunId,
              web: classified.web,
              rust: classified.rust,
              aux: classified.aux,
              usda: classified.usda,
              upc: classified.upc,
              workers: JSON.stringify(classified.workers),
            };
            for (const [name, value] of Object.entries(outputs)) {
              core.setOutput(name, value);
            }

            await core.summary
              .addHeading("CI scope")
              .addTable([
                [
                  { data: "Mode", header: true },
                  { data: "Reuse", header: true },
                  { data: "Web", header: true },
                  { data: "Rust", header: true },
                  { data: "Aux", header: true },
                  { data: "Workers", header: true },
                ],
                [
                  coverage ? "coverage" : verify ? "verify" : "deploy-only",
                  reuse ? `run ${sourceRunId}` : "no",
                  String(classified.web),
                  String(classified.rust),
                  String(classified.aux),
                  classified.workers.join(", ") || "none",
                ],
              ])
              .write();

  test-rust:
    name: Rust - recipebridge
    needs: scope
    if: |
      (needs.scope.outputs.verify == 'true' && needs.scope.outputs.rust == 'true') ||
      needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          components: ${{ needs.scope.outputs.coverage == 'true' && 'llvm-tools-preview' || '' }}
          cache-workspaces: "recipebridge -> target"
      - name: Install cargo-llvm-cov
        if: needs.scope.outputs.coverage == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: cargo-llvm-cov
      - name: Format check
        run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      - name: Test
        if: needs.scope.outputs.coverage != 'true'
        run: cargo test --manifest-path recipebridge/Cargo.toml
      - name: Test with coverage
        if: needs.scope.outputs.coverage == 'true'
        run: cargo llvm-cov --manifest-path recipebridge/Cargo.toml --lcov --output-path recipebridge/lcov.info
      - name: Save Rust coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-rust
          path: recipebridge/lcov.info
          if-no-files-found: error
          retention-days: 1

  lint-format:
    name: Lint and Format
    needs: scope
    if: needs.scope.outputs.verify == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      - name: Run repository quality gates
        run: pnpm run check
      - name: Run auxiliary package tests
        if: needs.scope.outputs.aux == 'true'
        shell: bash
        run: |
          pnpm -r --no-sort --workspace-concurrency=4 --no-bail \
            --filter '!@cubby/web' --if-present run test \
            --maxWorkers=1 --reporter=default --reporter=github-actions
      - name: Build changed auxiliary workers
        if: needs.scope.outputs.aux == 'true'
        shell: bash
        run: |
          if [[ "${{ needs.scope.outputs.usda }}" == "true" ]]; then
            pnpm --filter @cubby/usda-api run build
          fi
          if [[ "${{ needs.scope.outputs.upc }}" == "true" ]]; then
            pnpm --filter @cubby/upc-lookup run build
          fi

  test-unit-web:
    name: Tests - web (${{ matrix.tier }})
    needs: scope
    if: |
      needs.scope.outputs.web == 'true' &&
      (needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: unit-1
            args: --project unit --shard=1/2
          - tier: unit-2
            args: --project unit --shard=2/2
          - tier: ui-1
            args: --project ui --shard=1/4
          - tier: ui-2
            args: --project ui --shard=2/4
          - tier: ui-3
            args: --project ui --shard=3/4
          - tier: ui-4
            args: --project ui --shard=4/4
          - tier: pure-pglite
            args: --project unit-pure --project pglite
          - tier: mcp-contract
            args: --project mcp-contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      - uses: ./.github/actions/setup-web-env
      - name: Build MCP App contract fixture
        if: matrix.tier == 'mcp-contract'
        run: node scripts/ensure-mcp-apps.ts
      - name: Run ${{ matrix.tier }} tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
          VITEST_PROJECT_ARGS: ${{ matrix.args }}
        run: |
          read -r -a selected <<< "$VITEST_PROJECT_ARGS"
          args=(
            "${selected[@]}"
            --reporter=default
            --reporter=github-actions
          )
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web exec vitest run "${args[@]}"
      - name: Save web ${{ matrix.tier }} coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-${{ matrix.tier }}
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-integration-web:
    name: Integration Tests - web (shard ${{ matrix.shard }})
    needs: scope
    if: |
      needs.scope.outputs.web == 'true' &&
      (needs.scope.outputs.verify == 'true' || needs.scope.outputs.coverage == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      - uses: ./.github/actions/setup-web-env
      - name: Run integration tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
        run: |
          args=(
            --project integration
            --shard=${{ matrix.shard }}/${{ strategy.job-total }}
            --reporter=default
            --reporter=github-actions
          )
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm --dir apps/web test "${args[@]}"
      - name: Save web integration coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-integration-${{ matrix.shard }}
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  test-unit-aux:
    name: Test auxiliary packages
    needs: scope
    if: needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
      - name: Run package tests
        shell: bash
        env:
          COVERAGE: ${{ needs.scope.outputs.coverage }}
        run: |
          args=(--maxWorkers=1 --reporter=default --reporter=github-actions)
          if [[ "$COVERAGE" == "true" ]]; then args+=(--coverage); fi
          pnpm -r --no-sort --workspace-concurrency=4 --no-bail \
            --filter '!@cubby/web' --if-present run test "${args[@]}"
      - name: Build USDA worker
        if: needs.scope.outputs.coverage != 'true' && needs.scope.outputs.usda == 'true'
        run: pnpm --filter @cubby/usda-api run build
      - name: Build UPC worker
        if: needs.scope.outputs.coverage != 'true' && needs.scope.outputs.upc == 'true'
        run: pnpm --filter @cubby/upc-lookup run build
      - name: Save auxiliary coverage
        if: needs.scope.outputs.coverage == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-aux
          path: |
            apps/mcp-apps/coverage/coverage-final.json
            apps/upc-lookup/coverage/coverage-final.json
            apps/usda-api/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  build-cf:
    name: Build for Cloudflare Workers
    needs: scope
    if: needs.scope.outputs.verify == 'true' && needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
      - name: Build web Cloudflare bundle
        run: pnpm --filter @cubby/web run build:cf
      - name: Upload tested Cloudflare bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cf-build
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Trigger preview deploy
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run preview-cf.yaml --ref main \
            -f pr_number="${{ github.event.pull_request.number }}" \
            -f head_sha="${{ github.event.pull_request.head.sha }}" \
            -f run_id="${{ github.run_id }}" ||
            echo "::warning::Could not dispatch the preview deploy; CI is unaffected."

  test-e2e:
    name: E2E Tests (shard ${{ matrix.shard }})
    needs: scope
    if: |
      needs.scope.outputs.verify == 'true' &&
      needs.scope.outputs.web == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.bypass_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      PLAYWRIGHT_IMAGE_VERSION: "1.62.1"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      INTEGRESQL_URL: http://integresql:5000
      INTEGRESQL_DATABASE_HOST: postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 3s
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
          cache-pnpm-store: "false"
      - name: Assert Playwright package matches the container
        shell: bash
        run: |
          actual="$(pnpm --filter @cubby/web exec playwright --version | awk '{print $2}')"
          if [[ "$actual" != "$PLAYWRIGHT_IMAGE_VERSION" ]]; then
            echo "::error::@playwright/test is $actual; update the CI container and PLAYWRIGHT_IMAGE_VERSION together"
            exit 1
          fi
      - uses: ./.github/actions/setup-web-env
      - name: Wait for the shared Cloudflare bundle
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const deadline = Date.now() + 5 * 60 * 1000;
            for (;;) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              if (artifacts.some((artifact) => artifact.name === "cf-build")) {
                return;
              }

              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { ...context.repo, run_id: context.runId, per_page: 100 },
              );
              const build = jobs.find(
                (job) => job.name === "Build for Cloudflare Workers",
              );
              if (
                build?.status === "completed" &&
                build.conclusion !== "success"
              ) {
                core.setFailed(`Cloudflare build ended ${build.conclusion}`);
                return;
              }
              if (Date.now() >= deadline) {
                core.setFailed("cf-build was not published within five minutes");
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
      - name: Download shared Cloudflare bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
      - name: Run Playwright tests
        shell: bash
        run: pnpm --filter @cubby/web run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 1
      - name: Save Wrangler crash logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wrangler-logs-shard-${{ matrix.shard }}
          path: /github/home/.config/.wrangler/logs/
          if-no-files-found: ignore
          retention-days: 1

  report-coverage:
    name: Report scheduled coverage
    needs: [scope, test-rust, test-unit-web, test-integration-web, test-unit-aux]
    if: needs.scope.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Collect coverage report paths
        id: reports
        shell: bash
        run: |
          files="$(find coverage-reports -type f \
            \( -name lcov.info -o -name coverage-final.json \) \
            -print | sort | paste -sd, -)"
          if [[ -z "$files" ]]; then
            echo "::error::No coverage reports were downloaded"
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Upload complete coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          flags: complete
          name: scheduled-coverage

  deploy-cf:
    name: Deploy to Cloudflare Workers
    needs:
      [
        scope,
        lint-format,
        build-cf,
        test-rust,
        test-unit-web,
        test-integration-web,
        test-e2e,
      ]
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' &&
      inputs.mode != 'coverage' &&
      needs.scope.outputs.web == 'true' &&
      (
        needs.scope.outputs.reuse == 'true' ||
        (
          needs.scope.outputs.verify == 'true' &&
          needs.lint-format.result == 'success' &&
          needs.build-cf.result == 'success' &&
          (needs.scope.outputs.rust != 'true' || needs.test-rust.result == 'success') &&
          needs.test-unit-web.result == 'success' &&
          needs.test-integration-web.result == 'success' &&
          (needs.test-e2e.result == 'success' || needs.test-e2e.result == 'skipped')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-check whether this is still current main
        id: current_main
        uses: ./.github/actions/check-current-main
      - name: Download proven Cloudflare bundle
        if: steps.current_main.outputs.current == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cf-build
          path: apps/web/dist
          run-id: ${{ needs.scope.outputs.reuse == 'true' && needs.scope.outputs.source-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned Wrangler
        if: steps.current_main.outputs.current == 'true'
        run: |
          version=$(node -p "require('./apps/web/package.json').devDependencies.wrangler.replace(/^[^0-9]*/, '')")
          npm install -g "wrangler@${version}"
      - name: Deploy web worker
        if: steps.current_main.outputs.current == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    needs: [scope, lint-format]
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'schedule' &&
      inputs.mode != 'coverage' &&
      needs.scope.outputs.workers != '[]' &&
      (
        needs.scope.outputs.reuse == 'true' ||
        (
          needs.scope.outputs.verify == 'true' &&
          needs.lint-format.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.scope.outputs.workers) }}
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-check whether this is still current main
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
      - name: Deploy ${{ matrix.pkg }}
        if: steps.current_main.outputs.current == 'true'
        run: pnpm --filter @cubby/${{ matrix.pkg }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
