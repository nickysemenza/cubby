name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly live Tester Army import journeys (the coupled harness); never a merge gate.
    - cron: "17 9 * * 1"
    # Nightly backstop: every lane uncached, so a pass reused from another
    # platform or toolchain is rechecked on CI's (docs/adr/0009-content-hash-merge-gate.md).
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      simulator_e2e:
        description: Run the disposable-database iPhone simulator E2E lane
        type: boolean
        default: false
      simulator_journey:
        description: Journey for the manual iPhone simulator lane
        type: choice
        options: [search, inputs]
        default: search
      tester_army:
        description: Run the experimental synthetic Tester Army journeys
        type: choice
        options: [none, web, ios, both, import]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.simulator_e2e }}-${{ inputs.simulator_journey }}-${{ inputs.tester_army }}
  # PR updates supersede old results. Main must finish publishing reusable
  # caches. The default single pending slot retains only the newest waiting run.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

# Read by setup-node-with-deps, which connects Nx to the shared remote cache
# only when both are present (a fork PR receives neither).
env:
  NX_CACHE_URL: ${{ secrets.NX_CACHE_URL }}
  NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}

# Every required lane runs its Nx targets unconditionally. Each target's
# inputs (nx.json `gate`) decide whether a pass for the same content already
# exists in the shared cache; a hit replays it in seconds (docs/ci.md).
jobs:
  # A stable required check that also keeps live entity codes out of PR text.
  scope:
    name: Scope
    if: &verification github.event_name == 'pull_request' || github.event_name == 'push' || github.event.schedule == '23 8 * * *' || (github.event_name == 'workflow_dispatch' && !inputs.simulator_e2e && inputs.tester_army == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: |
            .nvmrc
            scripts/check-outward-text.ts
            packages/shared/src/shortcode-alphabet.ts
            packages/schemas/src/entity-definitions
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: github.event_name == 'pull_request'
        with:
          node-version-file: .nvmrc
      # The commit-msg hook gates commit messages; the PR title and body are
      # the other outward text AGENTS.md keeps free of live entity codes.
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin

  validation:
    name: Validation
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm check:all
      # Both read the live registry or advisory database, so neither caches.
      - run: pnpm dedupe:check
      - name: Check relative Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './**/*.mdx'

  # Fast web Vitest projects and every auxiliary package's tests.
  test-aux:
    name: Auxiliary tests and builds
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm exec nx run-many -t test --exclude=cubby-checks --outputStyle=static-failures-only ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}

  test-rust:
    name: Rust - recipebridge and cubby-ffi
    if: *verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          cache-workspaces: ". -> target"
      # One crate at a time: both share the workspace target directory.
      - run: pnpm exec nx run-many -t rust --parallel=1 --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}

  # Migration drift and the workerd PostgreSQL files, which build the Worker
  # themselves; ordinary integration files run in test-postgres.
  build-worker:
    name: Build Workers and runtime tests
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services: &test-databases
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: >-
            --set=jit=off --set=fsync=off
            --set=synchronous_commit=off --set=full_page_writes=off
        ports:
          - 5432:5432
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s
          --health-retries 10 --health-start-period 3s
      # The pinned distroless image has no /bin/sh for Docker shell health
      # checks; its server retries PostgreSQL startup before serving requests.
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
        ports:
          - 5000:5000
    env:
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm exec nx run-many -p @cubby/web -t db-check workerd-tests --parallel=1 --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}

  test-postgres:
    name: PostgreSQL integration tests (${{ matrix.shard }})
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    services: *test-databases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm exec nx run @cubby/web:postgres --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}
        env:
          CUBBY_POSTGRES_SHARD: ${{ matrix.shard }}

  test-e2e:
    name: E2E tests (desktop ${{ matrix.shard }})
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two Playwright workers per standard runner; the stable aggregate
        # owns the required status.
        include:
          - { shard: "1/4", slug: desktop-1 }
          - { shard: "2/4", slug: desktop-2 }
          - { shard: "3/4", slug: desktop-3 }
          - { shard: "4/4", slug: desktop-4 }
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    services: *test-databases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: Resolve installed Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- chromium
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Run Playwright tests
        run: pnpm exec nx run @cubby/web:e2e --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}
        env:
          CUBBY_E2E_SHARD: ${{ matrix.shard }}
      - name: Save Playwright run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-run-${{ matrix.slug }}
          path: |
            apps/web/playwright-report/run-manifest.json
            apps/web/playwright-report/run-results.json
            apps/web/playwright-report/SHA256SUMS
            apps/web/playwright-report/workerd-logs
          if-no-files-found: error
          retention-days: 7

  # Informative only: the purchase agent driven through the browser against a
  # scripted model and gateway. It is deliberately absent from `web-checks`
  # and branch protection, so a failure never blocks a merge. Its Nx key is
  # the agent's own surface, so an unrelated change replays the last result.
  test-e2e-purchase-import:
    name: E2E tests (purchase import agent, optional)
    if: *verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    services: *test-databases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: Resolve installed Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- chromium
      - name: Run purchase import browser E2E
        run: pnpm exec nx run @cubby/web:e2e-purchase-import --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}
      - name: Save Playwright run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-run-purchase-import
          path: |
            apps/web/playwright-report/run-manifest.json
            apps/web/playwright-report/run-results.json
            apps/web/playwright-report/SHA256SUMS
            apps/web/playwright-report/workerd-logs
          if-no-files-found: error
          retention-days: 7

  # The stable required check over the web matrix lanes.
  web-checks:
    name: Web checks
    needs: [build-worker, test-aux, test-postgres, test-e2e]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || (!inputs.simulator_e2e && inputs.tester_army == 'none')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every web lane to pass
        env:
          BUILD_RESULT: ${{ needs.build-worker.result }}
          WEB_RESULT: ${{ needs.test-aux.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$WEB_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$E2E_RESULT" = success

  # The two halves of `apple:check` run on parallel macOS runners. A PR first
  # asks Nx only for a cached pass of the same input hash (from CI or a
  # developer's Mac): CUBBY_NX_CACHE_PROBE makes a miss fail before any build,
  # and Nx never caches that failure. Only a miss pays for the native setup.
  # `main` skips the cache and always rebuilds as the backstop.
  test-apple-host:
    name: Apple host tests
    if: *verification
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/setup-node-with-deps
      - name: Reuse a cached pass
        id: cached
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          CUBBY_NX_CACHE_PROBE: "1"
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      - uses: ./.github/actions/setup-apple-ffi
        if: steps.cached.outcome != 'success'
        with:
          targets: mac
      # Build products are disposable; unchanged compiler inputs replay through
      # Xcode's compilation cache without forging checkout timestamps. Keep
      # SwiftPM's warning-generator products.
      - name: Compute host Xcode toolchain hash
        if: steps.cached.outcome != 'success'
        id: host-xcode-version
        uses: ./.github/actions/toolchain-hash
        with:
          command: xcodebuild -version
      - name: Restore cached host compilation
        if: steps.cached.outcome != 'success'
        id: host-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            apps/apple/CubbyKit/.build/*
            !apps/apple/CubbyKit/.build/xcode
            apps/apple/CubbyKit/.build/xcode/CompilationCache.noindex
            apps/apple/CubbyKit/.build/xcode/SourcePackages
          key: xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}-${{ hashFiles('apps/apple/scripts/check-openapi-warnings.sh') }}
          restore-keys: |
            xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            xcode-host-v1-${{ runner.os }}-${{ steps.host-xcode-version.outputs.hash }}-
      - name: Run CubbyKit host tests
        if: steps.cached.outcome != 'success'
        run: pnpm exec nx run apple:host-tests --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}
      # Publish only successful builds: exact-key cache entries are immutable.
      - name: Save host compilation cache
        if: steps.cached.outcome != 'success'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: |
            apps/apple/CubbyKit/.build/*
            !apps/apple/CubbyKit/.build/xcode
            apps/apple/CubbyKit/.build/xcode/CompilationCache.noindex
            apps/apple/CubbyKit/.build/xcode/SourcePackages
          key: ${{ steps.host-build.outputs.cache-primary-key }}
          cache-hit: ${{ steps.host-build.outputs.cache-hit }}
          matched-key: ${{ steps.host-build.outputs.cache-matched-key }}

  test-apple-simulator:
    name: Apple simulator build
    if: *verification
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/select-xcode
      - uses: ./.github/actions/setup-node-with-deps
      - name: Reuse a cached pass
        id: cached
        if: github.event_name != 'schedule'
        continue-on-error: true
        env:
          CUBBY_NX_CACHE_PROBE: "1"
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream
      - uses: ./.github/actions/setup-apple-ffi
        if: steps.cached.outcome != 'success'
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        if: steps.cached.outcome != 'success'
        id: apple-tools
      # Xcode's content-addressed compiler cache replays unchanged inputs
      # with ordinary checkout mtimes and filesystem identities.
      - uses: ./.github/actions/setup-apple-build-cache
        if: steps.cached.outcome != 'success'
        id: derived-data
      - name: Run iOS app checks
        if: steps.cached.outcome != 'success'
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream ${{ github.event_name == 'schedule' && '--skip-nx-cache' || '' }}
      # A canceled compile must not permanently populate an exact cache key.
      - name: Save DerivedData cache
        if: steps.cached.outcome != 'success'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.derived-data.outputs.cache-paths }}
          key: ${{ steps.derived-data.outputs.cache-key }}
          cache-hit: ${{ steps.derived-data.outputs.cache-hit }}
          matched-key: ${{ steps.derived-data.outputs.save-matched-key }}
      - name: Save SPM clone cache
        if: steps.cached.outcome != 'success'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}
          cache-hit: ${{ steps.apple-tools.outputs.spm-clones-cache-hit }}
          matched-key: ${{ steps.apple-tools.outputs.spm-clones-cache-matched-key }}

  # Keep the required context stable and fail if either Apple job fails, is
  # canceled, or is unexpectedly skipped.
  test-apple:
    name: Apple checks
    needs: [test-apple-host, test-apple-simulator]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || (!inputs.simulator_e2e && inputs.tester_army == 'none')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require both Apple jobs
        env:
          HOST_RESULT: ${{ needs.test-apple-host.result }}
          SIMULATOR_RESULT: ${{ needs.test-apple-simulator.result }}
        run: |
          if [[ "$HOST_RESULT" != success || "$SIMULATOR_RESULT" != success ]]; then
            echo "::error::Apple host tests: $HOST_RESULT; Apple simulator build: $SIMULATOR_RESULT"
            exit 1
          fi

  simulator-e2e:
    name: iPhone simulator E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.simulator_e2e && inputs.tester_army == 'none'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
          pnpm-store-cache: "false"
      - uses: ./.github/actions/reuse-worker-build
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        with:
          restore-spm-clones: "false"
      - uses: ./.github/actions/setup-apple-build-cache
        id: derived-data
      - uses: ./.github/actions/setup-apple-test-runner-cache
        id: test-runner
        with:
          toolchain-hash: ${{ steps.derived-data.outputs.toolchain-hash }}
      - name: Start native PostgreSQL 17 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@17 pgvector
          pg_bin="$(brew --prefix postgresql@17)/bin"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/cubby-sim-pg" -A trust -U postgres
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/cubby-sim-pg" -l "$RUNNER_TEMP/cubby-sim-pg.log" -o '-h 127.0.0.1 -p 55432' start
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD 'password'"
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -Atc "SELECT name FROM pg_available_extensions WHERE name = 'vector'" | grep -qx vector
      - name: Run native read and write against a disposable database
        env:
          CUBBY_SIM_DB_EXTERNAL: "1"
          CI: "1"
          SIMULATOR_JOURNEY: ${{ inputs.simulator_journey }}
        run: |
          if [[ "$SIMULATOR_JOURNEY" == "inputs" ]]; then
            pnpm test:e2e:sim -- --input-journey
          else
            pnpm test:e2e:sim -- --extended-journey
          fi
      - name: Save Apple test runner cache
        uses: ./.github/actions/save-apple-test-runner-cache
        with:
          path: ${{ steps.test-runner.outputs.cache-paths }}
          key: ${{ steps.test-runner.outputs.cache-key }}
          cache-hit: ${{ steps.test-runner.outputs.cache-hit }}
          matched-key: ${{ steps.test-runner.outputs.matched-key }}
      - name: Save DerivedData cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.derived-data.outputs.cache-paths }}
          key: ${{ steps.derived-data.outputs.cache-key }}
          cache-hit: ${{ steps.derived-data.outputs.cache-hit }}
          matched-key: ${{ steps.derived-data.outputs.save-matched-key }}
      - name: Collect verified simulator E2E evidence
        if: always()
        shell: python
        run: |
          import hashlib
          import pathlib
          import shutil

          for checksums in pathlib.Path("artifacts").glob("sim*-e2e/*/SHA256SUMS"):
              source = checksums.parent
              target = pathlib.Path("artifacts/sealed-simulator-e2e") / source.name
              target.mkdir(parents=True, exist_ok=True)
              for line in checksums.read_text().splitlines():
                  digest, name = line.split("  ", 1)
                  file = source / name
                  if not file.resolve().is_relative_to(source.resolve()):
                      raise ValueError("Sealed evidence escapes its run directory")
                  if hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                      raise ValueError(f"Sealed evidence checksum mismatch: {name}")
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, destination)
              shutil.copyfile(checksums, target / checksums.name)
      - name: Save simulator E2E run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulator-e2e-run
          if-no-files-found: error
          retention-days: 7
          path: artifacts/sealed-simulator-e2e

  tester-army-inputs:
    name: Tester Army dispatch inputs
    if: github.event.schedule == '17 9 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.tester_army != 'none')
    runs-on: ubuntu-latest
    # Inputs are empty on `schedule`, which runs the import lane.
    outputs:
      lane: ${{ github.event_name == 'schedule' && 'import' || inputs.tester_army }}
    steps:
      - name: Reject conflicting manual lanes
        env:
          SIMULATOR_E2E: ${{ inputs.simulator_e2e }}
        run: test "$SIMULATOR_E2E" != true

  tester-army-web:
    name: Tester Army web (manual)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'web' || needs.tester-army-inputs.outputs.lane == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      E2E_TELEMETRY_DISABLED: "1"
    services: *test-databases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/reuse-worker-build
      - run: pnpm --filter @cubby/web run test:e2e:install-browser chromium --with-deps
      - run: pnpm test:e2e:agent:web -- --harness standard
      - name: Save sanitized web run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-army-web-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/tester-army/web/*/run-manifest.json
            artifacts/tester-army/web/*/run-results.json
            artifacts/tester-army/web/*/agent-summary.json
            artifacts/tester-army/web/*/SHA256SUMS

  tester-army-import:
    name: Tester Army import journeys (manual or weekly, live models)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'import'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      TESTER_ARMY_AGENT_MODEL: ${{ vars.TESTER_ARMY_AGENT_MODEL }}
      TESTER_ARMY_AGENT_EFFORT: ${{ vars.TESTER_ARMY_AGENT_EFFORT }}
      E2E_TELEMETRY_DISABLED: "1"
    services: *test-databases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/reuse-worker-build
      - run: pnpm --filter @cubby/web run test:e2e:install-browser chromium --with-deps
      - run: pnpm test:e2e:agent:web -- --harness coupled
      - name: Save sanitized import run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-army-import-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/tester-army/web/*/run-manifest.json
            artifacts/tester-army/web/*/run-results.json
            artifacts/tester-army/web/*/agent-summary.json
            artifacts/tester-army/web/*/gateway-usage.json
            artifacts/tester-army/web/*/SHA256SUMS

  tester-army-ios:
    name: Tester Army iOS (manual)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'ios' || needs.tester-army-inputs.outputs.lane == 'both'
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      E2E_TELEMETRY_DISABLED: "1"
      CUBBY_SIM_DB_EXTERNAL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
          pnpm-store-cache: "false"
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/reuse-worker-build
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        with:
          restore-spm-clones: "false"
      - uses: ./.github/actions/setup-apple-build-cache
        id: derived-data
      - uses: ./.github/actions/setup-apple-test-runner-cache
        id: test-runner
        with:
          toolchain-hash: ${{ steps.derived-data.outputs.toolchain-hash }}
      - name: Start native PostgreSQL 17 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@17 pgvector
          pg_bin="$(brew --prefix postgresql@17)/bin"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/cubby-sim-pg" -A trust -U postgres
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/cubby-sim-pg" -l "$RUNNER_TEMP/cubby-sim-pg.log" -o '-h 127.0.0.1 -p 55432' start
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD 'password'"
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -Atc "SELECT name FROM pg_available_extensions WHERE name = 'vector'" | grep -qx vector
      - run: pnpm test:e2e:agent:ios
      - name: Save Apple test runner cache
        uses: ./.github/actions/save-apple-test-runner-cache
        with:
          path: ${{ steps.test-runner.outputs.cache-paths }}
          key: ${{ steps.test-runner.outputs.cache-key }}
          cache-hit: ${{ steps.test-runner.outputs.cache-hit }}
          matched-key: ${{ steps.test-runner.outputs.matched-key }}
      - name: Save DerivedData cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.derived-data.outputs.cache-paths }}
          key: ${{ steps.derived-data.outputs.cache-key }}
          cache-hit: ${{ steps.derived-data.outputs.cache-hit }}
          matched-key: ${{ steps.derived-data.outputs.save-matched-key }}
      - name: Save sanitized iOS run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-army-ios-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/sim-tester-army-e2e/*/run-manifest.json
            artifacts/sim-tester-army-e2e/*/run-results.json
            artifacts/sim-tester-army-e2e/*/agent-summary.json
            artifacts/sim-tester-army-e2e/*/native-driver-diagnostics.json
            artifacts/sim-tester-army-e2e/*/SHA256SUMS
