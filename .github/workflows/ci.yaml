name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly starts every lane, catching what path filters and declared
    # toolchains miss; unchanged tasks still replay from the Nx cache.
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: Bypass remote passes; reuse only results freshly produced on this runner
        type: boolean
        default: false
      purchase-import:
        description: Run the informational purchase-import browser after required diagnostics succeed
        type: boolean
        default: false
      live-email:
        description: Run paid live Email evaluations after required diagnostics succeed
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  # PR updates supersede old results. Main must finish publishing reusable
  # caches. The default single pending slot retains only the newest waiting run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Establish the same warning policy before cache probes and compilation.
  CARGO_BUILD_WARNINGS: deny
  # Fresh diagnostics bypass only the remote cache. Each runner's initially
  # empty local cache retains fresh prerequisites for subsequent Nx calls.
  NX_SKIP_REMOTE_CACHE: ${{ inputs.fresh && 'true' || 'false' }}
  # Read by setup-node-with-deps, which connects Nx to the shared remote cache
  # only when both are present (a fork PR receives neither) and it responds.
  NX_CACHE_URL: ${{ secrets.NX_CACHE_URL }}
  NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}

# Every Linux lane starts on every run and replays unchanged tasks from the Nx
# cache. Only the Rust runner and the Apple lanes are path-filtered; a Linux
# probe then keeps a cached Apple pass off macOS. `CI passed` is the one
# required check (docs/adr/0020-cache-routed-ci.md).
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      # Nightly and manual runs start every filtered lane.
      rust: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      apple: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.apple == 'true' }}
      purchase: ${{ inputs.purchase-import || steps.filter.outputs.purchase == 'true' }}
    steps:
      # A push diffs against its `before` commit with git; a pull request
      # lists its files through the API.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # The Apple filter names native sources and the files the Apple
          # tasks read directly, not the generator's web inputs: a PR that
          # changes only the generated Swift client (contracts, schemas) skips
          # the Apple lanes, and the nightly run catches what that misses.
          filters: |
            rust: &rust
              - 'recipebridge/**'
              - 'cubby-ffi/**'
              - 'Cargo.{toml,lock}'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '{.rustfmt,rustfmt,.clippy,clippy}.toml'
              - 'packages/shared/golden-vectors/**'
              - '.github/workflows/ci.yaml'
              # Nx configuration and ignore files change every task's key.
              - '{nx.json,.gitignore,.nxignore}'
            apple:
              - *rust
              - 'apps/apple/**'
              - '.xcode-version'
              - '.github/actions/setup-apple/**'
              - 'scripts/{ensure,rust-fingerprint}.ts'
              - 'scripts/lib/**'
              # File inputs of appleCommon in apps/apple/project.json.
              - 'apps/web/tooling/{simulator-inventory-schema,mac-fixture-identity}.ts'
              - 'apps/web/generator/artifacts.ts'
              - 'packages/shared/src/apple-{client-version,app-identity}.ts'
            purchase:
              - 'apps/web/src/server/domains/purchase-import/**'
              - 'apps/web/src/features/purchase/**'
              - 'apps/web/tests/e2e/purchase-import*'
              - 'apps/web/tests/e2e/fixtures/purchases*'
              - 'apps/web/tooling/purchase-agent-*.ts'
              - 'apps/web/tests/e2e/harness-services/purchase-*.ts'
              - 'apps/web/src/server/mcp/purchase-agent-protocol.ts'
              - '.claude/skills/purchase-import/**'
              - 'packages/schemas/src/purchase*'

  validation:
    name: Validation and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      # Independent failures stay red but do not hide the remaining diagnostics.
      - name: Generated contracts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:generate --outputStyle=stream
      - name: Design tokens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:design-tokens --outputStyle=stream
      - name: TypeScript
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # The merge gate keeps TypeScript's own checker; local runs default to tsrs.
        env:
          CUBBY_TYPECHECKER: tsgo
        run: pnpm exec nx run cubby-checks:types --outputStyle=stream
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:lint --outputStyle=stream
      - name: Unused code and dependencies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:knip --outputStyle=stream
      - name: Worker bindings
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:bindings --outputStyle=stream
      - name: Tooling regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:script-tests --outputStyle=stream
      - name: Worker unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run @cubby/web:workers-tests --outputStyle=stream
      - name: Swift formatting and state rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run apple:lint --outputStyle=stream
      - name: Formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec nx run cubby-checks:format --outputStyle=stream
      - name: Check relative Markdown links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './**/*.mdx'

  # Every entry is one standard runner with fresh PostgreSQL services.
  lanes:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Browser shards run alone: a companion check behind a shard
          # serializes the slowest lane's wall time.
          - name: E2E tests (desktop 1/4)
            browser: desktop-1
            run: CUBBY_E2E_SHARD=1/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 2/4)
            browser: desktop-2
            run: CUBBY_E2E_SHARD=2/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 3/4)
            browser: desktop-3
            run: CUBBY_E2E_SHARD=3/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: E2E tests (desktop 4/4)
            browser: desktop-4
            run: CUBBY_E2E_SHARD=4/4 pnpm exec nx run @cubby/web:e2e --outputStyle=stream
          - name: PostgreSQL integration tests
            run: pnpm exec nx run @cubby/web:postgres --outputStyle=stream
          - name: Auxiliary, Worker, and runtime tests
            step: Auxiliary tests and builds
            run: pnpm exec nx run-many -t test --exclude=cubby-checks --outputStyle=static-failures-only
            worker: true
    services: &test-databases
      postgres:
        image: mirror.gcr.io/pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: >-
            --set=jit=off --set=fsync=off
            --set=synchronous_commit=off --set=full_page_writes=off
        # Loopback only: 55432 is inside Linux's ephemeral port range, and on
        # all interfaces an outgoing connection's source port can hold it.
        ports:
          - 5432:5432
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s
          --health-retries 10 --health-start-period 3s
      # The pinned distroless image has no /bin/sh for Docker shell health
      # checks; its server retries PostgreSQL startup before serving requests.
      integresql:
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password
        ports:
          - 5000:5000
    # Each job owns fresh services and one host marker namespace.
    env: &web-lane-env
      CUBBY_TEMPLATE_SERVICE_ID: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}
      NODE_OPTIONS: "--max-old-space-size=4096"
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      CUBBY_SOURCE_COMMIT: ${{ github.sha }}
      CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: setup
        uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - name: ${{ matrix.step || 'Run lane' }}
        if: ${{ !matrix.browser }}
        run: ${{ matrix.run }}
      - if: ${{ matrix.browser }}
        uses: ./.github/actions/playwright
        with:
          command: ${{ matrix.run }}
          artifact: ${{ matrix.browser }}
      # Keeps its own result even after the auxiliary tests fail.
      - name: Build Workers and runtime tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.worker }}
        run: pnpm exec nx run-many -p @cubby/web -t db-check workerd-tests --parallel=1 --outputStyle=stream

  rust:
    name: Rust - recipebridge and cubby-ffi
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          workspace-filter: cubby
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ". -> target"
          # Root workspace profiles are not part of rust-cache's member manifest hash.
          # Retire immutable empty entries saved when Nx replayed both Rust targets.
          prefix-key: rust-gate-v3
          key: ${{ hashFiles('Cargo.toml') }}
          cache-on-failure: false
      # One crate at a time: both share the workspace target directory.
      - run: pnpm exec nx run-many -t rust --parallel=1 --outputStyle=stream

  # Linux checks whether each Apple lane's pass is already cached before any
  # macOS runner queues. The Apple key declares its toolchain (.xcode-version)
  # instead of observing a Mac, so both platforms compute the same hash. A
  # probe miss fails before native work and cannot publish a passing entry.
  apple-probe:
    name: Apple cache probe
    needs: plan
    if: needs.plan.outputs.apple == 'true' && !inputs.fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      host: ${{ steps.host.outcome }}
      simulator: ${{ steps.simulator.outcome }}
    env:
      CUBBY_NX_CACHE_PROBE: "1"
      # setup-apple's value on macOS; an Nx env input.
      CUBBY_FFI_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
      - id: host
        continue-on-error: true
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      - id: simulator
        continue-on-error: true
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream

  # Each Apple lane queues macOS only when Linux did not verify its cached
  # pass; a failed probe falls through to macOS. Queued jobs probe again
  # before preparing native dependencies.
  apple-host:
    name: Apple host tests
    needs: [plan, apple-probe]
    if: ${{ !cancelled() && needs.plan.outputs.apple == 'true' && needs.apple-probe.outputs.host != 'success' }}
    runs-on: xcode-27
    concurrency:
      group: cubby-apple-host
      cancel-in-progress: false
      queue: max
    timeout-minutes: 40
    env:
      # The restore and save steps must name the same paths.
      HOST_BUILD_CACHE_PATHS: |
        apps/apple/CubbyKit/.build/*
        !apps/apple/CubbyKit/.build/xcode
        apps/apple/CubbyKit/.build/xcode/CompilationCache.noindex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Package clones come from the simulator job's shared clone cache.
      - id: apple
        uses: ./.github/actions/setup-apple
        with:
          probe: apple:host-tests
          ffi-targets: mac
          xcodegen: "false"
      # Build products are disposable; unchanged compiler inputs replay through
      # Xcode's compilation cache without forging checkout timestamps. Keep
      # SwiftPM's warning-generator products.
      - name: Restore cached host compilation
        if: steps.apple.outputs.probe-hit != 'true'
        id: host-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: xcode-host-v1-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}-${{ hashFiles('apps/apple/scripts/check-openapi-warnings.sh') }}
          restore-keys: |
            xcode-host-v1-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            xcode-host-v1-${{ runner.os }}-${{ steps.apple.outputs.toolchain-hash }}-
      - name: Run CubbyKit host tests
        if: steps.apple.outputs.probe-hit != 'true'
        run: pnpm exec nx run apple:host-tests --outputStyle=stream
      # Publish only successful builds: exact-key cache entries are immutable.
      - name: Save host compilation cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ env.HOST_BUILD_CACHE_PATHS }}
          key: ${{ steps.host-build.outputs.cache-primary-key }}
          cache-hit: ${{ steps.host-build.outputs.cache-hit }}
          matched-key: ${{ steps.host-build.outputs.cache-matched-key }}

  apple-simulator:
    name: Apple simulator build
    needs: [plan, apple-probe]
    if: ${{ !cancelled() && needs.plan.outputs.apple == 'true' && needs.apple-probe.outputs.simulator != 'success' }}
    runs-on: xcode-27
    concurrency:
      group: cubby-apple-simulator
      cancel-in-progress: false
      queue: max
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Xcode's content-addressed compiler cache replays unchanged inputs
      # with ordinary checkout mtimes and filesystem identities.
      - uses: ./.github/actions/setup-apple
        id: apple
        with:
          probe: apple:simulator-build
          ffi-targets: sim
          build-cache: "true"
      - name: Run iOS app checks
        if: steps.apple.outputs.probe-hit != 'true'
        run: pnpm exec nx run apple:simulator-build --outputStyle=stream
      # A canceled compile must not permanently populate an exact cache key.
      - name: Save DerivedData cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.apple.outputs.cache-paths }}
          key: ${{ steps.apple.outputs.cache-key }}
          cache-hit: ${{ steps.apple.outputs.cache-hit }}
          matched-key: ${{ steps.apple.outputs.save-matched-key }}
      - name: Save SPM clone cache
        if: steps.apple.outputs.probe-hit != 'true'
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple.outputs.spm-clones-cache-key }}
          cache-hit: ${{ steps.apple.outputs.spm-clones-cache-hit }}
          matched-key: ${{ steps.apple.outputs.spm-clones-cache-matched-key }}

  # The one required check. A job may be skipped only when plan did not select
  # its lane or the probe verified its cached Apple pass; any other skip,
  # failure (except the probe's), or cancellation fails it. A manual run is
  # named apart so it never satisfies the required check on a PR head.
  ci-passed:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI diagnostics' || 'CI passed' }}
    needs:
      [plan, validation, lanes, rust, apple-probe, apple-host, apple-simulator]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: |
            scripts/check-outward-text.ts
            packages/shared/src/shortcode-alphabet.ts
            packages/schemas/src/entity-definitions
          sparse-checkout-cone-mode: false
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # A failed probe only sends both Apple lanes to macOS.
          allowed-failures: apple-probe
          allowed-skips: >-
            ${{ needs.plan.outputs.rust != 'true' && 'rust,' || '' }}
            ${{ needs.plan.outputs.apple != 'true' && 'apple-probe,apple-host,apple-simulator,' || '' }}
            ${{ inputs.fresh && 'apple-probe,' || '' }}
            ${{ needs.apple-probe.outputs.host == 'success' && 'apple-host,' || '' }}
            ${{ needs.apple-probe.outputs.simulator == 'success' && 'apple-simulator,' || '' }}

  # Informative only, outside `CI passed` and allowed to fail: the purchase
  # agent driven through the browser against a scripted model and gateway,
  # and on dispatch the live Email decisions. Both wait for the gate.
  purchase-import:
    name: E2E tests (purchase import agent, optional)
    needs: [plan, ci-passed]
    if: needs.ci-passed.result == 'success' && needs.plan.outputs.purchase == 'true'
    concurrency:
      group: cubby-informational-ci
      cancel-in-progress: false
      queue: max
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - uses: ./.github/actions/playwright
        with:
          command: pnpm exec nx run @cubby/web:e2e-purchase-import --outputStyle=stream
          artifact: purchase-import
          save-browser: "false"

  live-email:
    name: Live Email decisions (Jev and Clef, optional)
    needs: ci-passed
    if: needs.ci-passed.result == 'success' && inputs.live-email
    concurrency:
      group: cubby-informational-ci
      cancel-in-progress: false
      queue: max
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services: *test-databases
    env: *web-lane-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: MAIL_PROMPT_BASELINE_ONLY=1 pnpm --dir apps/web eval:mail-prompts
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
