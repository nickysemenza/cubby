name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  # Manual escape hatch: deploy main even when E2E would fail (known-flaky).
  # `gh workflow run ci.yaml --ref main -f bypass_e2e=true`. Unit/lint/rust still
  # gate — only E2E is skipped (see test-e2e `if:` and check-tests).
  workflow_dispatch:
    inputs:
      bypass_e2e:
        description: "Deploy main even if E2E would fail (known-flaky escape hatch)"
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but never on main — cancelling there
  # could abort an in-flight production deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
  # dorny/test-reporter posts check runs — https://github.com/dorny/test-reporter/issues/149
  checks: write
  pull-requests: read
jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # ingredient-parser is tracked via `branch = "main"` (not a pinned rev), so
      # resolve its live HEAD SHA and fold it into the cache key below. The key
      # then changes the instant upstream main moves, forcing a rebuild — without
      # this, a moving branch would serve a stale cached WASM pkg indefinitely.
      - name: Resolve ingredient-parser HEAD
        id: parser
        run: echo "sha=$(git ls-remote https://github.com/nickysemenza/ingredient-parser refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: wasm-cache
        name: Restore cached WASM pkg
        with:
          path: packages/wasm
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('recipebridge/Cargo.toml') }}-${{ hashFiles('recipebridge/src/**') }}-${{ hashFiles('rust-toolchain.toml') }}-${{ steps.parser.outputs.sha }}
          restore-keys: |
            wasm-pkg-${{ runner.os }}-
      # On a cache hit we only re-upload the restored pkg, so skip the Rust
      # toolchain + pnpm setup (nothing to compile). The artifact upload below
      # stays unconditional — downstream jobs need it on a hit too.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          cache: true
      - name: Setup pnpm
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - name: Build recipebridge WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm wasm
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: packages/wasm

  test-rust:
    name: Rust Tests - recipebridge
    runs-on: ubuntu-latest
    # Gating job on the deploy critical path: fmt + clippy + a plain `cargo test`.
    # Coverage instrumentation (cargo llvm-cov) is a *separate* job (coverage-rust)
    # because it forces a second, instrumented rebuild (~2m) that used to sit on
    # this critical path for no gating benefit — codecov is a soft gate.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Format check
        run: cargo fmt --manifest-path recipebridge/Cargo.toml --check
      - name: Lint (clippy)
        run: cargo clippy --manifest-path recipebridge/Cargo.toml --all-targets -- -D warnings
      # Native-target tests: the costing + food-mapping modules are pure
      # serde/ingredient code, so the parity suite runs without a wasm runtime.
      # A test failure fails this step (and thus the deploy gate). NOTE: lib.rs
      # reads as mostly uncovered by design: it's the #[wasm_bindgen] shim layer,
      # executable only inside a wasm runtime; the logic lives in the
      # costing/food_mappings modules (see coverage-rust).
      - name: Run recipebridge tests
        run: cargo test --manifest-path recipebridge/Cargo.toml

  coverage-rust:
    name: Rust Coverage - recipebridge
    runs-on: ubuntu-latest
    # Soft gate: NOT in check-tests `needs`, so a coverage hiccup never blocks the
    # deploy. Runs in parallel with the gating test-rust job. cargo llvm-cov does
    # its own instrumented build (separate RUSTFLAGS → can't reuse test-rust's
    # artifacts), which is exactly why it lives off the critical path.
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run recipebridge tests (with coverage)
        run: cargo llvm-cov --manifest-path recipebridge/Cargo.toml --lcov --output-path recipebridge/lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          files: recipebridge/lcov.info
          flags: recipebridge
          name: recipebridge-coverage

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: [build-wasm]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - run: pnpm run format:check
        name: "check formatting with Biome"
      - run: pnpm run check
        name: "lint and type check"
      - run: cd apps/web && npx knip
        name: "check for unused code with knip"

  test-unit-web:
    name: Unit Tests - web
    needs: [build-wasm]
    runs-on: ubuntu-latest
    # Pure `unit` + `ui` vitest projects only — NO service containers, so this
    # fast gate never pays the integresql/postgres image pull (normally ~25s but
    # occasionally an ~8m GHCR stall). DB-backed suites run in test-integration-web
    # below. NOTE: no job-level `continue-on-error` — it would force
    # needs.<job>.result to 'success' even on failure, defeating the check-tests
    # gate. The test step keeps step-level continue-on-error so coverage still
    # uploads on failure; the final "Fail if tests failed" step then fails honestly.
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"

      - name: Setup web environment
        uses: ./.github/actions/setup-web-env

      - name: Create test results directory
        run: mkdir -p apps/web/test-results

      - name: Run unit + ui tests for web
        id: test
        continue-on-error: true
        run: |
          cd apps/web
          pnpm test --project unit --project ui --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests - web
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          working-directory: apps/web
          flags: web
          name: web-unit-coverage

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: |
          echo "::error::Unit tests failed — see the 'Run unit + ui tests for web' step above"
          exit 1

  test-integration-web:
    name: Integration Tests - web
    needs: [build-wasm]
    runs-on: ubuntu-latest
    # The DB-backed `integration` vitest project — isolated here so the flaky
    # service-container pull never sits on the fast unit gate above. Still gates
    # the deploy via check-tests. Same honest-failure pattern (no job-level
    # continue-on-error; step-level so coverage uploads on failure).
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        # Pinned to an immutable digest (was `:latest`) for reproducibility —
        # the multi-arch index digest of integresql:latest as of 2026-06-24.
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"

      - name: Setup web environment
        uses: ./.github/actions/setup-web-env

      # NOTE: no manual `pg_trgm` / `db:push` against the `cubby` service DB —
      # nothing reads it. The integration tests provision their own IntegreSQL
      # template entirely in-process (tooling/test-setup.ts: CREATE EXTENSION
      # pg_trgm + drizzle-kit pushSchema).
      - name: Create test results directory
        run: mkdir -p apps/web/test-results

      - name: Run integration tests for web
        id: test
        continue-on-error: true
        run: |
          cd apps/web
          pnpm test --project integration --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Integration Tests - web
          path: apps/web/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          working-directory: apps/web
          flags: web
          name: web-integration-coverage

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: |
          echo "::error::Integration tests failed — see the 'Run integration tests for web' step above"
          exit 1

  test-unit-aux:
    name: Unit Tests - ${{ matrix.package.name }}
    needs: [build-wasm]
    runs-on: ubuntu-latest
    # Always runs (no change-detection gate). The legs are ~30s, run in parallel,
    # and finish well before the long-pole jobs, so they cost no critical-path
    # time — and always uploading their codecov flags keeps `codecov/project`
    # from dropping ~586 lines whenever a PR doesn't touch these packages.
    # NOTE: no job-level `continue-on-error` (see test-unit-web). result must stay
    # honest so the check-tests gate can catch a failing matrix leg.
    strategy:
      matrix:
        package:
          - name: schemas
            path: packages/schemas
          - name: usda-api
            path: apps/usda-api
          - name: usda-contract
            path: packages/usda-contract
          - name: usda-schemas
            path: packages/usda-schemas
          - name: upc-lookup
            path: apps/upc-lookup

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "false"

      - name: Create test results directory
        run: mkdir -p ${{ matrix.package.path }}/test-results

      - name: Run tests for ${{ matrix.package.name }}
        id: test
        continue-on-error: true
        run: |
          cd ${{ matrix.package.path }}
          pnpm test --run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests - ${{ matrix.package.name }}
          path: ${{ matrix.package.path }}/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/cubby
          working-directory: ${{ matrix.package.path }}
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-coverage

      - name: Fail if tests failed
        if: steps.test.outcome != 'success'
        run: |
          echo "::error::Unit tests failed for ${{ matrix.package.name }} — see the 'Run tests' step above"
          exit 1

  test-e2e:
    name: E2E Tests
    # Run on every PR (incl. Renovate — a dep bump is exactly what E2E should
    # catch; the repo is public so Actions minutes are free). Only skip when
    # manually bypassing E2E to force a deploy; check-tests treats a skipped E2E
    # as a pass, so bypass flows through the existing gate. NOTE: no job-level
    # `continue-on-error` — that would force needs.test-e2e.result to 'success'
    # and let a red E2E ship to prod (same footgun documented on the unit jobs).
    # A real failure now blocks the deploy honestly; post-test steps below stay
    # on if:always()/if:failure().
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bypass_e2e) }}
    needs: [build-wasm]
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: cubby
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        # Pinned to an immutable digest (was `:latest`) — see test-integration-web.
        image: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Setup web environment
        uses: ./.github/actions/setup-web-env
      - name: Enable pg_trgm extension
        run: psql -h localhost -U postgres -d cubby -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - name: Push schema to database
        run: pnpm --filter @cubby/web db:push

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(cd apps/web && npx playwright --version)" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && npx playwright install chromium
      - name: Build web app for E2E
        run: pnpm --filter @cubby/web run build:cf
      - name: Run Playwright tests
        id: e2e-test
        run: cd apps/web && npx playwright test
      - name: Publish Playwright Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: apps/web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  check-tests:
    name: Check All Tests Passed
    needs: [test-unit-web, test-integration-web, test-unit-aux, test-e2e, test-rust]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      all-passed: ${{ steps.check.outputs.all-passed }}
    steps:
      - name: Check test results
        id: check
        run: |
          unit_web_result="${{ needs.test-unit-web.result }}"
          integration_web_result="${{ needs.test-integration-web.result }}"
          unit_aux_result="${{ needs.test-unit-aux.result }}"
          e2e_result="${{ needs.test-e2e.result }}"
          rust_result="${{ needs.test-rust.result }}"

          echo "Unit tests (web) result: $unit_web_result"
          echo "Integration tests (web) result: $integration_web_result"
          echo "Unit tests (aux) result: $unit_aux_result"
          echo "E2E tests result: $e2e_result"
          echo "Rust tests result: $rust_result"

          # e2e may be skipped (bypass_e2e escape hatch / Renovate); everything else
          # must pass. aux now always runs, so it must succeed (no skipped allowance).
          if [[ "$unit_web_result" == "success" && \
                "$integration_web_result" == "success" && \
                "$unit_aux_result" == "success" && \
                "$rust_result" == "success" && \
                ("$e2e_result" == "success" || "$e2e_result" == "skipped") ]]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
          fi

  build-cf:
    name: Build for Cloudflare Workers
    needs: [build-wasm, lint-format]
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: "true"
      - name: Build for Cloudflare Workers
        run: pnpm --filter @cubby/web run build:cf
      - name: Upload CF build artifact
        uses: actions/upload-artifact@v6
        with:
          name: cf-build
          path: apps/web/dist
          retention-days: 1

  deploy-cf:
    name: Deploy to Cloudflare Workers
    needs: [lint-format, check-tests, build-cf]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.lint-format.result == 'success' &&
      needs.check-tests.outputs.all-passed == 'true' &&
      needs.build-cf.result == 'success' &&
      github.ref == 'refs/heads/main'
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@v6
      - name: Download CF build artifact
        uses: actions/download-artifact@v7
        with:
          name: cf-build
          path: apps/web/dist
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web

  preview-cf:
    name: Preview Deploy (Cloudflare)
    # Per-PR preview via `wrangler versions upload`: uploads a new VERSION of the
    # cubby worker (prod Hyperdrive + secrets) WITHOUT routing the custom domain
    # to it, served at https://<prefix>-cubby.nicky.workers.dev. Prod stays on the
    # deployed version. Writes hit prod data; passkeys break on the preview URL
    # (rpID is bound to cubby.nickysemenza.com) — auth.ts trusts *.nicky.workers.dev
    # so email/password login still works.
    #
    # The preview URL is surfaced as a native GitHub Deployment (environment.url
    # below) — it shows in the repo Deployments UI and as a "View deployment"
    # button on the PR, same treatment as prod. Requires Preview URLs (workers.dev
    # subdomain) enabled on the cubby worker; until then the URL is empty.
    needs: [build-cf]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - name: Download CF build artifact
        uses: actions/download-artifact@v7
        with:
          name: cf-build
          path: apps/web/dist
      - name: Install wrangler
        run: npm install -g wrangler
      - name: Upload preview version
        id: preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
        run: |
          set -o pipefail
          # --message carries the PR URL so it links back from the CF Versions UI
          # (deploys are by a service token, so CF shows "by Unknown" — full
          # GitHub linking would need Cloudflare Workers Builds).
          # COOKIE_DOMAIN scopes the better-auth session cookie to the whole
          # account subdomain (not the unique per-version host), so one login on
          # any preview carries to every preview. Prod never sets this var, so it
          # keeps a host-only cookie on cubby.nickysemenza.com. See auth.ts.
          wrangler versions upload --config dist/server/wrangler.json \
            --var "COOKIE_DOMAIN:.nicky.workers.dev" \
            --tag "pr-${{ github.event.number }}" \
            --message "${{ github.event.pull_request.html_url }} @ ${{ github.sha }}" 2>&1 | tee upload.log
          # The <prefix>-cubby host is specific to this worker's preview URLs, so
          # it won't match the USDA/UPC vars in the bindings dump.
          url=$(grep -oE 'https://[a-z0-9-]+-cubby\.nicky\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] || echo "::warning::No preview URL — enable Preview URLs (workers.dev) for the cubby worker."
