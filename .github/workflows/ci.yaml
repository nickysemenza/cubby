name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly live Tester Army import journeys (the coupled harness); never a merge gate.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      simulator_e2e:
        description: Run the disposable-database iPhone simulator E2E lane
        type: boolean
        default: false
      simulator_journey:
        description: Journey for the manual iPhone simulator lane
        type: choice
        options: [search, inputs]
        default: search
      tester_army:
        description: Run the experimental synthetic Tester Army journeys
        type: choice
        options: [none, web, ios, both, import]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.simulator_e2e }}-${{ inputs.simulator_journey }}-${{ inputs.tester_army }}
  # PR updates supersede old results. Main must finish publishing reusable
  # caches, even when the next merge does not select the same native lanes.
  # The default single pending slot retains only the newest waiting run.
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  scope:
    name: Scope
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (!inputs.simulator_e2e && inputs.tester_army == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validation: ${{ steps.classify.outputs.validation }}
      generation: ${{ steps.classify.outputs.generation }}
      web: ${{ steps.classify.outputs.web }}
      auxiliary: ${{ steps.classify.outputs.auxiliary }}
      rust: ${{ steps.classify.outputs.rust }}
      apple: ${{ steps.classify.outputs.apple }}
      docs: ${{ steps.classify.outputs.docs }}
      format: ${{ steps.classify.outputs.format }}
      importE2e: ${{ steps.classify.outputs.importE2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            .nvmrc
            scripts/check-outward-text.ts
            scripts/ci-change-scope.ts
            packages/shared/src/shortcode-alphabet.ts
            packages/schemas/src/entity-definitions
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      # The commit-msg hook gates commit messages; the PR title and body are
      # the other outward text AGENTS.md keeps free of live entity codes.
      - name: PR text names no live entity codes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '.title + "\n" + .body' | node scripts/check-outward-text.ts --stdin
      - name: Classify affected checks
        id: classify
        env:
          # Keep paths out of the process environment: large renamed diffs can
          # exceed Linux's per-value limit before even bash starts.
          CUBBY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CUBBY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-change-scope.ts

  validation:
    name: Validation
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NX_PARALLEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        if: needs.scope.outputs.validation == 'true'
        with:
          wasm: ${{ needs.scope.outputs.validation == 'true' && 'restore' || 'false' }}
      - uses: ./.github/actions/setup-node-with-deps
        if: needs.scope.outputs.validation != 'true' && needs.scope.outputs.format == 'true'
        with:
          wasm: "false"
          workspace-filter: ${{ needs.scope.outputs.generation == 'true' && '@cubby/web...' || '.' }}
      # The Nx `wasm` target's runtime input (ensure-wasm.ts --fingerprint)
      # runs `wasm-pack --version`, which a restored package does not provide.
      - name: Install wasm-pack for validation
        if: needs.scope.outputs.validation == 'true'
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
        with:
          tool: wasm-pack
      - if: needs.scope.outputs.validation == 'true'
        run: pnpm check:all
      - if: needs.scope.outputs.validation == 'true'
        run: pnpm dedupe:check
      # todos.md owns deferred MCP references; use the existing generator,
      # without compiling WASM or running unrelated application tests.
      - name: Check documentation generation inputs
        if: needs.scope.outputs.generation == 'true' && needs.scope.outputs.validation != 'true'
        run: |
          pnpm generate:if-stale
          pnpm exec redocly lint apps/web/src/lib/generated/http-openapi.gen.json --config redocly.yaml
      - if: needs.scope.outputs.format == 'true' && needs.scope.outputs.validation != 'true'
        run: pnpm exec oxfmt --check .
      - name: Check documented repository paths
        if: needs.scope.outputs.docs == 'true' && needs.scope.outputs.validation != 'true'
        run: node scripts/check-doc-paths.ts
      - name: Check relative Markdown links
        if: needs.scope.outputs.docs == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --no-progress
            --exclude-path '(^|/)node_modules/'
            --root-dir "${{ github.workspace }}"
            './**/*.md'
            './**/*.mdx'

  # Fast web and auxiliary checks share setup and a required status.
  test-aux:
    name: Auxiliary tests and builds
    needs: scope
    if: needs.scope.outputs.auxiliary == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: ${{ needs.scope.outputs.web == 'true' && 'restore' || 'false' }}
          workspace-filter: ${{ needs.scope.outputs.auxiliary != 'true' && '@cubby/web...' || '' }}
      # The mcp-contract project imports the built MCP App HTML; build:cf used
      # to produce it here before the Worker build moved to build-worker.
      - name: Build MCP App assets
        if: needs.scope.outputs.web == 'true'
        run: pnpm --filter @cubby/mcp-apps run build
      - name: Run fast tests
        if: needs.scope.outputs.web == 'true'
        run: pnpm --dir apps/web exec vitest run --project unit --project mcp-contract --project worker-safety --project ui

      - name: Run auxiliary package tests
        if: needs.scope.outputs.auxiliary == 'true'
        run: pnpm -r --no-sort --workspace-concurrency=2 --no-bail --filter '!@cubby/web' --if-present run test --maxWorkers=1
      - name: Build USDA API
        if: needs.scope.outputs.auxiliary == 'true'
        run: pnpm --filter @cubby/usda-api run build

  test-rust:
    name: Rust - recipebridge and cubby-ffi
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          cache: true
          cache-workspaces: ". -> target"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Builds and tests the workerd bundle, then shares it with the optional
  # purchase lane. Desktop shards build independently after Scope.
  build-worker:
    name: Build Workers and runtime tests
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - name: Build the Worker
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          # wasm-pack may add a trailing newline to the tracked package metadata.
          git restore -- packages/wasm/package.json
          pnpm --filter @cubby/web run build:cf
      # One artifact keeps the three outputs at their repository paths, so
      # consumers extract it over the checkout.
      - name: Save Worker build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worker-build
          path: |
            apps/web/dist
            apps/mcp-apps/dist
            packages/wasm
          if-no-files-found: error
          retention-days: 1
      # The workerd project consumes this job's fresh bundle, avoiding another
      # checkout, dependency setup and artifact download.
      - uses: ./.github/actions/start-test-services
      - name: Run workerd PostgreSQL integration tests
        run: |
          git restore -- packages/wasm/package.json
          pnpm --dir apps/web exec vitest run --project integration-workerd

  # One four-worker job avoids repeating database and dependency setup.
  # These files never start workerd, so they start after Scope, not Build
  # Workers; the files that do run in build-worker.
  test-postgres:
    name: PostgreSQL integration tests
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/start-test-services
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - name: Run PostgreSQL integration tests
        run: pnpm --dir apps/web exec vitest run --project integration --maxWorkers=4

  # Committed migrations are the only schema path: prove they carry every
  # schema.ts change and build the same catalog as schema.ts itself.
  db-check:
    name: Database migrations
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/start-test-services
        with:
          integresql: "false"
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
      - run: pnpm --dir apps/web db:check

  test-e2e:
    name: E2E tests (${{ matrix.lane }})
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Benchmark two workers per standard runner after browser caching and
          # reduced motion improved the former one-worker suite. Keep Playwright's
          # built-in sharding; the stable aggregate owns the required status.
          - lane: "desktop 1/2"
            slug: desktop-1
            browser: chromium
            test-script: test:e2e:ci:desktop
            shard: "1/2"
          - lane: "desktop 2/2"
            slug: desktop-2
            browser: chromium
            test-script: test:e2e:ci:desktop
            shard: "2/2"
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/start-test-services
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - name: Resolve installed Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- ${{ matrix.browser }}
      - name: Save exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Build the Worker
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          # wasm-pack may add a trailing newline to the tracked package metadata.
          git restore -- packages/wasm/package.json
          pnpm --filter @cubby/web run build:cf
      - name: Run Playwright tests
        run: |
          pnpm --filter @cubby/web run ${{ matrix.test-script }} --shard=${{ matrix.shard }} --workers=2 --trace=off
      - name: Save Playwright run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-run-${{ matrix.slug }}
          path: |
            apps/web/playwright-report/run-manifest.json
            apps/web/playwright-report/run-results.json
            apps/web/playwright-report/SHA256SUMS
            apps/web/playwright-report/workerd-logs
          if-no-files-found: error
          retention-days: 7

  # Informative only: the purchase agent driven through the browser against a
  # scripted model and gateway. It is deliberately absent from `web-checks`
  # and branch protection, so a failure never blocks a merge.
  test-e2e-purchase-import:
    name: E2E tests (purchase import agent, optional)
    needs: [scope, build-worker]
    if: needs.scope.outputs.web == 'true' && (github.event_name == 'push' || needs.scope.outputs.importE2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/start-test-services
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: "false"
          workspace-filter: "@cubby/web..."
      - name: Resolve installed Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore exact Playwright browser
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install exact Playwright browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @cubby/web run test:e2e:install-browser -- chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: worker-build
          path: .
      - name: Run purchase import browser E2E
        run: |
          # The downloaded WASM package may carry regenerated metadata.
          git restore -- packages/wasm/package.json
          pnpm --filter @cubby/web run test:e2e:ci:purchase-import
      - name: Save Playwright run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-run-purchase-import
          path: |
            apps/web/playwright-report/run-manifest.json
            apps/web/playwright-report/run-results.json
            apps/web/playwright-report/SHA256SUMS
            apps/web/playwright-report/workerd-logs
          if-no-files-found: error
          retention-days: 7

  # Matrix jobs are omitted entirely when web is unaffected. This stable
  # required check verifies their combined result whenever they run.
  web-checks:
    name: Web checks
    needs: [scope, build-worker, test-aux, test-postgres, db-check, test-e2e]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || (!inputs.simulator_e2e && inputs.tester_army == 'none'))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require affected web lanes to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          WEB: ${{ needs.scope.outputs.web }}
          BUILD_RESULT: ${{ needs.build-worker.result }}
          WEB_RESULT: ${{ needs.test-aux.result }}
          POSTGRES_RESULT: ${{ needs.test-postgres.result }}
          DB_CHECK_RESULT: ${{ needs.db-check.result }}
          E2E_RESULT: ${{ needs.test-e2e.result }}
        run: |
          test "$SCOPE_RESULT" = success || exit 1
          if [ "$WEB" = true ]; then
            test "$BUILD_RESULT" = success || exit 1
            test "$WEB_RESULT" = success || exit 1
            test "$POSTGRES_RESULT" = success || exit 1
            test "$DB_CHECK_RESULT" = success || exit 1
            test "$E2E_RESULT" = success || exit 1
          fi

  # The Swift the Apple jobs compile from `pnpm generate` (never committed);
  # generated here on Linux so the macOS jobs need no Node install.
  apple-generated:
    name: Apple generated inputs
    needs: scope
    if: needs.scope.outputs.apple == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/generate-apple-inputs

  # Run package tests on the host before the generic Simulator build; never
  # boot a Simulator here. Sequential phases share one macOS runner without
  # competing for its cores, and retain their separate compiled-product caches.
  test-apple:
    name: Apple checks
    needs: [scope, apple-generated]
    if: needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: mac
      - uses: ./.github/actions/download-apple-inputs
      # The whole SwiftPM build directory is cached, not just the checkouts:
      # 367 tests run in ~3s, the other 2.5-4 minutes was a cold build.
      # stamp-source-mtimes.ts gives each tracked source an mtime derived
      # from its blob hash, so unchanged files match the restored build and
      # only changed ones recompile (measured locally: 76s cold, 41s restored
      # with fresh-checkout mtimes, 3s restored and stamped, 8s with one
      # CubbyKit file changed). The key ends in a hash of CubbyKit so main
      # saves once per Swift change; PRs restore main's newest by prefix.
      - name: Compute Swift toolchain hash
        id: swift-version
        uses: ./.github/actions/toolchain-hash
        with:
          command: swift --version
      - name: Restore cached SwiftPM build
        id: spm-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/apple/CubbyKit/.build
          key: spm-build-v2-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/CubbyKit/**') }}-${{ hashFiles('apps/apple/scripts/check-openapi-warnings.sh') }}
          restore-keys: |
            spm-build-v2-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved') }}-
            spm-build-v2-${{ runner.os }}-${{ steps.swift-version.outputs.hash }}-
      - name: Stamp source mtimes from content
        run: node scripts/stamp-source-mtimes.ts apps/apple/CubbyKit
      # --disable-index-store: nothing reads the index on CI, and it would
      # otherwise be rebuilt and cached with every module.
      - name: Run CubbyKit Swift tests
        run: swift test --package-path apps/apple/CubbyKit --force-resolved-versions --disable-index-store
      # The build plugin lets a generator warning (a silently dropped schema)
      # through; this gate fails on one, reusing a recorded pass only when
      # the document, config, generator pin, toolchain and gate are unchanged.
      - name: Check OpenAPI generator warnings
        run: apps/apple/scripts/check-openapi-warnings.sh
      # Publish only successful builds: exact-key cache entries are immutable.
      - name: Save SwiftPM build cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/CubbyKit/.build
          key: ${{ steps.spm-build.outputs.cache-primary-key }}
          cache-hit: ${{ steps.spm-build.outputs.cache-hit }}
          matched-key: ${{ steps.spm-build.outputs.cache-matched-key }}

      # Cache restore overlays directories. Remove the host-only framework
      # before restoring the simulator slice so its source/certificate hashes
      # are independent of whether either target's cache hit or missed.
      - name: Replace host FFI with simulator FFI
        run: rm -rf apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        id: apple-tools
      # DerivedData is cached like CubbyKit's .build above: apple-check.sh's
      # ci mode stamps tracked sources with blob-hash mtimes after xcodegen,
      # and XCBuild is told to ignore the device/inode changes every cache
      # restore introduces, so only changed sources recompile.
      - uses: ./.github/actions/setup-apple-build-cache
        id: derived-data
      - name: Run iOS app checks
        run: sh scripts/apple-check.sh ci
      # A canceled compile must not permanently populate an exact cache key.
      - name: Save DerivedData cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.derived-data.outputs.cache-paths }}
          key: ${{ steps.derived-data.outputs.cache-key }}
          cache-hit: ${{ steps.derived-data.outputs.cache-hit }}
          matched-key: ${{ steps.derived-data.outputs.save-matched-key }}
      - name: Save SPM clone cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: apps/apple/SourcePackages
          key: ${{ steps.apple-tools.outputs.spm-clones-cache-key }}
          cache-hit: ${{ steps.apple-tools.outputs.spm-clones-cache-hit }}
          matched-key: ${{ steps.apple-tools.outputs.spm-clones-cache-matched-key }}

  # Release-only FFI caches use dist, while the required Apple checks use
  # release. Warm both dist targets sequentially after the required native
  # gate so background builds do not occupy two more macOS runners first.
  warm-apple-ffi:
    name: Warm Apple release FFI caches
    needs: [scope, test-apple]
    if: github.event_name == 'push' && needs.scope.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: mac
          profile: dist
      # Cache restore overlays directories; keep the device cache free of
      # the macOS slices from the preceding target.
      - name: Replace macOS FFI with device FFI
        run: rm -rf apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: device
          profile: dist

  simulator-e2e:
    name: iPhone simulator E2E (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.simulator_e2e && inputs.tester_army == 'none'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
          pnpm-store-cache: "false"
      - uses: ./.github/actions/reuse-worker-build
      - uses: ./.github/actions/setup-apple-ffi
        with:
          targets: sim
      - uses: ./.github/actions/setup-apple-tools
        with:
          restore-spm-clones: "false"
      - uses: ./.github/actions/setup-apple-build-cache
        id: derived-data
      - uses: ./.github/actions/setup-apple-test-runner-cache
        id: test-runner
        with:
          toolchain-hash: ${{ steps.derived-data.outputs.toolchain-hash }}
      - name: Start native PostgreSQL 17 with pgvector
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@17 pgvector
          pg_bin="$(brew --prefix postgresql@17)/bin"
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/cubby-sim-pg" -A trust -U postgres
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/cubby-sim-pg" -l "$RUNNER_TEMP/cubby-sim-pg.log" -o '-h 127.0.0.1 -p 55432' start
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD 'password'"
          "$pg_bin/psql" -h 127.0.0.1 -p 55432 -U postgres -d postgres -Atc "SELECT name FROM pg_available_extensions WHERE name = 'vector'" | grep -qx vector
      - name: Run native read and write against a disposable database
        env:
          CUBBY_SIM_DB_EXTERNAL: "1"
          CI: "1"
          SIMULATOR_JOURNEY: ${{ inputs.simulator_journey }}
        run: |
          # Keep generated WASM metadata identical to this checkout, as in Build Workers.
          git restore -- packages/wasm/package.json
          if [[ "$SIMULATOR_JOURNEY" == "inputs" ]]; then
            pnpm test:e2e:sim -- --input-journey
          else
            pnpm test:e2e:sim
          fi
      - name: Save Apple test runner cache
        uses: ./.github/actions/save-apple-test-runner-cache
        with:
          path: ${{ steps.test-runner.outputs.cache-paths }}
          key: ${{ steps.test-runner.outputs.cache-key }}
          cache-hit: ${{ steps.test-runner.outputs.cache-hit }}
          matched-key: ${{ steps.test-runner.outputs.matched-key }}
      - name: Save DerivedData cache
        uses: ./.github/actions/save-cache-main-only
        with:
          path: ${{ steps.derived-data.outputs.cache-paths }}
          key: ${{ steps.derived-data.outputs.cache-key }}
          cache-hit: ${{ steps.derived-data.outputs.cache-hit }}
          matched-key: ${{ steps.derived-data.outputs.save-matched-key }}
      - name: Collect verified simulator E2E evidence
        if: always()
        shell: python
        run: |
          import hashlib
          import pathlib
          import shutil

          for checksums in pathlib.Path("artifacts").glob("sim*-e2e/*/SHA256SUMS"):
              source = checksums.parent
              target = pathlib.Path("artifacts/sealed-simulator-e2e") / source.name
              target.mkdir(parents=True, exist_ok=True)
              for line in checksums.read_text().splitlines():
                  digest, name = line.split("  ", 1)
                  file = source / name
                  if not file.resolve().is_relative_to(source.resolve()):
                      raise ValueError("Sealed evidence escapes its run directory")
                  if hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                      raise ValueError(f"Sealed evidence checksum mismatch: {name}")
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(file, destination)
              shutil.copyfile(checksums, target / checksums.name)
      - name: Save simulator E2E run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulator-e2e-run
          if-no-files-found: error
          retention-days: 7
          path: artifacts/sealed-simulator-e2e

  tester-army-inputs:
    name: Tester Army dispatch inputs
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tester_army != 'none')
    runs-on: ubuntu-latest
    # Inputs are empty on `schedule`, which runs the import lane.
    outputs:
      lane: ${{ github.event_name == 'schedule' && 'import' || inputs.tester_army }}
    steps:
      - name: Reject conflicting manual lanes
        env:
          SIMULATOR_E2E: ${{ inputs.simulator_e2e }}
        run: test "$SIMULATOR_E2E" != true

  tester-army-web:
    name: Tester Army web (manual)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'web' || needs.tester-army-inputs.outputs.lane == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      # Hosted runs keep the gateway: a ChatGPT login refreshed in one job
      # cannot be written back for the next (docs/tester-army.md).
      TESTER_ARMY_PROVIDER: ${{ vars.TESTER_ARMY_PROVIDER || 'gateway' }}
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/reuse-worker-build
      - uses: ./.github/actions/start-test-services
      - run: pnpm --filter @cubby/web run test:e2e:install-browser chromium --with-deps
      - run: pnpm test:e2e:agent:web -- --harness standard
      - name: Save sanitized web run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-army-web-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/tester-army/web/*/run-manifest.json
            artifacts/tester-army/web/*/run-results.json
            artifacts/tester-army/web/*/agent-summary.json
            artifacts/tester-army/web/*/SHA256SUMS

  tester-army-import:
    name: Tester Army import journeys (manual or weekly, live models)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'import'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTER_ARMY_CF_API_TOKEN: ${{ secrets.TESTER_ARMY_CF_API_TOKEN }}
      TESTER_ARMY_CF_ACCOUNT_ID: ${{ vars.TESTER_ARMY_CF_ACCOUNT_ID }}
      TESTER_ARMY_MODEL: ${{ vars.TESTER_ARMY_MODEL }}
      # Hosted runs keep the gateway: a ChatGPT login refreshed in one job
      # cannot be written back for the next (docs/tester-army.md).
      TESTER_ARMY_PROVIDER: ${{ vars.TESTER_ARMY_PROVIDER || 'gateway' }}
      TESTER_ARMY_AGENT_MODEL: ${{ vars.TESTER_ARMY_AGENT_MODEL }}
      TESTER_ARMY_AGENT_EFFORT: ${{ vars.TESTER_ARMY_AGENT_EFFORT }}
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-node-with-deps
        with:
          wasm: restore
      - run: pnpm test:e2e:agent:preflight
      - uses: ./.github/actions/reuse-worker-build
      - uses: ./.github/actions/start-test-services
      - run: pnpm --filter @cubby/web run test:e2e:install-browser chromium --with-deps
      - run: pnpm test:e2e:agent:web -- --harness coupled
      - name: Save sanitized import run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-army-import-run
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/tester-army/web/*/run-manifest.json
            artifacts/tester-army/web/*/run-results.json
            artifacts/tester-army/web/*/agent-summary.json
            artifacts/tester-army/web/*/gateway-usage.json
            artifacts/tester-army/web/*/SHA256SUMS

  tester-army-ios:
    name: Tester Army iOS (manual)
    needs: tester-army-inputs
    if: needs.tester-army-inputs.outputs.lane == 'ios' || needs.tester-army-inputs.outputs.lane == 'both'
    runs-on: macos-26
