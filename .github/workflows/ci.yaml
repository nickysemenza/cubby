name: CI

on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  checks: write
  # https://github.com/dorny/test-reporter/issues/149
jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: wasm-cache
        name: Restore cached WASM pkg
        with:
          path: packages/wasm
          key: wasm-pkg-${{ runner.os }}-${{ hashFiles('recipebridge/Cargo.toml') }}-${{ hashFiles('recipebridge/Cargo.lock') }}-${{ hashFiles('recipebridge/src/**') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            wasm-pkg-${{ runner.os }}-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        if: steps.wasm-cache.outputs.cache-hit != 'true'
      - name: Build recipebridge WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: pnpm wasm
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
      - name: Upload WASM pkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-pkg
          path: packages/wasm

  lint-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    needs: [build-wasm]
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - run: pnpm run format:check
        name: 'check formatting with Biome'
      - run: pnpm run check
        name: 'lint and type check'
      - run: cd apps/web && npx knip --no-exit-code
        name: 'check for unused code with knip'

  test-unit:
    name: Unit Tests - ${{ matrix.package.name }}
    needs: [build-wasm]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        package:
          - name: web
            path: apps/web
            needs-db: true
            needs-wasm: true
          - name: usda-api
            path: apps/usda-api
            needs-db: false
            needs-wasm: false
          - name: usda-contract
            path: packages/usda-contract
            needs-db: false
            needs-wasm: false
          - name: usda-schemas
            path: packages/usda-schemas
            needs-db: false
            needs-wasm: false
          - name: upc-lookup
            path: apps/upc-lookup
            needs-db: false
            needs-wasm: false
    outputs:
      test-passed: ${{ steps.test.outcome == 'success' }}
    services:
      postgres:
        image: ${{ matrix.package.needs-db && 'postgres' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: recipehub
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ${{ matrix.package.needs-db && 'ghcr.io/allaboutapps/integresql:latest' || '' }}
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: ${{ matrix.package.needs-wasm && 'true' || 'false' }}

      - name: Setup web environment
        if: matrix.package.needs-db
        uses: ./.github/actions/setup-web-env

      - name: Push database schema
        if: matrix.package.needs-db
        run: pnpm --filter @recipehub/web db:push

      - name: Create test results directory
        run: mkdir -p ${{ matrix.package.path }}/test-results

      - name: Run tests for ${{ matrix.package.name }}
        id: test
        continue-on-error: true
        run: |
          cd ${{ matrix.package.path }}
          pnpm test --run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests - ${{ matrix.package.name }}
          path: ${{ matrix.package.path }}/test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: nickysemenza/recipehub
          working-directory: ${{ matrix.package.path }}
          flags: ${{ matrix.package.name }}
          name: ${{ matrix.package.name }}-coverage

  test-e2e:
    name: E2E Tests
    needs: [build-wasm]
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      test-passed: ${{ steps.e2e-test.outcome == 'success' }}
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      E2E_TEST_USER_EMAIL: nicky@test.com
      E2E_TEST_USER_PASSWORD: password1234
      BETTER_AUTH_SECRET: ci-secret-TbGFDRAbhlR8e3RaXsfHR9CQ7r4nIc9
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: recipehub
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      integresql:
        image: ghcr.io/allaboutapps/integresql:latest
        ports:
          - 5000:5000
        env:
          PGHOST: postgres
          PGUSER: postgres
          PGPASSWORD: password

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - name: Setup web environment
        uses: ./.github/actions/setup-web-env
      - name: Push schema to database
        run: pnpm --filter @recipehub/web db:push

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd apps/web && npx playwright install chromium
      - name: Run Playwright tests
        id: e2e-test
        run: cd apps/web && npx playwright test
      - name: Publish Playwright Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: apps/web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  check-tests:
    name: Check All Tests Passed
    needs: [test-unit, test-e2e]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      all-passed: ${{ steps.check.outputs.all-passed }}
    steps:
      - name: Check test results
        id: check
        run: |
          # Check if all unit test jobs succeeded
          unit_result="${{ needs.test-unit.result }}"
          e2e_result="${{ needs.test-e2e.result }}"

          echo "Unit tests result: $unit_result"
          echo "E2E tests result: $e2e_result"

          if [[ "$unit_result" == "success" && "$e2e_result" == "success" ]]; then
            echo "all-passed=true" >> $GITHUB_OUTPUT
          else
            echo "all-passed=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Application
    needs: [build-wasm, lint-format]
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - name: Build web app
        run: pnpm --filter @recipehub/web build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy to Vercel
    needs: [build-wasm, lint-format, check-tests, build]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.lint-format.result == 'success' &&
      needs.check-tests.outputs.all-passed == 'true' &&
      needs.build.result == 'success'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-with-deps
        with:
          download-wasm: 'true'
      - name: Deploy to Vercel
        id: deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: team_rAffu7VKl4KcVrPBRqaMYB7f
          VERCEL_PROJECT_ID: prj_JPllV9ESJ1mzTBJZEmAtNrooLS00
