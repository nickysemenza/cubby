name: Deploy

# Required PR CI gates merging. This workflow builds and deploys current main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: "9f10f078d35d86c78dedece2300a6b88"

jobs:
  deploy-web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Reuse the same content-verified WASM artifacts as required PR CI.
      NX_CACHE_URL: ${{ secrets.NX_CACHE_URL }}
      NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/web"
          workspace-filter: "@cubby/web..."
          wasm: "restore"
          build-command: "pnpm --filter @cubby/web run build:cf"
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          deploy-command: |
            : "${PRODUCTION_DIRECT_DATABASE_URL:?Production deployment needs PRODUCTION_DIRECT_DATABASE_URL}"
            args=(--target=production)
            if [[ -n "${PRODUCTION_MIGRATION_THROUGH:-}" ]]; then
              args+=("--through=$PRODUCTION_MIGRATION_THROUGH")
            fi
            pnpm --filter @cubby/web db:migrate "${args[@]}"

            # A migration can outlive a newer main push, just as the build can.
            current="$(git ls-remote origin refs/heads/main | cut -f1)"
            [[ -n "$current" ]] || { echo "::error::Could not resolve refs/heads/main"; exit 1; }
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping stale deployment for $GITHUB_SHA; main is $current"
              exit 0
            fi
            pnpm --filter @cubby/web exec wrangler deploy --config dist/server/wrangler.json
          production-direct-database-url: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          production-migration-through: ${{ vars.PRODUCTION_MIGRATION_THROUGH }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
