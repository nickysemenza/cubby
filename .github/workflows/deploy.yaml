name: Deploy

# Required PR CI gates merging. This workflow builds and deploys current main.
on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: "9f10f078d35d86c78dedece2300a6b88"

jobs:
  deploy-web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/web"
          workspace-filter: "@cubby/web..."
          wasm: "restore"
          build-command: "pnpm --filter @cubby/web run build:cf"
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # web's deploy:cf script re-runs build:cf, which would duplicate the
          # build-command step above, so this deploys the already-built
          # bundle directly instead of going through deploy:cf.
          deploy-command: "pnpm --filter @cubby/web exec wrangler deploy --config dist/server/wrangler.json"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: [upc-lookup, usda-api]
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/${{ matrix.pkg }}"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
          wasm: "false"
          deploy-command: "pnpm --filter @cubby/${{ matrix.pkg }} run deploy"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  deploy-purchase-agent:
    name: Build and deploy purchase agent
    needs: deploy-web
    if: >-
      always() &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-purchase-agent-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/purchase-agent"
          # `@cubby/web...` too: the Worker imports generated modules, and
          # `pnpm generate` (its build's first step) runs the web app's code.
          workspace-filter: "@cubby/purchase-agent... @cubby/web..."
          wasm: "false"
          deploy-command: "pnpm --filter @cubby/purchase-agent run deploy"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
