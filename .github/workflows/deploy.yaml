name: Deploy

# Required PR CI gates merging. This workflow builds and deploys current main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    name: Changed Workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      purchase_agent: ${{ steps.filter.outputs.purchase_agent }}
      workers: ${{ steps.workers.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Replaces scripts/ci-scope.ts's classifyPaths (deleted): three filters
      # covering the same prefixes classifyPaths used for `web`/`usda`/`upc`.
      # Shared-root paths (root manifests, CI, scripts) are duplicated into
      # every filter so a workspace-wide change still deploys every Worker.
      # Unlike classifyPaths, an entirely unrecognised top-level path is NOT a
      # fail-safe "deploy everything" here — add it to the filter(s) it should
      # affect (see docs/ci.md "Deployment").
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # push-to-main is the documented "long-lived branch" case: base ==
          # the triggering branch compares against the most recent commit on
          # main before this push (and against every file when there is
          # none, e.g. the branch's first push).
          base: main
          filters: |
            shared: &shared
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'nx.json'
              - 'project.json'
              - 'tsconfig.json'
              - '.github/**'
              - '.husky/**'
              - 'scripts/**'
              - 'packages/tsconfig.package.json'
            web:
              - *shared
              - 'apps/mcp-apps/**'
              - 'apps/web/**'
              - 'packages/design-tokens/**'
              - 'packages/schemas/**'
              - 'packages/shared/**'
              - 'packages/upc-contract/**'
              - 'packages/usda-contract/**'
              - 'packages/usda-schemas/**'
              - 'packages/wasm/**'
              - 'recipebridge/**'
            purchase_agent:
              - *shared
              - 'apps/purchase-agent/**'
            usda:
              - *shared
              - 'apps/usda-api/**'
              - 'packages/usda-contract/**'
              - 'packages/usda-schemas/**'
              - 'packages/worker-tracing/**'
            upc:
              - *shared
              - 'apps/upc-lookup/**'
              - 'packages/shared/**'
              - 'packages/upc-contract/**'
              - 'packages/usda-schemas/**'
              - 'packages/worker-tracing/**'
      - id: workers
        run: |
          workers=$(jq -nc \
            --argjson usda '${{ steps.filter.outputs.usda }}' \
            --argjson upc '${{ steps.filter.outputs.upc }}' \
            '[if $usda then "usda-api" else empty end, if $upc then "upc-lookup" else empty end]')
          echo "workers=$workers" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Build and deploy web
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check current main before building
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - uses: ./.github/actions/setup-web-env
        if: steps.current_main.outputs.current == 'true'
      - name: Build web Cloudflare bundle
        if: steps.current_main.outputs.current == 'true'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: main
        run: pnpm --filter @cubby/web run build:cf
      - name: Re-check current main before deployment
        if: steps.current_main.outputs.current == 'true'
        id: deploy_current
        uses: ./.github/actions/check-current-main
      - name: Deploy built web Worker
        if: steps.deploy_current.outputs.current == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    needs: scope
    if: needs.scope.outputs.workers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.scope.outputs.workers) }}
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check current main before building
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
      - name: Re-check current main before deployment
        if: steps.current_main.outputs.current == 'true'
        id: deploy_current
        uses: ./.github/actions/check-current-main
      - name: Deploy auxiliary Worker
        if: steps.deploy_current.outputs.current == 'true'
        run: pnpm --filter @cubby/${{ matrix.pkg }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88

  deploy-purchase-agent:
    name: Build and deploy purchase agent
    needs: [scope, deploy-web]
    if: >-
      always() &&
      needs.scope.outputs.purchase_agent == 'true' &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-purchase-agent-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check current main before building
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/purchase-agent..."
      - name: Re-check current main before deployment
        if: steps.current_main.outputs.current == 'true'
        id: deploy_current
        uses: ./.github/actions/check-current-main
      - name: Deploy private purchase-agent Worker
        if: steps.deploy_current.outputs.current == 'true'
        run: pnpm --filter @cubby/purchase-agent run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
