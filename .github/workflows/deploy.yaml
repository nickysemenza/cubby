name: Deploy

# Required PR CI gates merging. This workflow builds and deploys current main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/web"
          workspace-filter: "@cubby/web..."
          wasm: "restore"
          web-env: "true"
          build-command: "pnpm --filter @cubby/web run build:cf"
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # web's deploy:cf script (`build:cf && wrangler deploy`) would
          # rerun build:cf a second time here, so this stays on
          # wrangler-action calling wrangler directly instead of through
          # deploy:cf — see the composite's wrangler-action input doc.
          wrangler-action: "true"
          wrangler-command: "deploy --config dist/server/wrangler.json"
          working-directory: apps/web
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: "9f10f078d35d86c78dedece2300a6b88"

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: [upc-lookup, usda-api]
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/${{ matrix.pkg }}"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
          wasm: "false"
          deploy-command: "pnpm --filter @cubby/${{ matrix.pkg }} run deploy"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: "9f10f078d35d86c78dedece2300a6b88"

  deploy-purchase-agent:
    name: Build and deploy purchase agent
    needs: deploy-web
    if: >-
      always() &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-purchase-agent-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        with:
          package: "@cubby/purchase-agent"
          workspace-filter: "@cubby/purchase-agent..."
          wasm: "false"
          deploy-command: "pnpm --filter @cubby/purchase-agent run deploy"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: "9f10f078d35d86c78dedece2300a6b88"
