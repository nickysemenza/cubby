name: Deploy

# Required PR CI gates merging. This workflow builds and deploys current main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: "9f10f078d35d86c78dedece2300a6b88"

jobs:
  deploy-web:
    name: Build and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Reuse the same content-verified WASM artifacts as required PR CI.
      NX_CACHE_URL: ${{ secrets.NX_CACHE_URL }}
      NX_CACHE_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      AI_REFRESH_ACTIVATION_TOKEN: ${{ secrets.AI_REFRESH_ACTIVATION_TOKEN }}
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/deploy-worker
        id: deploy
        with:
          package: "@cubby/web"
          workspace-filter: "@cubby/web..."
          wasm: "restore"
          build-command: "pnpm --filter @cubby/web run build:cf"
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # web's deploy:cf script re-runs build:cf, which would duplicate the
          # build-command step above, so this deploys the already-built
          # bundle directly instead of going through deploy:cf.
          deploy-command: "pnpm --filter @cubby/web exec wrangler deploy --config dist/server/wrangler.json"
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      - name: Activate deployed AI prompt versions
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          [[ -n "$AI_REFRESH_ACTIVATION_TOKEN" ]] || { echo "::error::AI_REFRESH_ACTIVATION_TOKEN is required for activation"; exit 1; }
          release=$(git rev-parse --short HEAD)
          body=$(jq -n --arg release "$release" '{release:$release}')
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-max-time 90 --max-time 30 --retry-all-errors \
            -H "Authorization: Bearer $AI_REFRESH_ACTIVATION_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            https://cubby.nickysemenza.com/api/internal/ai-refresh/activate
