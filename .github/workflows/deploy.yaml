name: Deploy

# Local verification gates merging. This workflow only builds and deploys main.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scope:
    name: Changed Workers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      workers: ${{ steps.scope.outputs.workers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { classifyPaths } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci-scope.ts`)
            );
            let paths = ['unknown-change'];
            const before = context.payload.before;
            if (before && !/^0+$/.test(before)) {
              try {
                const diff = await exec.getExecOutput(
                  'git', ['diff', '--name-only', before, context.sha], { silent: true },
                );
                paths = diff.stdout.split('\n').filter(Boolean);
              } catch {
                core.warning('Changed paths unavailable; building every Worker.');
              }
            }
            const scope = classifyPaths(paths);
            core.setOutput('web', scope.web);
            core.setOutput('workers', JSON.stringify(scope.workers));

  deploy-web:
    name: Build and deploy web
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-cubby-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://cubby.nickysemenza.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check current main before building
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "restore"
          workspace-filter: "@cubby/web..."
      - uses: ./.github/actions/setup-web-env
        if: steps.current_main.outputs.current == 'true'
      - name: Build web Cloudflare bundle
        if: steps.current_main.outputs.current == 'true'
        env:
          CUBBY_SOURCE_COMMIT: ${{ github.sha }}
          CUBBY_SOURCE_BRANCH: main
        run: pnpm --filter @cubby/web run build:cf
      - name: Re-check current main before deployment
        if: steps.current_main.outputs.current == 'true'
        id: deploy_current
        uses: ./.github/actions/check-current-main
      - name: Deploy built web Worker
        if: steps.deploy_current.outputs.current == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9f10f078d35d86c78dedece2300a6b88
          command: deploy --config dist/server/wrangler.json
          workingDirectory: apps/web

  deploy-worker:
    name: Deploy ${{ matrix.pkg }} Worker
    needs: scope
    if: needs.scope.outputs.workers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.scope.outputs.workers) }}
    concurrency:
      group: deploy-${{ matrix.pkg }}-production
      cancel-in-progress: false
    environment:
      name: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check current main before building
        id: current_main
        uses: ./.github/actions/check-current-main
      - uses: ./.github/actions/setup-node-with-deps
        if: steps.current_main.outputs.current == 'true'
        with:
          wasm: "false"
          workspace-filter: "@cubby/${{ matrix.pkg }}..."
      - name: Re-check current main before deployment
        if: steps.current_main.outputs.current == 'true'
        id: deploy_current
        uses: ./.github/actions/check-current-main
      - name: Deploy auxiliary Worker
        if: steps.deploy_current.outputs.current == 'true'
        run: pnpm --filter @cubby/${{ matrix.pkg }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
