name: Dispatch PR journeys

# Runs the automatic Tester Army journey once a same-repository PR's CI
# passes, or when a journey label is added to a PR whose current head already
# passed. The `CI` workflow name below must match ci.yaml's.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  dispatch:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["tester-army", "tester-army:ios", "tester-army:import", "simulator-e2e"]'), github.event.label.name))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Only an open same-repository PR still at the tested head; a newer
          # push dispatches from its own CI run.
          pr="$(gh pr list --head "$HEAD_BRANCH" --state open --json number,headRefOid,isCrossRepository \
            --jq "map(select(.headRefOid == \"$HEAD_SHA\" and (.isCrossRepository | not)))[0].number // empty")"
          [[ -n "$pr" ]] || exit 0
          # A label added before CI passes waits for the CI completion event.
          conclusion="$(gh run list --workflow ci.yaml --event pull_request --commit "$HEAD_SHA" \
            --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          [[ "$conclusion" == success ]] || exit 0
          gh workflow run e2e-journeys.yaml --ref "$DEFAULT_BRANCH" \
            -f journey=tester-army-pr -f pull-request="$pr" -f revision="$HEAD_SHA"
