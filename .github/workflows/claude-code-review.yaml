name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optionally scope to certain paths:
    # paths: ["apps/**/*.ts", "apps/**/*.tsx", "packages/**/*.ts"]

jobs:
  claude-review:
    # Skip draft PRs and dependency-bot PRs
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticated via Max subscription (not API billing)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tracking comment with progress checkboxes + full PR context
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR following the conventions in CLAUDE.md. Post
            concise, actionable inline comments anchored to the diff. Skip
            nitpicks, style preferences, and praise. If the PR is clean, say
            so in one line.

            Pay particular attention to: correctness/logic bugs, the
            required-helpers table, React hook stability (useQueries
            `combine`), soft-delete/transaction usage, and security.

          # Inline-comment tool for line-level feedback + gh read commands
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
