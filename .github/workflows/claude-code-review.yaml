name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".vscode/**"
      - "cubby.code-workspace"
      - "LICENSE"

# A fresh push supersedes the review of the old SHA. Keeping this independent
# from CI means a slow remote cancellation cannot hold verification in pending.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip draft PRs and any bot-initiated run. claude-code-action hard-fails on
    # bot actors ("Workflow initiated by non-human actor"), so when this review's
    # own fix-push (or renovate/dependabot) re-triggers `synchronize`, skip rather
    # than fail. A job-level skip reports neutral, not red.
    if: |
      github.event.pull_request.draft == false &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@71d3414a2ac47c29d9b7d0da6ca01963a9a6e5fc # v1
        with:
          # Authenticated via Max subscription (not API billing)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Tracking comment with progress checkboxes + full PR context
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR following the conventions in CLAUDE.md. Post
            concise, actionable inline comments anchored to the diff. Skip
            nitpicks, style preferences, and praise. If the PR is clean, say
            so in one line.

            Pay particular attention to: correctness/logic bugs, the
            required-helpers table, React hook stability (useQueries
            `combine`), soft-delete/transaction usage, and security.

          # Inline-comment tool for line-level feedback + gh read commands
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
