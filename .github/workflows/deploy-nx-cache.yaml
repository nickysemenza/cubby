name: Deploy Nx cache

on:
  push:
    branches: [main]
    paths:
      - "apps/nx-cache/**"
      - ".github/workflows/deploy-nx-cache.yaml"
      - ".github/actions/setup-node-with-deps/**"
      - ".nvmrc"
      - ".npmrc"
      - ".pnpmfile.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cubby-nx-cache
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment:
      name: cloudflare
    steps:
      # A rerun deploys current main, never the triggering commit. Unrelated
      # later pushes must not suppress a pending cache change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: ./.github/actions/setup-node-with-deps
        with:
          workspace-filter: "@cubby/nx-cache"
      - run: pnpm --filter @cubby/nx-cache exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9f10f078d35d86c78dedece2300a6b88"
