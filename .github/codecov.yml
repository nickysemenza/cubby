coverage:
  status:
    project:
      default:
        target: auto
        # Tolerate small fluctuations (carryforward-flag noise, deleting code
        # with partial coverage) so the project gate only reds on a real
        # regression. Patch coverage still gates new/changed lines separately.
        threshold: 1%
ignore:
  - "*.config.*"
  - "scripts"
  - "tooling"
  - "src/components/ui" #shadcn/ui
  - "src/components/reui" # copied ReUI source
