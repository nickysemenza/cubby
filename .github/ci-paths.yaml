# Unknown non-documentation paths, including root/CI/toolchain configuration,
# select every lane. Manual verification bypasses filtering in ci.yaml.
full:
  - "**"
  - &notMarkdown "!**/*.@([mM][dD]|[mM][dD][xX]|[mM][aA][rR][kK][dD][oO][wW][nN])"
  - "!apps/{apple,web,mcp-apps,usda-api}/**"
  - "!packages/**"
  - "!cubby-ffi/**"
  - "!recipebridge/**"
  - "!Cargo.{toml,lock}"
  - "!docker-compose*"

validation:
  - "apps/{web,mcp-apps,usda-api}/**"
  - "packages/**"
  - "recipebridge/**"
  - "Cargo.{toml,lock}"
  - "docker-compose*"
  - *notMarkdown

generation:
  - "docs/todos.md"

web:
  - "apps/{web,mcp-apps}/**"
  - "packages/**"
  - "recipebridge/**"
  - "Cargo.{toml,lock}"
  - "docker-compose*"
  - *notMarkdown

# These Markdown files affect the running Worker, not just documentation.
webMarkdown:
  - "docs/README.md"
  - ".claude/skills/{purchase-import,product-enrichment,photo-inventory-import}/**"

auxiliary:
  - "apps/{mcp-apps,usda-api}/**"
  - "packages/**"
  - "recipebridge/**"
  - "Cargo.{toml,lock}"
  - *notMarkdown

rust:
  - "cubby-ffi/**"
  - "recipebridge/**"
  - "Cargo.{toml,lock}"
  - *notMarkdown

# Shared declarations and HTTP contracts generate the native client/catalog.
apple:
  - "apps/apple/**"
  - "cubby-ffi/**"
  - "recipebridge/**"
  - "Cargo.{toml,lock}"
  - "packages/{schemas,shared}/**"
  - "apps/web/src/contracts/**"
  - "apps/web/src/lib/http-api/**"
  - "apps/web/scripts/apple-preview-fixtures.ts"
  - "apps/web/src/lib/test/mock-schema.ts"
  - "apps/web/wrangler.jsonc"
  - "apps/web/tooling/wrangler-public-config.ts"
  - *notMarkdown

docs:
  - "**/*.@([mM][dD]|[mM][dD][xX]|[mM][aA][rR][kK][dD][oO][wW][nN])"

format:
  - "**/*.@([mM][dD]|[mM][dD][xX]|[mM][aA][rR][kK][dD][oO][wW][nN]|[yY][aA][mM][lL]|[yY][mM][lL]|[tT][oO][mM][lL])"

# Optional browser lane: purchase agent, import UI, and the coupled harness.
importE2e:
  - "apps/web/src/server/{purchase-import,purchase-agent}/**"
  - "apps/web/src/app/{purchases,runs}/**"
  - "apps/web/src/app/vendors/order-mail**"
  - "apps/web/src/routes/_authenticated/runs.**"
  - "apps/web/tooling/purchase-agent-**"
  - "apps/web/tooling/workerd-{harness,runtime}.ts"
  - "apps/web/tests/e2e/harness-services/purchase-**"
  - "apps/web/tests/e2e/purchase-import-run.spec.ts"
  - "apps/web/tests/e2e/e2e-{test,worker-runtime}.ts"
  - "apps/web/tests/e2e/fixtures-{core,mail}.ts"
  - "apps/web/playwright.config.ts"
  - ".claude/skills/{purchase-import,product-enrichment}/**"
