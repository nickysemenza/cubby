name: "Run Playwright"
description: >-
  Restores (or installs) the exact Chromium the installed @playwright/test
  expects, runs one browser lane, and uploads its report and traces.

inputs:
  command:
    description: "Shell command that runs the lane"
    required: true
  artifact:
    description: "Suffix of the uploaded playwright-<sha>-<suffix> artifact"
    required: true
  save-browser:
    description: "Save a freshly installed browser to the cache"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-playwright
      with:
        save-browser: ${{ inputs.save-browser }}
    - name: Run Playwright tests
      shell: bash
      run: ${{ inputs.command }}
    - name: Upload Playwright HTML report and traces
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-${{ github.sha }}-${{ inputs.artifact }}
        path: |
          apps/web/playwright-report/**
          !apps/web/playwright-report/run-manifest.json
          !apps/web/playwright-report/run-results.json
          !apps/web/playwright-report/SHA256SUMS
          !apps/web/playwright-report/workerd-logs/**
          apps/web/test-results/**/trace.zip
        if-no-files-found: warn
        retention-days: 7
    # The CI report job merges every shard's blob into one HTML report.
    - name: Upload Playwright blob
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-blob-${{ github.sha }}-${{ inputs.artifact }}
        path: apps/web/blob-report/**
        if-no-files-found: ignore
        retention-days: 7
