name: Reuse verified Worker build
description: Reuse a regular CI artifact for this exact commit; otherwise let the harness build normally.
runs:
  using: composite
  steps:
    - name: Find an existing build for this commit
      id: build
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Push builds use the commit itself. PR builds use a merge commit and
        # cannot satisfy the harness's exact-source provenance contract.
        runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs" \
          --method GET -f head_sha="$GITHUB_SHA" -f event=push \
          -f status=completed -f per_page=10 \
          --jq '.workflow_runs[] | select(.conclusion == "success") | .id')
        for run_id in $runs; do
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name == "worker-build" and .expired == false) | .id')
          if [[ -n "$artifact" ]]; then
            echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
            break
          fi
        done
    - name: Download existing Worker build
      if: steps.build.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: worker-build
        run-id: ${{ steps.build.outputs.run-id }}
        github-token: ${{ github.token }}
        path: .
    # Every consumer already verifies source revision/content and output hashes
    # with ensureWebBuild; missing, expired or invalid artifacts rebuild there.
