name: Setup Apple build cache
description: Restore shared simulator DerivedData with the matching Xcode toolchain.
outputs:
  save-matched-key:
    description: Matching key for save policy; initialize a new cache generation from legacy restores
    value: ${{ startsWith(steps.derived-data.outputs.cache-matched-key, 'xcode-dd-v2-') && steps.derived-data.outputs.cache-matched-key || '' }}
  toolchain-hash:
    value: ${{ steps.xcode-version.outputs.hash }}
    description: Xcode toolchain hash
  cache-key:
    value: ${{ steps.derived-data.outputs.cache-primary-key }}
    description: Primary DerivedData cache key
  cache-hit:
    value: ${{ steps.derived-data.outputs.cache-hit }}
    description: Exact cache hit
  matched-key:
    value: ${{ steps.derived-data.outputs.cache-matched-key }}
    description: Restored DerivedData key
runs:
  using: composite
  steps:
    - name: Compute Xcode version hash
      id: xcode-version
      uses: ./.github/actions/toolchain-hash
      with:
        command: xcodebuild -version
    - name: Ignore file-system inode changes in XCBuild
      shell: bash
      run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
    - name: Restore cached DerivedData
      id: derived-data
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        # Must list exactly the save step's paths: the cache version hashes them.
        path: |
          apps/apple/DerivedData
          !apps/apple/DerivedData/Logs
        key: xcode-dd-v2-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/CubbyKit/Package.resolved') }}-${{ hashFiles('apps/apple/App/**', 'apps/apple/CubbyKit/**') }}-${{ hashFiles('scripts/apple-check.sh', 'scripts/apple-simulator-build-cache.ts', 'apps/apple/scripts/prepare-project.sh', 'apps/web/tooling/sim-e2e.ts', '.github/workflows/ci.yaml') }}
        restore-keys: |
          xcode-dd-v2-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/CubbyKit/Package.resolved') }}-
          xcode-dd-v2-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-
          xcode-dd-v1-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/CubbyKit/Package.resolved') }}-
