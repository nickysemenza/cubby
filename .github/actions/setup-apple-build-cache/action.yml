name: Setup Apple build cache
description: Restore shared simulator DerivedData with the matching Xcode toolchain.
outputs:
  cache-paths:
    description: Shared compiled products and their resolved dependency metadata
    value: ${{ steps.paths.outputs.value }}
  save-matched-key:
    description: Matching key for the shared save policy
    value: ${{ startsWith(steps.derived-data.outputs.cache-matched-key, 'xcode-dd-v6-') && steps.derived-data.outputs.cache-matched-key || '' }}
  toolchain-hash:
    value: ${{ steps.xcode-version.outputs.hash }}
    description: Xcode toolchain hash
  cache-key:
    value: ${{ steps.derived-data.outputs.cache-primary-key }}
    description: Primary DerivedData cache key
  cache-hit:
    value: ${{ steps.derived-data.outputs.cache-hit }}
    description: Exact cache hit
  matched-key:
    value: ${{ steps.derived-data.outputs.cache-matched-key }}
    description: Restored DerivedData key
runs:
  using: composite
  steps:
    - name: Compute Xcode version hash
      id: xcode-version
      uses: ./.github/actions/toolchain-hash
      with:
        command: xcodebuild -version
    # App version/build settings affect products, not dependency module identity.
    - name: Hash the package graph
      id: packages
      shell: bash
      run: echo "hash=${{ hashFiles('apps/apple/packages.yml', 'apps/apple/CubbyKit/Package.swift', 'apps/apple/CubbyKit/Package.resolved', 'apps/apple/Package.resolved') }}" >> "$GITHUB_OUTPUT"
    - name: Define shared cache paths
      id: paths
      shell: bash
      run: |
        {
          echo 'value<<CACHE_PATHS'
          echo 'apps/apple/DerivedData'
          echo '!apps/apple/DerivedData/Logs'
          echo 'apps/apple/SourcePackages/workspace-state.json'
          echo 'CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
    - name: Restore cached DerivedData
      id: derived-data
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        # Must list exactly the save step's paths: the cache version hashes them.
        path: ${{ steps.paths.outputs.value }}
        # The host-test phase leaves .build here; it is not an app source input.
        # v6 excludes entries published by interrupted or failed builds.
        # Optional E2E can verify the bundle without restoring package clones.
        key: xcode-dd-v6-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ steps.packages.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/App/**', 'apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}-${{ hashFiles('scripts/apple-check.sh', 'scripts/apple-simulator-build-cache.ts', 'apps/apple/scripts/prepare-project.sh') }}
        # Keep incomplete entries from earlier generations out of the restore.
        restore-keys: |
          xcode-dd-v6-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-${{ steps.packages.outputs.hash }}-
          xcode-dd-v6-${{ runner.os }}-${{ steps.xcode-version.outputs.hash }}-

    # Explicit precompiled modules are keyed without header contents, so a
    # cache from another package graph reuses a stale binary-package module
    # (for example a Sentry bump fails with "SentryScope.h has been modified
    # since the module file was built"). Rebuild them; other products stay warm.
    - name: Drop precompiled modules from another package graph
      if: steps.derived-data.outputs.cache-matched-key != '' && !startsWith(steps.derived-data.outputs.cache-matched-key, format('xcode-dd-v6-{0}-{1}-{2}-', runner.os, steps.xcode-version.outputs.hash, steps.packages.outputs.hash))
      shell: bash
      run: |
        rm -rf apps/apple/DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules \
          apps/apple/DerivedData/ModuleCache.noindex
