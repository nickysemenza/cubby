name: "Check current main SHA"
description: "Reports whether this workflow still targets the current main commit"

outputs:
  current:
    description: "true when GITHUB_SHA is still refs/heads/main"
    value: ${{ steps.check.outputs.current }}
  sha:
    description: "The commit SHA represented by GITHUB_SHA (peels annotated tags)"
    value: ${{ steps.check.outputs.sha }}

runs:
  using: "composite"
  steps:
    - name: Compare workflow SHA with main
      id: check
      shell: bash
      run: |
        set -euo pipefail
        if ! workflow_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"; then
          echo "::error::Could not resolve $GITHUB_SHA to a commit"
          exit 1
        fi
        echo "sha=$workflow_sha" >> "$GITHUB_OUTPUT"
        if ! current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"; then
          echo "::error::Could not resolve refs/heads/main"
          exit 1
        fi
        if [[ -z "$current_sha" ]]; then
          echo "::error::Could not resolve refs/heads/main"
          exit 1
        fi
        if [[ "$current_sha" == "$workflow_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping stale deployment for $workflow_sha; main is $current_sha"
        fi
