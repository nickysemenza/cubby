name: "Setup Node.js with Dependencies"
description: "Sets up Node.js with caching and installs dependencies"
inputs:
  download-wasm:
    description: "Whether to download WASM artifact"
    required: false
    default: "false"
  workspace-filter:
    description: "Optional pnpm workspace filter for a narrower install"
    required: false
    default: ""
  cache-pnpm-store:
    description: "Whether actions/setup-node should restore and save the pnpm store"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      with:
        version: 10.34.1

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
        # An empty cache input avoids registering setup-node's post-job cache
        # save hook. This matters for container jobs, where compressing the pnpm
        # store can take longer than the filtered install it is meant to save.
        cache: ${{ inputs.cache-pnpm-store == 'true' && 'pnpm' || '' }}

    # NB: caching node_modules directly was tried and REVERTED — on a warm cache
    # hit, actions/cache restoring the linked node_modules tree (tens of
    # thousands of small files) was *slower* than this `pnpm install` against the
    # already-warm pnpm store (setup-node ~21s install vs ~35s restore). The
    # store cache (cache: "pnpm" above) makes install offline; the hardlink/
    # symlink step is fast. Don't reintroduce a node_modules cache.
    - name: Install dependencies
      env:
        WORKSPACE_FILTER: ${{ inputs.workspace-filter }}
      run: |
        if [[ -n "$WORKSPACE_FILTER" ]]; then
          pnpm install --frozen-lockfile --prefer-offline --filter "$WORKSPACE_FILTER"
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi
      shell: bash

    - name: Download WASM pkg artifact
      if: inputs.download-wasm == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: wasm-pkg
        path: packages/wasm
