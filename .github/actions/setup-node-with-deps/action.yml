name: "Setup Node.js with Dependencies"
description: "Sets up Node.js with caching and installs dependencies"
inputs:
  download-wasm:
    description: "Whether to download WASM artifact"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.34.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: "pnpm"

    # Cache the linked node_modules trees (root + every workspace), not just the
    # pnpm store. The store cache (cache: "pnpm" above) makes `pnpm install`
    # *offline*, but the link/symlink step still ran ~20s on every job. Keyed on
    # the lockfile, so any dependency change busts it and falls back to a real
    # install. On a hit we skip install entirely — pnpm's node_modules is
    # self-contained (relative symlinks into node_modules/.pnpm).
    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash

    - name: Download WASM pkg artifact
      if: inputs.download-wasm == 'true'
      uses: actions/download-artifact@v7
      with:
        name: wasm-pkg
        path: packages/wasm
