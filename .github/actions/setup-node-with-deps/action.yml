name: 'Setup Node.js with Dependencies'
description: 'Sets up Node.js with caching and installs dependencies'
inputs:
  download-wasm:
    description: 'Whether to download WASM artifact'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      shell: bash
    
    - name: Download WASM pkg artifact
      if: inputs.download-wasm == 'true'
      uses: actions/download-artifact@v4
      with:
        name: wasm-pkg
        path: recipebridge/pkg