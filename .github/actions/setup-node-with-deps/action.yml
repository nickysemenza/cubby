name: "Setup Node.js with Dependencies"
description: "Sets up Node.js and pnpm, installs dependencies, and optionally restores packages/wasm"
inputs:
  wasm:
    description: >-
      How to obtain packages/wasm. "restore" replays the Nx `wasm` target from
      the shared Nx cache and builds it with the runner's Rust on a miss.
      "false" skips it.
    required: false
    default: "false"
  workspace-filter:
    description: "Optional space-separated pnpm workspace filters for a narrower install"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The one remote-cache seam (docs/ci.md): the workflow exposes the
    # NX_CACHE_URL/NX_CACHE_TOKEN secrets, and Nx reads them under its own
    # names. A fork PR receives no secrets, so both stay unset and Nx uses
    # only its local cache.
    - name: Connect the shared Nx cache
      shell: bash
      run: |
        if [[ -n "${NX_CACHE_URL:-}" && -n "${NX_CACHE_TOKEN:-}" ]]; then
          # Nx fails a task on any remote-cache error other than a 404 miss,
          # so an unreachable cache must not be connected: lanes then run
          # for real against the local cache instead of failing.
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -H "authorization: Bearer $NX_CACHE_TOKEN" "$NX_CACHE_URL/v1/cache/0" || true)"
          if [[ "$status" != "404" && "$status" != "200" ]]; then
            echo "::warning::Shared Nx cache unavailable (HTTP $status); using the local cache only."
            exit 0
          fi
          {
            echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=$NX_CACHE_URL"
            echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=$NX_CACHE_TOKEN"
          } >> "$GITHUB_ENV"
        else
          echo "No shared Nx cache credentials; using the local cache only."
        fi

    # The version comes from package.json's packageManager.
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

    - name: Setup Node.js
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # A cold registry install beats restoring and saving a store cache, which
    # also evicts other entries from the 10 GB Actions cache (docs/ci.md).
    - name: Install dependencies
      env:
        WORKSPACE_FILTER: ${{ inputs.workspace-filter }}
      run: |
        if [[ -n "$WORKSPACE_FILTER" ]]; then
          read -r -a workspace_filters <<< "$WORKSPACE_FILTER"
          filter_args=()
          for workspace_filter in "${workspace_filters[@]}"; do
            filter_args+=(--filter "$workspace_filter")
          done
          pnpm install --frozen-lockfile --prefer-offline "${filter_args[@]}"
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi
      shell: bash

    # The Nx `wasm` target's key fingerprints the local crates and wasm-pack,
    # so a pass from any runner or Mac in the shared Nx cache restores
    # packages/wasm; a miss builds it here (scripts/build-wasm.sh).
    - name: Install wasm-pack
      if: inputs.wasm == 'restore'
      uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
      with:
        tool: wasm-pack
    - name: Restore or build packages/wasm
      if: inputs.wasm == 'restore'
      shell: bash
      run: pnpm exec nx run cubby-checks:wasm --outputStyle=stream
