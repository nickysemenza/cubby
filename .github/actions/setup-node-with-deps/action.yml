name: "Setup Node.js with Dependencies"
description: "Sets up Node.js with caching and installs dependencies"
inputs:
  wasm:
    description: >-
      How to obtain packages/wasm. "restore" restores it from the shared cache
      and builds it in-place on a miss (needs a compiler toolchain — do NOT use
      it in the Playwright container, which has none). "false" skips it.
    required: false
    default: "false"
  workspace-filter:
    description: "Optional space-separated pnpm workspace filters for a narrower install"
    required: false
    default: ""
  cache-pnpm-store:
    description: "Whether actions/setup-node should restore and save the pnpm store"
    required: false
    default: "true"
  web-env:
    description: >-
      Copy apps/web/.env.example to apps/web/.env for jobs that build or test
      the web app.
    required: false
    default: "false"

outputs:
  pnpm-store-cache:
    description: "pnpm-store cache state: hit, miss, or disabled"
    value: ${{ steps.pnpm-store-cache.outputs.state }}

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      with:
        version: 12.4.1

    - name: Setup Node.js
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
        # An empty cache input avoids registering setup-node's post-job cache
        # save hook. This matters for container jobs, where compressing the pnpm
        # store can take longer than the filtered install it is meant to save.
        cache: ${{ inputs.cache-pnpm-store == 'true' && 'pnpm' || '' }}

    - name: Report pnpm store cache
      id: pnpm-store-cache
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache-pnpm-store }}
        CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
      run: |
        if [[ "$CACHE_MODE" == "true" ]]; then
          cache_state="${CACHE_HIT:-miss}"
        else
          cache_state="disabled"
        fi
        printf 'pnpm-store cache: mode=%s state=%s\n' "$CACHE_MODE" "$cache_state" >> "$GITHUB_STEP_SUMMARY"
        echo "state=$cache_state" >> "$GITHUB_OUTPUT"

    # WASM is restored independently so consumers can start in parallel. See
    # docs/ci.md for the measured producer-job and cache tradeoffs.
    # This runs BEFORE `pnpm install`: `wasm-pack` recreates its --out-dir, so
    # building after install would blow away the node_modules links pnpm just
    # made into packages/wasm.
    - name: Restore cached WASM pkg
      if: inputs.wasm == 'restore'
      id: wasm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/wasm
        # Exact key only: a prefix hit would restore the wrong parser revision.
        key: wasm-pkg-${{ runner.os }}-${{ hashFiles('recipebridge/Cargo.toml', 'recipebridge/Cargo.lock', 'recipebridge/src/**', 'rust-toolchain.toml') }}

    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      if: inputs.wasm == 'restore' && steps.wasm-cache.outputs.cache-hit != 'true'
      with:
        cache: true
        # Must match CARGO_TARGET_DIR on the build step below.
        cache-workspaces: "recipebridge -> target"
        # wasm32 and native artifacts must not share a cache bucket.
        cache-key: wasm32

    - name: Install wasm-pack
      if: inputs.wasm == 'restore' && steps.wasm-cache.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2
      with:
        tool: wasm-pack

    - name: Build recipebridge WASM
      if: inputs.wasm == 'restore' && steps.wasm-cache.outputs.cache-hit != 'true'
      shell: bash
      # pnpm 12 otherwise installs dependencies before running this script,
      # breaking the WASM-before-install ordering above.
      run: wasm-pack build --scope cubby --out-dir ../packages/wasm recipebridge
      env:
        RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        # Match rust-cache's cache-workspaces above.
        CARGO_TARGET_DIR: ${{ github.workspace }}/recipebridge/target

    - name: Save WASM pkg to cache
      if: inputs.wasm == 'restore' && steps.wasm-cache.outputs.cache-hit != 'true'
      # Several jobs can miss and build concurrently; the first to finish wins
      # the key and the rest get a harmless 409. Never fail a test job over it.
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: packages/wasm
        key: wasm-pkg-${{ runner.os }}-${{ hashFiles('recipebridge/Cargo.toml', 'recipebridge/Cargo.lock', 'recipebridge/src/**', 'rust-toolchain.toml') }}

    # Recreating links from the pnpm store is faster than restoring node_modules;
    # measurements live in docs/ci.md.
    - name: Install dependencies
      env:
        WORKSPACE_FILTER: ${{ inputs.workspace-filter }}
      run: |
        if [[ -n "$WORKSPACE_FILTER" ]]; then
          read -r -a workspace_filters <<< "$WORKSPACE_FILTER"
          filter_args=()
          for workspace_filter in "${workspace_filters[@]}"; do
            filter_args+=(--filter "$workspace_filter")
          done
          pnpm install --frozen-lockfile --prefer-offline "${filter_args[@]}"
        else
          pnpm install --frozen-lockfile --prefer-offline
        fi
      shell: bash

    - name: Setup web environment variables
      if: inputs.web-env == 'true'
      shell: bash
      run: |
        cp apps/web/.env.example apps/web/.env
