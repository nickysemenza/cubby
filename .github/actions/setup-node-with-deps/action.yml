name: "Setup Node.js with Dependencies"
description: "Sets up Node.js with caching and installs dependencies"
inputs:
  download-wasm:
    description: "Whether to download WASM artifact"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.17.0

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "24"
        cache: "pnpm"

    # NB: caching node_modules directly was tried and REVERTED — on a warm cache
    # hit, actions/cache restoring the linked node_modules tree (tens of
    # thousands of small files) was *slower* than this `pnpm install` against the
    # already-warm pnpm store (setup-node ~21s install vs ~35s restore). The
    # store cache (cache: "pnpm" above) makes install offline; the hardlink/
    # symlink step is fast. Don't reintroduce a node_modules cache.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash

    - name: Download WASM pkg artifact
      if: inputs.download-wasm == 'true'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: wasm-pkg
        path: packages/wasm
