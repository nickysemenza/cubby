name: "Setup Apple FFI"
description: "Restores or builds the target-specific CubbyFFI framework and UniFFI shim"

inputs:
  targets:
    description: "CubbyFFI target set passed to build-rust.sh"
    required: true
  profile:
    description: "CubbyFFI Cargo profile passed to build-rust.sh"
    required: false
    default: "release"

runs:
  using: "composite"
  steps:
    - name: Configure Apple Rust build
      shell: bash
      run: |
        set -euo pipefail
        case '${{ inputs.targets }}' in
          all | sim | device | mac) ;;
          *)
            echo "::error::targets must be one of all|sim|device|mac"
            exit 1
            ;;
        esac
        case '${{ inputs.profile }}' in
          release | dist) ;;
          *)
            echo "::error::profile must be release or dist"
            exit 1
            ;;
        esac
        {
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/cubby-ffi/target-${{ inputs.targets }}-${{ inputs.profile }}"
          echo "CUBBY_FFI_PROFILE=${{ inputs.profile }}"
          echo "CUBBY_FFI_TARGETS=${{ inputs.targets }}"
        } >> "$GITHUB_ENV"

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        cache: true
        cache-workspaces: cubby-ffi -> target-${{ inputs.targets }}-${{ inputs.profile }}
        cache-key: apple-ffi-${{ inputs.targets }}-${{ inputs.profile }}

    - name: Install requested Apple Rust targets
      shell: bash
      run: |
        set -euo pipefail
        case '${{ inputs.targets }}' in
          all) rustup target add aarch64-apple-ios aarch64-apple-ios-sim ;;
          sim) rustup target add aarch64-apple-ios-sim ;;
          device) rustup target add aarch64-apple-ios ;;
          mac) : ;;
        esac

    - name: Compute Apple FFI cache key
      id: fingerprint
      shell: bash
      env:
        CUBBY_FFI_PROFILE: ${{ inputs.profile }}
        CUBBY_FFI_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        fingerprint="$(node scripts/ensure-apple-ffi.ts --fingerprint)"
        echo "key=apple-ffi-output-v1-${RUNNER_OS}-${{ inputs.targets }}-${{ inputs.profile }}-${fingerprint}" >> "$GITHUB_OUTPUT"

    - name: Restore target-specific Apple FFI output
      id: ffi-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          # The target/profile fingerprint marker lives inside this directory.
          apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
          apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift
        # Exact keys only: the marker inside the XCFramework must agree with
        # the Rust, Xcode, target, and profile fingerprint before reuse.
        key: ${{ steps.fingerprint.outputs.key }}

    - name: Build target-specific Apple FFI
      if: steps.ffi-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CUBBY_FFI_PROFILE: ${{ inputs.profile }}
        CUBBY_FFI_TARGETS: ${{ inputs.targets }}
      run: node scripts/ensure-apple-ffi.ts --build

    - name: Check committed UniFFI bindings
      shell: bash
      run: git diff --exit-code -- apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift

    - name: Save target-specific Apple FFI output
      if: success() && steps.ffi-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          # The target/profile fingerprint marker lives inside this directory.
          apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
          apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift
        key: ${{ steps.fingerprint.outputs.key }}
