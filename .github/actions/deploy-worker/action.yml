name: "Deploy a Cloudflare Worker"
description: >-
  Checks that this push is still current main (before building and again
  before deploying) and installs, optionally builds, migrates the production
  database, then deploys the Worker via its own deploy-command.
  The web deployment's concurrency/environment/
  timeout-minutes stay on the job because a composite action cannot own them.

inputs:
  package:
    description: "pnpm workspace package name, e.g. @cubby/web"
    required: true
  workspace-filter:
    description: "Space-separated pnpm workspace filters for setup-node-with-deps"
    required: true
  wasm:
    description: 'setup-node-with-deps "wasm" input: restore or false'
    required: false
    default: "false"
  build-command:
    description: "Shell command that builds the package. Skipped entirely when empty."
    required: false
    default: ""
  sentry-auth-token:
    description: >-
      Sentry org auth token for the build step's env. The web build uploads
      source maps with it; other packages leave this empty.
    required: false
    default: ""
  deploy-command:
    description: >-
      Shell command that deploys the package, using its package-local cf CLI
      devDependency. It may upload `$RUNNER_TEMP/source-release.json` as the
      version's secrets file.
    required: true
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  production-direct-database-url:
    description: "Direct Neon URL for production migrations"
    required: true
  production-migration-through:
    description: "Optional exact migration boundary for an operator-managed staged cutover"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # A newer push supersedes this one; only current main deploys.
    - name: Check current main before building
      id: current_main
      shell: bash
      run: |
        current="$(git ls-remote origin refs/heads/main | cut -f1)"
        [[ -n "$current" ]] || { echo "::error::Could not resolve refs/heads/main"; exit 1; }
        echo "current=$([[ "$current" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        [[ "$current" == "$GITHUB_SHA" ]] || echo "::notice::Skipping stale deployment for $GITHUB_SHA; main is $current"

    - uses: ./.github/actions/setup-node-with-deps
      if: steps.current_main.outputs.current == 'true'
      with:
        wasm: ${{ inputs.wasm }}
        workspace-filter: ${{ inputs.workspace-filter }}

    - name: Build ${{ inputs.package }}
      if: steps.current_main.outputs.current == 'true' && inputs.build-command != ''
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: ${{ inputs.build-command }}

    - name: Describe the source deployment
      if: steps.current_main.outputs.current == 'true'
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/source-prs.json"
        python3 - <<'PYTHON'
        import html
        import json
        import os
        import pathlib
        import subprocess
        import uuid

        env = os.environ
        sha = env["GITHUB_SHA"]
        repository = f'{env["GITHUB_SERVER_URL"]}/{env["GITHUB_REPOSITORY"]}'
        run = f'{repository}/actions/runs/{env["GITHUB_RUN_ID"]}/attempts/{env["GITHUB_RUN_ATTEMPT"]}'
        subject, author = subprocess.check_output(
            ["git", "show", "-s", "--format=%s%n%an", sha, "--"], text=True
        ).strip().split("\n", 1)
        prs = json.loads(pathlib.Path(env["RUNNER_TEMP"], "source-prs.json").read_text())
        pr = next((pr for pr in prs if pr["merged_at"] and pr["base"]["ref"] == "main"
                   and pr["merge_commit_sha"] == sha), None)
        attribution = f'PR #{pr["number"]} by @{pr["user"]["login"]}: {pr["html_url"]}' if pr else f'Commit author: {author}'
        # Preserve links before truncating the subject to Cloudflare's 1000-byte limit.
        message = f'{attribution}\nDeployed by @{env["GITHUB_ACTOR"]}; run by @{env["GITHUB_TRIGGERING_ACTOR"]}\n{run}\n{subject}'
        message = message.encode("utf-8")[:1000].decode("utf-8", errors="ignore")
        delimiter = uuid.uuid4().hex
        with open(env["GITHUB_OUTPUT"], "a") as output:
            output.write(f'tag={sha}\nmessage<<{delimiter}\n{message}\n{delimiter}\n')
        with open(env["GITHUB_STEP_SUMMARY"], "a") as summary:
            summary.write(f'### Production deployment\n\nSource: [{sha}]({repository}/commit/{sha})\n\n')
            summary.write(f'{html.escape(subject)}\n\n{html.escape(attribution)}\n\n[Deployment run]({run})\n\n')
        PYTHON

    - name: Apply production migrations
      if: steps.current_main.outputs.current == 'true'
      shell: bash
      env:
        PRODUCTION_DIRECT_DATABASE_URL: ${{ inputs.production-direct-database-url }}
        PRODUCTION_MIGRATION_THROUGH: ${{ inputs.production-migration-through }}
      run: |
        args=(--target=production)
        if [[ -n "$PRODUCTION_MIGRATION_THROUGH" ]]; then
          args+=("--through=$PRODUCTION_MIGRATION_THROUGH")
        fi
        pnpm --filter "${{ inputs.package }}" db:migrate "${args[@]}"

    # Stops a deploy whose build or migration outlived a newer push.
    - name: Re-check current main before deployment
      if: steps.current_main.outputs.current == 'true'
      id: deploy_current
      shell: bash
      run: |
        current="$(git ls-remote origin refs/heads/main | cut -f1)"
        [[ -n "$current" ]] || { echo "::error::Could not resolve refs/heads/main"; exit 1; }
        echo "current=$([[ "$current" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        [[ "$current" == "$GITHUB_SHA" ]] || echo "::notice::Skipping stale deployment for $GITHUB_SHA; main is $current"

    # Release identity is a deploy-time Worker value, never bundle content,
    # so the build output is identical across commits with the same sources.
    - name: Record source release
      if: steps.deploy_current.outputs.current == 'true'
      shell: bash
      run: node apps/web/tooling/source-identity.ts --branch=main > "$RUNNER_TEMP/source-release.json"

    - name: Deploy ${{ inputs.package }}
      if: steps.deploy_current.outputs.current == 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CF_DEPLOY_TAG: ${{ steps.release.outputs.tag }}
        CF_DEPLOY_MESSAGE: ${{ steps.release.outputs.message }}
      run: ${{ inputs.deploy-command }}
