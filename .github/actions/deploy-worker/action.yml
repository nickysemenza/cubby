name: "Deploy a Cloudflare Worker"
description: >-
  Checks that this push is still current main (before building and again
  before deploying) and installs, optionally builds, migrates the production
  database, then deploys the Worker via its own deploy-command.
  The web deployment's concurrency/environment/
  timeout-minutes stay on the job because a composite action cannot own them.

inputs:
  package:
    description: "pnpm workspace package name, e.g. @cubby/web"
    required: true
  workspace-filter:
    description: "Space-separated pnpm workspace filters for setup-node-with-deps"
    required: true
  wasm:
    description: 'setup-node-with-deps "wasm" input: restore or false'
    required: false
    default: "false"
  build-command:
    description: "Shell command that builds the package. Skipped entirely when empty."
    required: false
    default: ""
  sentry-auth-token:
    description: >-
      Sentry org auth token for the build step's env. The web build uploads
      source maps with it; other packages leave this empty.
    required: false
    default: ""
  deploy-command:
    description: >-
      Shell command that deploys the package, using its package-local cf CLI
      devDependency.
    required: true
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  production-direct-database-url:
    description: "Direct Neon URL for production migrations"
    required: true
  production-migration-through:
    description: "Optional exact migration boundary for an operator-managed staged cutover"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # A newer push supersedes this one; only current main deploys.
    - name: Check current main before building
      id: current_main
      shell: bash
      run: |
        current="$(git ls-remote origin refs/heads/main | cut -f1)"
        [[ -n "$current" ]] || { echo "::error::Could not resolve refs/heads/main"; exit 1; }
        echo "current=$([[ "$current" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        [[ "$current" == "$GITHUB_SHA" ]] || echo "::notice::Skipping stale deployment for $GITHUB_SHA; main is $current"

    - uses: ./.github/actions/setup-node-with-deps
      if: steps.current_main.outputs.current == 'true'
      with:
        wasm: ${{ inputs.wasm }}
        workspace-filter: ${{ inputs.workspace-filter }}

    - name: Build ${{ inputs.package }}
      if: steps.current_main.outputs.current == 'true' && inputs.build-command != ''
      shell: bash
      env:
        CUBBY_SOURCE_COMMIT: ${{ github.sha }}
        CUBBY_SOURCE_BRANCH: main
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: ${{ inputs.build-command }}

    - name: Apply production migrations
      if: steps.current_main.outputs.current == 'true'
      shell: bash
      env:
        PRODUCTION_DIRECT_DATABASE_URL: ${{ inputs.production-direct-database-url }}
        PRODUCTION_MIGRATION_THROUGH: ${{ inputs.production-migration-through }}
      run: |
        args=(--target=production)
        if [[ -n "$PRODUCTION_MIGRATION_THROUGH" ]]; then
          args+=("--through=$PRODUCTION_MIGRATION_THROUGH")
        fi
        pnpm --filter "${{ inputs.package }}" db:migrate "${args[@]}"

    # Stops a deploy whose build or migration outlived a newer push.
    - name: Re-check current main before deployment
      if: steps.current_main.outputs.current == 'true'
      id: deploy_current
      shell: bash
      run: |
        current="$(git ls-remote origin refs/heads/main | cut -f1)"
        [[ -n "$current" ]] || { echo "::error::Could not resolve refs/heads/main"; exit 1; }
        echo "current=$([[ "$current" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        [[ "$current" == "$GITHUB_SHA" ]] || echo "::notice::Skipping stale deployment for $GITHUB_SHA; main is $current"

    - name: Deploy ${{ inputs.package }}
      if: steps.deploy_current.outputs.current == 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: ${{ inputs.deploy-command }}
