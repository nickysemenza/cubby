name: "Setup Apple Tools"
description: >-
  Installs XcodeGen (and optionally sentry-cli) and restores the
  cached SPM package clones used by the Apple jobs, so a warm cache never
  reclones Sentry/GRDB/Nuke.

outputs:
  spm-clones-cache-hit:
    description: "true when the SPM clone cache matched exactly"
    value: ${{ steps.spm-cache.outputs.cache-hit }}
  spm-clones-cache-matched-key:
    description: "Key the SPM clones were restored from (exact or prefix); empty on a full miss"
    value: ${{ steps.spm-cache.outputs.cache-matched-key }}
  spm-clones-cache-key:
    description: "Key to save the SPM clones under"
    value: ${{ steps.spm-cache.outputs.cache-primary-key }}

inputs:
  restore-spm-clones:
    description: Restore package checkouts for jobs that normally compile
    required: false
    default: "true"
  sentry-cli:
    description: "Also install getsentry/tools/sentry-cli (needed only for archive builds)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen

    - name: Install sentry-cli
      if: inputs.sentry-cli == 'true'
      shell: bash
      run: brew install getsentry/tools/sentry-cli

    # App package versions float within their declared ranges. Xcode's normal
    # resolver fetches any delta from an advisory dependency clone cache.
    - name: Restore cached SPM clones
      id: spm-cache
      if: inputs.restore-spm-clones == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: apps/apple/SourcePackages
        key: spm-clones-v2-${{ runner.os }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved', 'apps/apple/Package.resolved', 'apps/apple/packages.yml') }}
        restore-keys: |
          spm-clones-v2-${{ runner.os }}-
          spm-clones-v1-${{ runner.os }}-
