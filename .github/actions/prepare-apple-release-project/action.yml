name: "Prepare Apple release project"
description: >-
  Regenerates Cubby.xcodeproj over the generated Swift inputs the caller
  downloaded (the `apple-generated` artifact). Shared by both legs of the
  apple-testflight archive matrix.

runs:
  using: "composite"
  steps:
    - name: Generate the Xcode project
      shell: bash
      run: apps/apple/scripts/prepare-project.sh
