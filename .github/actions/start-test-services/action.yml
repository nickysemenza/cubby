name: "Start test database services"
description: >-
  Starts PostgreSQL 17 with pgvector (and optionally IntegreSQL) on localhost
  5432 and 5000, the endpoints scripts/test-services.ts uses in external mode.
  A composite action cannot declare `services:`, so this runs the same images
  the jobs previously declared inline and waits until they answer.

inputs:
  integresql:
    description: "Also start IntegreSQL (needed by the integration and E2E tiers)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Start PostgreSQL and IntegreSQL
      shell: bash
      env:
        START_INTEGRESQL: ${{ inputs.integresql }}
        # Keep the IntegreSQL digest aligned with scripts/test-services.ts.
        INTEGRESQL_IMAGE: ghcr.io/allaboutapps/integresql@sha256:66b7433399f1907bad9e4b7cc7bd528ed4ebfccddecb8fd65da4af4d06a68c5a
      run: |
        set -euo pipefail
        # Job `services:` pulled and started their containers before the first
        # step too; pulling both images in parallel is the only change.
        docker pull --quiet pgvector/pgvector:pg17 &
        if [ "$START_INTEGRESQL" = "true" ]; then
          docker pull --quiet "$INTEGRESQL_IMAGE" &
        fi
        wait
        docker network create cubby-test
        docker run -d --name postgres --network cubby-test -p 5432:5432 \
          -e POSTGRES_USER=postgres -e POSTGRES_DB=cubby \
          -e POSTGRES_HOST_AUTH_METHOD=trust \
          --health-cmd "pg_isready -U postgres" --health-interval 2s \
          --health-timeout 5s --health-retries 10 --health-start-period 3s \
          pgvector/pgvector:pg17
        if [ "$START_INTEGRESQL" = "true" ]; then
          docker run -d --name integresql --network cubby-test -p 5000:5000 \
            -e PGHOST=postgres -e PGUSER=postgres -e PGPASSWORD=password \
            "$INTEGRESQL_IMAGE"
        fi
        for _ in $(seq 1 60); do
          status="$(docker inspect -f '{{.State.Health.Status}}' postgres)"
          [ "$status" = healthy ] && break
          sleep 1
        done
        if [ "$status" != healthy ]; then
          docker logs postgres
          echo "::error::PostgreSQL did not become healthy"
          exit 1
        fi
        if [ "$START_INTEGRESQL" = "true" ]; then
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:5000/ && exit 0
            sleep 1
          done
          docker logs integresql
          echo "::error::IntegreSQL did not answer on port 5000"
          exit 1
        fi
