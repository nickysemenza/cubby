name: "Select Xcode"
description: >-
  Selects the Xcode named in apps/apple/.xcode-version when the runner image
  has it. The Apple Nx cache key hashes `xcodebuild -version`, so a developer
  Mac's passing result only satisfies CI when both use the same Xcode
  (docs/adr/0009-content-hash-merge-gate.md). Without it, the image default
  stays selected and the Apple lanes build instead of reusing a local result.

runs:
  using: "composite"
  steps:
    - name: Select pinned Xcode
      shell: bash
      run: |
        version="$(tr -d '[:space:]' < apps/apple/.xcode-version)"
        app="/Applications/Xcode_${version}.app"
        if [ -d "$app" ]; then
          sudo xcode-select -s "$app/Contents/Developer"
        else
          echo "::warning::Xcode ${version} is not on this runner image; using $(xcodebuild -version | head -1)"
        fi
        xcodebuild -version
