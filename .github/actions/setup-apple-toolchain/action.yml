name: Setup Apple Toolchain
description: Select the released Xcode 27 SDK before native builds and cache fingerprints.
runs:
  using: composite
  steps:
    - name: Select Xcode 27
      shell: bash
      run: |
        sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer
        xcodebuild -version
        xcrun swift --version
