name: Setup Apple test runner cache
description: Restore validated Apple runner products and Simulator AX helper binaries.
inputs:
  toolchain-hash:
    required: true
    description: Xcode version hash from the Apple build cache setup
outputs:
  cache-paths:
    value: ${{ steps.paths.outputs.paths }}
    description: Certified runner products and snapshot helpers shared by restore and save
  cache-key:
    value: ${{ steps.runner.outputs.cache-primary-key }}
    description: Primary test runner cache key
  cache-hit:
    value: ${{ steps.runner.outputs.cache-hit }}
    description: Exact test runner cache hit
  matched-key:
    value: ${{ steps.runner.outputs.cache-matched-key }}
    description: Restored test runner key
runs:
  using: composite
  steps:
    - id: host-version
      shell: bash
      run: echo "hash=$({ sw_vers -productVersion; sw_vers -buildVersion; } 2>&1 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    # The SDK certifies products and metadata. Xcode build databases and
    # workspace state are host-specific and must not cross runners.
    - id: paths
      shell: bash
      run: |
        cat >> "$GITHUB_OUTPUT" <<'EOF'
        paths<<RUNNER_CACHE_PATHS
        ~/.agent-device/apple-runner/derived/**/Build/Products
        ~/.agent-device/apple-runner/derived/**/.agent-device-runner-cache.json
        !~/.agent-device/apple-runner/derived/**/AgentDeviceRunner.env.session-*
        ~/.agent-device/snapshot-source/*/snapshot-bridge
        ~/.agent-device/snapshot-source/*/manifest.json
        !~/.agent-device/snapshot-source/.*/**
        RUNNER_CACHE_PATHS
        EOF
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: runner
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: agent-device-apple-runner-v5-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain-hash }}-${{ steps.host-version.outputs.hash }}-${{ hashFiles('.github/actions/setup-apple-test-runner-cache/action.yml', '.github/actions/save-apple-test-runner-cache/action.yml', 'node_modules/agent-device/package.json', 'patches/agent-device@*.patch') }}
