name: Setup Apple test runner cache
description: Restore agent-device's validated Apple test runner build products.
inputs:
  toolchain-hash:
    required: true
    description: Xcode version hash from the Apple build cache setup
outputs:
  cache-key:
    value: ${{ steps.runner.outputs.cache-primary-key }}
    description: Primary test runner cache key
  cache-hit:
    value: ${{ steps.runner.outputs.cache-hit }}
    description: Exact test runner cache hit
  matched-key:
    value: ${{ steps.runner.outputs.cache-matched-key }}
    description: Restored test runner key
runs:
  using: composite
  steps:
    # The SDK revalidates its runner source, Xcode/SDK and build settings on use.
    # Leases live beside derived data; per-session launch files live within it.
    # Restore only compiled products and metadata, never live process state.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: runner
      with:
        path: |
          ~/.agent-device/apple-runner/derived
          !~/.agent-device/apple-runner/derived/**/Logs
          !~/.agent-device/apple-runner/derived/**/TestResults
          !~/.agent-device/apple-runner/derived/**/*.log
          !~/.agent-device/apple-runner/derived/**/AgentDeviceRunner.env.session-*
          !~/.agent-device/apple-runner/derived/**/lock
          !~/.agent-device/apple-runner/derived/**/*.lock
        key: agent-device-apple-runner-v3-${{ runner.os }}-${{ inputs.toolchain-hash }}-${{ hashFiles('node_modules/agent-device/package.json', 'patches/agent-device@0.21.20.patch') }}
