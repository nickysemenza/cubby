name: Setup Apple
description: >-
  Prepare a macOS runner for a native build: select the .xcode-version Xcode, install the
  web tooling workspace, restore or build the CubbyFFI
  slices, install the Apple tools with an optional SPM clone cache, and restore
  the shared simulator compilation cache.
inputs:
  ffi-targets: { required: true, description: build-rust.sh target set }
  ffi-profile: { default: release, description: build-rust.sh Cargo profile }
  node: { default: "true", description: Install Node and the workspace }
  wasm: { default: "false", description: setup-node-with-deps wasm mode }
  spm-cache: { default: "true", description: Restore app package clones }
  xcodegen: { default: "true", description: Install XcodeGen }
  sentry-cli: { default: "false", description: Install sentry-cli for archives }
  build-cache:
    { default: "false", description: Restore simulator compilation cache }
  workspace-filter:
    {
      default: "cubby @cubby/web...",
      description: pnpm workspace filters for native contract generation,
    }
outputs:
  toolchain-hash: { value: "${{ steps.toolchain.outputs.hash }}" }
  spm-clones-cache-hit: { value: "${{ steps.spm-cache.outputs.cache-hit }}" }
  spm-clones-cache-matched-key:
    { value: "${{ steps.spm-cache.outputs.cache-matched-key }}" }
  spm-clones-cache-key:
    { value: "${{ steps.spm-cache.outputs.cache-primary-key }}" }
  cache-paths: { value: "${{ steps.paths.outputs.value }}" }
  cache-key: { value: "${{ steps.derived-data.outputs.cache-primary-key }}" }
  cache-hit: { value: "${{ steps.derived-data.outputs.cache-hit }}" }
  save-matched-key:
    {
      value: "${{ startsWith(steps.derived-data.outputs.cache-matched-key, 'xcode-dd-v7-') && steps.derived-data.outputs.cache-matched-key || '' }}",
    }
runs:
  using: composite
  steps:
    # Select the released SDK before native builds and cache fingerprints; a
    # compiler upgrade must never restore objects built by the old one.
    - name: Select Xcode
      id: toolchain
      shell: bash
      run: |
        sudo xcode-select --switch "/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
        xcodebuild -version
        xcrun swift --version
        echo "hash=$(xcodebuild -version 2>&1 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - if: inputs.node == 'true'
      uses: ./.github/actions/setup-node-with-deps
      with:
        wasm: ${{ inputs.wasm }}
        workspace-filter: ${{ inputs.workspace-filter }}

    - name: Configure Apple Rust build
      shell: bash
      env:
        TARGETS: ${{ inputs.ffi-targets }}
        PROFILE: ${{ inputs.ffi-profile }}
      run: |
        set -euo pipefail
        case "$TARGETS" in
          all | sim | device | mac) ;;
          *)
            echo "::error::ffi-targets must be one of all|sim|device|mac"
            exit 1
            ;;
        esac
        case "$PROFILE" in
          release | dist) ;;
          *)
            echo "::error::ffi-profile must be release or dist"
            exit 1
            ;;
        esac
        {
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target-$TARGETS-$PROFILE"
          echo "CUBBY_FFI_PROFILE=$PROFILE"
          echo "CUBBY_FFI_TARGETS=$TARGETS"
          echo "CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0}"
          echo "CARGO_PROFILE_DEV_DEBUG=${CARGO_PROFILE_DEV_DEBUG:-0}"
          echo "CARGO_TERM_COLOR=${CARGO_TERM_COLOR:-always}"
          echo "RUST_BACKTRACE=${RUST_BACKTRACE:-short}"
          echo "CARGO_UNSTABLE_SPARSE_REGISTRY=${CARGO_UNSTABLE_SPARSE_REGISTRY:-true}"
          echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=${CARGO_REGISTRIES_CRATES_IO_PROTOCOL:-sparse}"
          echo "CARGO_BUILD_WARNINGS=${CARGO_BUILD_WARNINGS:-deny}"
        } >> "$GITHUB_ENV"

    # rustup reads rust-toolchain.toml. Keep the real compiler installed before
    # fingerprinting, but defer target libraries and Cargo build caches to a miss.
    - name: Prepare Apple Rust compiler
      shell: bash
      run: |
        rustup toolchain install --profile minimal --no-self-update
        rustc -vV

    - name: Compute Apple FFI cache key
      id: fingerprint
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(node scripts/ensure.ts apple-ffi --fingerprint)"
        echo "key=apple-ffi-output-v1-${RUNNER_OS}-${CUBBY_FFI_TARGETS}-${CUBBY_FFI_PROFILE}-${fingerprint}" >> "$GITHUB_OUTPUT"
        echo "CUBBY_FFI_SETUP_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

    - name: Restore target-specific Apple FFI output
      id: ffi-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          # The target/profile fingerprint marker lives inside this directory.
          apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
          apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift
        # Exact keys only: the marker inside the XCFramework must agree with
        # the Rust, Xcode, target, and profile fingerprint before reuse.
        key: ${{ steps.fingerprint.outputs.key }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: steps.ffi-cache.outputs.cache-hit != 'true'
      with:
        workspaces: . -> target-${{ inputs.ffi-targets }}-${{ inputs.ffi-profile }}
        key: apple-ffi-${{ inputs.ffi-targets }}-${{ inputs.ffi-profile }}
        cache-on-failure: false

    - name: Install requested Apple Rust targets
      if: steps.ffi-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "$CUBBY_FFI_TARGETS" in
          all) rustup target add aarch64-apple-ios aarch64-apple-ios-sim ;;
          sim) rustup target add aarch64-apple-ios-sim ;;
          device) rustup target add aarch64-apple-ios ;;
          mac) : ;;
        esac

    # CI and journeys install Nx; archive jobs build before installing JS
    # deps. Reuse the shared artifact cache whenever the workspace is available.
    - name: Build target-specific Apple FFI
      if: steps.ffi-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [[ "$(node scripts/ensure.ts apple-ffi --fingerprint)" != "$CUBBY_FFI_SETUP_FINGERPRINT" ]]; then
          echo "::error::Rust setup changed the Apple FFI build fingerprint"
          exit 1
        fi
        if node --input-type=module -e 'import.meta.resolve("nx/bin/nx.js")' >/dev/null 2>&1; then
          node scripts/ensure.ts apple-ffi
        else
          node scripts/ensure.ts apple-ffi --build
        fi

    - name: Check committed UniFFI bindings
      shell: bash
      run: git diff --exit-code -- apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift

    - name: Save target-specific Apple FFI output
      if: success() && steps.ffi-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          # The target/profile fingerprint marker lives inside this directory.
          apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework
          apps/apple/CubbyKit/Sources/CubbyFFI/cubby_ffi.swift
        key: ${{ steps.fingerprint.outputs.key }}

    # The host package build doesn't need XcodeGen.
    - name: Install XcodeGen
      if: inputs.xcodegen == 'true'
      shell: bash
      run: brew install xcodegen

    - name: Install sentry-cli
      if: inputs.sentry-cli == 'true'
      shell: bash
      run: brew install getsentry/tools/sentry-cli

    # App package versions float within their declared ranges. Xcode's normal
    # resolver fetches any delta from an advisory dependency clone cache, so a
    # warm cache never reclones Sentry/GRDB/Nuke.
    - name: Restore cached SPM clones
      if: inputs.spm-cache == 'true'
      id: spm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: apps/apple/SourcePackages
        key: spm-clones-v2-${{ runner.os }}-${{ hashFiles('apps/apple/CubbyKit/Package.resolved', 'apps/apple/Package.resolved', 'apps/apple/packages.yml') }}
        restore-keys: |
          spm-clones-v2-${{ runner.os }}-
          spm-clones-v1-${{ runner.os }}-

    # App version/build settings affect products, not dependency module identity.
    # The generated CubbyFFI header is a module input like a binary package: a
    # changed FFI surface must miss compiled entries for the old functions.
    - name: Hash the package graph
      id: packages
      if: inputs.build-cache == 'true'
      shell: bash
      run: echo "hash=${{ hashFiles('apps/apple/packages.yml', 'apps/apple/CubbyKit/Package.swift', 'apps/apple/CubbyKit/Package.resolved', 'apps/apple/Package.resolved', 'apps/apple/CubbyKit/Frameworks/CubbyFFI.xcframework/*/Headers/*.h') }}" >> "$GITHUB_OUTPUT"
    - name: Define shared cache paths
      id: paths
      if: inputs.build-cache == 'true'
      shell: bash
      run: |
        {
          echo 'value<<CACHE_PATHS'
          echo 'apps/apple/DerivedData/CompilationCache.noindex'
          echo 'CACHE_PATHS'
        } >> "$GITHUB_OUTPUT"
    - name: Restore cached simulator compilation
      id: derived-data
      if: inputs.build-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        # Must list exactly the save step's paths: the cache version hashes them.
        path: ${{ steps.paths.outputs.value }}
        # Generated host products are not simulator compilation inputs.
        # Only successful compiler cache entries cross runners.
        key: xcode-dd-v7-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ steps.packages.outputs.hash }}-${{ hashFiles('apps/apple/project.yml', 'apps/apple/App/**', 'apps/apple/CubbyKit/**', '!apps/apple/CubbyKit/.build/**') }}-${{ hashFiles('apps/apple/tooling/apple-check.sh', 'apps/apple/tooling/apple.ts') }}
        # Keep incomplete entries from earlier generations out of the restore.
        restore-keys: |
          xcode-dd-v7-${{ runner.os }}-${{ steps.toolchain.outputs.hash }}-${{ steps.packages.outputs.hash }}-
