name: "Release Cubby Apple apps"
description: "Signs, archives, verifies, and exports or uploads the iOS and macOS apps"

inputs:
  version:
    description: "MARKETING_VERSION for both apps"
    required: true
  ios-build-number:
    description: "CURRENT_PROJECT_VERSION for iOS"
    required: true
  macos-build-number:
    description: "CURRENT_PROJECT_VERSION for macOS"
    required: true
  mode:
    description: "validate exports artifacts; upload sends both archives to App Store Connect"
    required: true
  api-key-p8:
    description: "App Store Connect API private key contents"
    required: true
  api-key-id:
    description: "App Store Connect API key ID"
    required: true
  api-issuer-id:
    description: "App Store Connect API issuer ID"
    required: true
  p12-base64:
    description: "Apple Distribution and Mac Installer Distribution identities"
    required: true
  p12-password:
    description: "Password for p12-base64"
    required: true
  sentry-auth-token:
    description: "Sentry org token used by the archive dSYM phase"
    required: true

runs:
  using: "composite"
  steps:
    - name: Validate release inputs
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        IOS_BUILD_NUMBER: ${{ inputs.ios-build-number }}
        MACOS_BUILD_NUMBER: ${{ inputs.macos-build-number }}
        MODE: ${{ inputs.mode }}
        API_KEY_P8: ${{ inputs.api-key-p8 }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_ISSUER_ID: ${{ inputs.api-issuer-id }}
        P12_BASE64: ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: |
        set -euo pipefail
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$IOS_BUILD_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$MACOS_BUILD_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ "$MODE" == "validate" || "$MODE" == "upload" ]]
        for value in API_KEY_P8 API_KEY_ID API_ISSUER_ID P12_BASE64 P12_PASSWORD SENTRY_AUTH_TOKEN; do
          [[ -n "${!value:-}" ]] || {
            echo "::error::Required Apple release credential $value is empty."
            exit 1
          }
        done

    - uses: ./.github/actions/setup-node-with-deps
      with:
        wasm: "false"
        cache-pnpm-store: "false"

    - uses: ./.github/actions/setup-apple-ffi
      with:
        targets: all
        profile: dist

    - name: Install release tools
      shell: bash
      run: brew install xcodegen getsentry/tools/sentry-cli

    - name: Generate the Xcode project
      shell: bash
      run: |
        set -euo pipefail
        apps/apple/scripts/generate-openapi.sh
        git diff --exit-code -- \
          apps/apple/CubbyKit/Sources/CubbyAPI \
          apps/apple/CubbyKit/Sources/CubbyKit/Generated \
          apps/apple/openapi/openapi-generator-config.yaml
        xcodegen generate --spec apps/apple/project.yml --use-cache

    - name: Write temporary service credentials
      shell: bash
      env:
        API_KEY_P8: ${{ inputs.api-key-p8 }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: |
        set -euo pipefail
        api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
        printf '%s' "$API_KEY_P8" > "$api_key_path"
        chmod 600 "$api_key_path"
        echo "ASC_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
        printf '[auth]\ntoken=%s\n' "$SENTRY_AUTH_TOKEN" > "$HOME/.sentryclirc"
        chmod 600 "$HOME/.sentryclirc"

    - name: Import App Store signing identities
      uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
      with:
        p12-file-base64: ${{ inputs.p12-base64 }}
        p12-password: ${{ inputs.p12-password }}

    - name: Verify signing identities
      shell: bash
      run: |
        set -euo pipefail
        signing_identities="$(security find-identity -v -p codesigning)"
        all_identities="$(security find-identity -v)"
        echo "$all_identities"
        grep -q 'Apple Distribution' <<< "$signing_identities" || {
          echo "::error::The imported p12 does not contain an Apple Distribution identity."
          exit 1
        }
        # Apple's portal/API calls this Mac Installer Distribution, while the
        # issued certificate's Keychain name remains the legacy label below.
        grep -Eq 'Mac Installer Distribution|3rd Party Mac Developer Installer' <<< "$all_identities" || {
          echo "::error::The imported p12 does not contain a Mac Installer Distribution certificate."
          exit 1
        }

    - name: Download iOS App Store profile
      id: ios-profiles
      uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
      with:
        bundle-id: com.nickysemenza.cubby
        profile-type: IOS_APP_STORE
        issuer-id: ${{ inputs.api-issuer-id }}
        api-key-id: ${{ inputs.api-key-id }}
        api-private-key: ${{ inputs.api-key-p8 }}

    - name: Download macOS App Store profile
      id: macos-profiles
      uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
      with:
        bundle-id: com.nickysemenza.cubby
        profile-type: MAC_APP_STORE
        issuer-id: ${{ inputs.api-issuer-id }}
        api-key-id: ${{ inputs.api-key-id }}
        api-private-key: ${{ inputs.api-key-p8 }}

    - name: Archive and distribute both apps
      shell: bash
      env:
        MARKETING_VERSION: ${{ inputs.version }}
        IOS_BUILD_NUMBER: ${{ inputs.ios-build-number }}
        MACOS_BUILD_NUMBER: ${{ inputs.macos-build-number }}
        IOS_PROFILES_JSON: ${{ steps.ios-profiles.outputs.profiles }}
        MACOS_PROFILES_JSON: ${{ steps.macos-profiles.outputs.profiles }}
        TESTFLIGHT_OUTPUT_DIR: ${{ runner.temp }}/CubbyTestFlight
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.api-key-id }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.api-issuer-id }}
      run: apps/apple/scripts/testflight.sh '${{ inputs.mode }}'

    - name: Remove temporary service credentials
      if: always()
      shell: bash
      run: |
        if [[ -n "${ASC_API_KEY_PATH:-}" ]]; then rm -f "$ASC_API_KEY_PATH"; fi
        rm -f "$HOME/.sentryclirc"
