# The rules file is AGENTS.md (root plus apps/web, apps/apple). Codex discovers
# AGENTS.md natively and per-directory, so work below apps/web also picks up
# apps/web/AGENTS.md; Claude Code >= 2.1.277 falls back to AGENTS.md when a
# folder has no CLAUDE.md. One canonical rules file, shared by both, no drift —
# do not add a CLAUDE.md pointer, it would shadow AGENTS.md for Claude Code.
# Keep the main model user/session-owned. Low effort overrides the user-level
# effort default for this repo; explicit session choices and the escalation
# rules in model-routing.md win.
model_reasoning_effort = "low"

# Filter before returning output; retain full logs in ignored artifacts/ for
# targeted read-back. This history cap is a fallback, not a diagnostic summary.
tool_output_token_limit = 24000

# Subagents are for parallel, read-heavy work; see docs/agents/model-routing.md.
[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "low"

[mcp_servers.cubby-localhost]
url = "http://localhost:3000/api/mcp"
